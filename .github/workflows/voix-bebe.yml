name: Voix de l'Éveil de bébé
on:
  workflow_dispatch:
jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - {phase: fr, part: "0/3"}
          - {phase: fr, part: "1/3"}
          - {phase: fr, part: "2/3"}
          - {phase: ar, part: "0/4"}
          - {phase: ar, part: "1/4"}
          - {phase: ar, part: "2/4"}
          - {phase: ar, part: "3/4"}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          if [ "${{ matrix.phase }}" = "ar" ]; then pip install -q chatterbox-tts || echo "chatterbox non installé"; fi
          pip install -q "piper-tts==1.2.0" "kokoro>=0.9.4" soundfile faster-whisper numpy
      - name: Voix vérifiées
        env:
          LISTE: tools/bebe-liste.json
        run: python3 tools/voix-bebe.py ${{ matrix.phase }} ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ strategy.job-index }}
          path: sortie-*
          retention-days: 5
