 w:{ar:"وَإِنَّ الْكَذِبَ يَهْدِي إِلَى الْفُجُورِ، وَإِنَّ الْفُجُورَ يَهْدِي إِلَى النَّارِ",src:"Bukhari 6094",fr:"« Le mensonge mène à la perversité, et la perversité mène au Feu. Un homme continue de mentir jusqu'à être inscrit auprès d'Allah comme grand menteur. » Dans un couple, un seul mensonge découvert peut détruire des années de confiance.",en:"“Lying leads to wickedness, and wickedness leads to the Fire. A man keeps lying until he is written with Allah as a great liar.” In a couple, one discovered lie can destroy years of trust.",tar:"«ولا يزال الرجل يكذب حتى يُكتب عند الله كذّاباً». وفي الزواج قد تهدم كذبة واحدة ثقة سنوات."},
 h:{ar:"إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ",src:"Bukhari 6094",fr:"Le même hadith commence ainsi : « La véracité mène à la bonté, et la bonté mène au Paradis. » Allah promet : « Dites des paroles justes : Il améliorera vos actions et vous pardonnera vos péchés » (33:70-71).",en:"The same hadith begins: “Truthfulness leads to righteousness, and righteousness leads to Paradise.” Allah promises: “Speak words of truth: He will amend your deeds and forgive your sins” (33:70-71).",tar:"وقال تعالى: ﴿وَقُولُوا قَوْلًا سَدِيدًا، يُصْلِحْ لَكُمْ أَعْمَالَكُمْ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ﴾ (الأحزاب: 70-71)."},
 steps:{fr:["Avant de répondre, respirez et posez-vous : « Est-ce vrai ? »","Si vous ne pouvez pas tout dire, taisez-vous plutôt que d'inventer.","Réparez un mensonge passé si cela ne cause pas plus de mal.","Ne promettez que ce que vous pouvez tenir.","Le soir, faites le compte de votre journée : ai-je dit vrai ?"],
  en:["Before answering, breathe and ask yourself: “Is it true?”","If you cannot say everything, stay silent rather than invent.","Repair a past lie if it does not cause more harm.","Only promise what you can keep.","In the evening, review your day: did I speak the truth?"],
  ar:["قبل أن تجيب تنفّس واسأل نفسك: «هل هذا صحيح؟»","إن لم تستطع قول كل شيء فاسكت بدل أن تختلق.","أصلح كذبة سابقة إن لم يترتب على ذلك ضرر أكبر.","لا تَعِد إلا بما تستطيع الوفاء به.","حاسب نفسك في المساء: هل صدقت اليوم؟"]}},
{id:"medisance",t:{fr:"Médisance et calomnie",en:"Backbiting and slander",ar:"الغيبة والنميمة"},
 w:{ar:"وَلَا يَغْتَب بَّعْضُكُم بَعْضًا ۚ أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ",src:"Coran 49:12",fr:"« Ne médisez pas les uns des autres. L'un de vous aimerait-il manger la chair de son frère mort ? Vous en auriez horreur. » Parler des défauts de sa belle-famille, de son conjoint ou des voisins en leur absence, c'est cela.",en:"“Do not backbite one another. Would one of you like to eat the flesh of his dead brother? You would detest it.” Talking about the faults of in-laws, a spouse or neighbours in their absence is exactly that.",tar:"والحديث عن عيوب الأصهار أو الزوج أو الجيران في غيابهم هو من هذا."},
 h:{ar:"مَنْ يَضْمَنْ لِي مَا بَيْنَ لَحْيَيْهِ وَمَا بَيْنَ رِجْلَيْهِ أَضْمَنْ لَهُ الْجَنَّةَ",src:"Bukhari 6474",fr:"« Celui qui me garantit ce qui est entre ses mâchoires et ce qui est entre ses jambes, je lui garantis le Paradis. » Garder sa langue est un chemin direct vers le Paradis.",en:"“Whoever guarantees me what is between his jaws and what is between his legs, I guarantee him Paradise.” Guarding the tongue is a direct path to Paradise.",tar:"فحفظ اللسان طريق مباشر إلى الجنة."},
 steps:{fr:["Quand la conversation tourne à la critique d'un absent, changez de sujet.","Si vous ne pouvez pas, levez-vous poliment et partez.","Dites du bien de la personne dont vous avez médit, devant ceux qui ont entendu.","Invoquez Allah pour elle : c'est une manière de réparer.","Quittez les groupes WhatsApp qui vivent de rumeurs."],
  en:["When the conversation turns to criticising someone absent, change the subject.","If you cannot, get up politely and leave.","Speak well of the person you backbit, in front of those who heard.","Pray to Allah for them: it is a way of making amends.","Leave WhatsApp groups that live on rumours."],
  ar:["إذا تحوّل الحديث إلى ذمّ غائب فغيّر الموضوع.","وإن لم تستطع فانصرف بلطف.","اذكر من اغتبته بخير أمام من سمعوك.","ادعُ الله له، فهذا من الإصلاح.","اخرج من مجموعات واتساب التي تعيش على الإشاعات."]}},
{id:"colere",t:{fr:"Colère, insultes et dureté en famille",en:"Anger, insults and harshness at home",ar:"الغضب والسبّ والقسوة في البيت"},
 w:{ar:"لَيْسَ الْمُؤْمِنُ بِالطَّعَّانِ وَلَا اللَّعَّانِ وَلَا الْفَاحِشِ وَلَا الْبَذِيءِ",src:"Tirmidhi 1977",fr:"« Le croyant n'est ni diffamateur, ni maudisseur, ni grossier, ni vulgaire. » Les mots durs blessent le conjoint et marquent les enfants pour longtemps ; et il n'y a jamais d'excuse à frapper ou à menacer.",en:"“The believer is not a slanderer, nor one who curses, nor obscene, nor vulgar.” Harsh words wound the spouse and mark children for a long time; and there is never an excuse for hitting or threatening.",tar:"والكلمات القاسية تجرح الزوج وتترك أثراً طويلاً في الأطفال، ولا عذر أبداً للضرب أو التهديد."},
 h:{ar:"وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ ۗ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ",src:"Coran 3:134",fr:"« … ceux qui maîtrisent leur colère et pardonnent aux gens. Et Allah aime les bienfaisants. » Chaque colère retenue vous rapproche de l'amour d'Allah.",en:"“…those who restrain anger and pardon people. And Allah loves the doers of good.” Every anger held back brings you closer to Allah's love.",tar:"فكل غضب تكظمه يقرّبك من محبة الله."},
 steps:{fr:["Dès que la colère monte : taisez-vous et dites « A'oûdhou billâhi mina-ch-chaytâni-r-rajîm ».","Si vous êtes debout, asseyez-vous ; sinon, sortez quelques minutes (Abou Daoud 4782).","Faites vos ablutions avant de reprendre la discussion.","Demandez pardon à votre conjoint et à vos enfants, même s'ils sont petits.","Si la violence se répète, parlez-en à un imam ou à un professionnel : on peut changer."],
  en:["As soon as anger rises: stay silent and say “A'udhu billahi mina-sh-shaytani-r-rajim”.","If you are standing, sit down; otherwise, step out for a few minutes (Abu Dawud 4782).","Make wudu before resuming the discussion.","Ask forgiveness from your spouse and your children, even small ones.","If violence repeats, talk to an imam or a professional: change is possible."],
  ar:["عند بداية الغضب: اسكت وقل «أعوذ بالله من الشيطان الرجيم».","إن كنت قائماً فاجلس، وإلا فاخرج دقائق (أبو داود 4782).","توضّأ قبل أن تعود إلى النقاش.","اطلب العفو من زوجك وأولادك ولو كانوا صغاراً.","إن تكرر العنف فتحدّث إلى إمام أو مختص، فالتغيير ممكن."]}},
{id:"alcool",t:{fr:"Alcool et drogue",en:"Alcohol and drugs",ar:"الخمر والمخدرات"},
 w:{ar:"إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنصَابُ وَالْأَزْلَامُ رِجْسٌ مِّنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ",src:"Coran 5:90",fr:"« Le vin, les jeux de hasard, les pierres dressées et les flèches divinatoires ne sont qu'une souillure, œuvre du diable : écartez-vous-en. » Le Prophète ﷺ a dit : « Tout enivrant est interdit » (Muslim 2003). La drogue détruit la santé, l'argent du foyer et la confiance de la famille.",en:"“Wine, gambling, stone altars and divining arrows are only filth, the work of Satan: avoid them.” The Prophet ﷺ said: “Every intoxicant is forbidden” (Muslim 2003). Drugs destroy health, household money and the family's trust.",tar:"وقال ﷺ: «كل مسكر خمر، وكل مسكر حرام» (مسلم 2003). والمخدرات تدمّر الصحة ومال البيت وثقة الأسرة."},
 h:{ar:"قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ",src:"Coran 39:53",fr:"« Dis : Ô Mes serviteurs qui avez commis des excès à votre propre détriment, ne désespérez pas de la miséricorde d'Allah. Allah pardonne tous les péchés. » Peu importe depuis combien de temps : la porte est ouverte.",en:"“Say: O My servants who have transgressed against themselves, do not despair of the mercy of Allah. Allah forgives all sins.” No matter for how long: the door is open.",tar:"مهما طال الزمن، فالباب مفتوح."},
 steps:{fr:["Parlez à un médecin ou un centre de santé : la dépendance se soigne, et arrêter brutalement peut être dangereux.","Éloignez-vous des lieux et des amis liés à la consommation.","Ne gardez pas d'argent liquide en trop sur vous les premières semaines.","Choisissez une personne de confiance à appeler quand l'envie vient.","Remplacez le moment de consommation par la marche, la prière ou un ami."],
  en:["Talk to a doctor or a health centre: addiction can be treated, and stopping abruptly can be dangerous.","Stay away from places and friends linked to using.","Do not carry extra cash during the first weeks.","Choose a trusted person to call when the urge comes.","Replace the time of using with walking, prayer or a friend."],
  ar:["تحدّث إلى طبيب أو مركز صحي، فالإدمان يُعالج، والتوقف المفاجئ قد يكون خطراً.","ابتعد عن الأماكن والأصدقاء المرتبطين بالتعاطي.","لا تحمل نقوداً زائدة في الأسابيع الأولى.","اختر شخصاً تثق به تتصل به عند الرغبة.","استبدل وقت التعاطي بالمشي أو الصلاة أو صديق."]}},
{id:"paris",t:{fr:"Paris sportifs et jeux d'argent",en:"Sports betting and gambling",ar:"المراهنات والقمار"},
 w:{ar:"إِنَّمَا يُرِيدُ الشَّيْطَانُ أَن يُوقِعَ بَيْنَكُمُ الْعَدَاوَةَ وَالْبَغْضَاءَ فِي الْخَمْرِ وَالْمَيْسِرِ وَيَصُدَّكُمْ عَن ذِكْرِ اللَّهِ وَعَنِ الصَّلَاةِ",src:"Coran 5:91",fr:"« Le diable ne veut que jeter entre vous l'inimitié et la haine par le vin et le jeu de hasard, et vous détourner du rappel d'Allah et de la prière. » Les paris vident la poche du foyer, créent des dettes et des disputes.",en:"“Satan only wants to cause enmity and hatred between you through wine and gambling, and to turn you away from the remembrance of Allah and from prayer.” Betting empties the household's pocket and creates debts and quarrels.",tar:"والمراهنات تفرغ جيب الأسرة وتجلب الديون والخصومات."},
 h:{ar:"وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا، وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ",src:"Coran 65:2-3",fr:"« Quiconque craint Allah, Il lui donne une issue et le pourvoit de là où il ne s'attend pas. » La vraie richesse vient du travail honnête et de la baraka, pas d'un ticket.",en:"“Whoever fears Allah, He will make a way out for him and provide for him from where he does not expect.” True wealth comes from honest work and barakah, not from a ticket.",tar:"فالرزق الحقيقي يأتي من العمل الحلال والبركة، لا من ورقة رهان."},
 steps:{fr:["Supprimez aujourd'hui les applications et les comptes de paris.","Ne passez plus devant les points de paris ; changez d'itinéraire.","Confiez la gestion de votre argent à votre conjoint ou à une personne sûre pour un temps.","Notez ce que vous avez perdu : la vérité des chiffres aide à arrêter.","Mettez de côté chaque semaine la somme que vous auriez pariée : vous verrez ce qu'elle devient."],
  en:["Delete betting apps and accounts today.","Stop walking past betting shops; change your route.","Let your spouse or a trusted person manage your money for a while.","Write down what you have lost: the truth of the numbers helps you stop.","Each week, put aside the amount you would have bet: see what it becomes."],
  ar:["احذف اليوم تطبيقات وحسابات المراهنة.","لا تمرّ بأماكن المراهنات، وغيّر طريقك.","دع زوجك أو شخصاً أميناً يدير مالك مدة من الزمن.","اكتب ما خسرته، فحقيقة الأرقام تعين على التوقف.","ادّخر كل أسبوع المبلغ الذي كنت ستراهن به، وانظر ماذا يصير."]}},
{id:"argent",t:{fr:"Argent malhonnête : vol, corruption, tricherie",en:"Dishonest money: theft, bribery, cheating",ar:"المال الحرام: السرقة والرشوة والغش"},
 w:{ar:"وَلَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ وَتُدْلُوا بِهَا إِلَى الْحُكَّامِ",src:"Coran 2:188",fr:"« Ne dévorez pas vos biens entre vous illicitement, et ne vous en servez pas pour corrompre les juges. » Le Prophète ﷺ a maudit celui qui donne un pot-de-vin et celui qui le reçoit (Abou Daoud 3580). Ce qui nourrit le foyer de façon illicite retire la baraka.",en:"“Do not consume one another's wealth unjustly, nor use it to bribe the authorities.” The Prophet ﷺ cursed the one who gives a bribe and the one who takes it (Abu Dawud 3580). Feeding the home unlawfully removes barakah.",tar:"ولعن رسول الله ﷺ الراشي والمرتشي (أبو داود 3580). والمال الحرام ينزع البركة من البيت."},
 h:{ar:"إِنَّكَ لَنْ تَدَعَ شَيْئًا لِلَّهِ إِلَّا أَبْدَلَكَ اللَّهُ بِهِ مَا هُوَ خَيْرٌ لَكَ مِنْهُ",src:"Ahmad 23074",fr:"« Tu ne laisseras rien pour Allah sans qu'Allah ne te le remplace par mieux. » L'argent auquel vous renoncez aujourd'hui pour Allah n'est pas perdu.",en:"“You will not leave anything for the sake of Allah except that Allah will replace it with something better for you.” The money you give up today for Allah is not lost.",tar:"فالمال الذي تتركه اليوم لله ليس ضائعاً."},
 steps:{fr:["Arrêtez dès aujourd'hui toute nouvelle entrée d'argent illicite.","Rendez ce qui a été pris à son propriétaire, discrètement si besoin, ou à ses héritiers.","Si vous ne pouvez pas retrouver la personne, donnez l'équivalent en aumône en son nom.","Cherchez un revenu halal, même plus petit : la baraka compense.","Parlez-en à un imam pour les cas compliqués."],
  en:["Stop any new unlawful income from today.","Return what was taken to its owner, discreetly if needed, or to their heirs.","If you cannot find the person, give the equivalent in charity on their behalf.","Look for halal income, even smaller: barakah makes up for it.","Talk to an imam about complicated cases."],
  ar:["أوقف من اليوم كل دخل حرام جديد.","ردّ ما أُخذ إلى صاحبه، ولو سراً، أو إلى ورثته.","إن لم تجد صاحبه فتصدّق بمثله عنه.","ابحث عن رزق حلال ولو كان أقل، فالبركة تعوّض.","استشر إماماً في الحالات المعقدة."]}},
{id:"parents",t:{fr:"Désobéir ou manquer de respect aux parents",en:"Disobeying or disrespecting parents",ar:"عقوق الوالدين"},
 w:{ar:"فَلَا تَقُل لَّهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًا كَرِيمًا",src:"Coran 17:23",fr:"« Ne leur dis même pas « ouf », ne les brusque pas, et adresse-leur des paroles respectueuses. » Le Prophète ﷺ a cité la désobéissance aux parents parmi les plus grands péchés (Bukhari 2654).",en:"“Do not even say “uff” to them, do not repel them, and speak to them with respect.” The Prophet ﷺ listed disobedience to parents among the greatest sins (Bukhari 2654).",tar:"وعدّ النبي ﷺ عقوق الوالدين من أكبر الكبائر (البخاري 2654)."},
 h:{ar:"رِضَى الرَّبِّ فِي رِضَى الْوَالِدِ",src:"Tirmidhi 1899",fr:"« La satisfaction du Seigneur est dans la satisfaction du père (et de la mère). » Et même si vos parents sont décédés, vous pouvez encore les honorer : « Seigneur, fais-leur miséricorde comme ils m'ont élevé tout petit » (17:24).",en:"“The Lord's pleasure lies in the parent's pleasure.” And even if your parents have passed away, you can still honour them: “My Lord, have mercy on them as they raised me when I was small” (17:24).",tar:"وإن كان والداك قد توفيا فما زال البرّ ممكناً: ﴿رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا﴾ (الإسراء: 24)."},
 steps:{fr:["Appelez vos parents aujourd'hui, simplement pour prendre des nouvelles.","Demandez-leur pardon pour une parole ou un oubli précis.","Prévoyez chaque mois une aide, même petite, selon vos moyens.","Gardez l'équilibre : honorer ses parents sans négliger les droits de son conjoint.","S'ils sont décédés : invoquez pour eux, donnez une aumône en leur nom, visitez leurs amis."],
  en:["Call your parents today, simply to ask how they are.","Ask their forgiveness for a specific word or neglect.","Plan some help every month, even small, according to your means.","Keep the balance: honour your parents without neglecting your spouse's rights.","If they have passed away: pray for them, give charity on their behalf, visit their friends."],
  ar:["اتصل بوالديك اليوم لتطمئن عليهما فقط.","اطلب منهما العفو عن كلمة أو تقصير بعينه.","خصّص كل شهر عوناً ولو قليلاً بحسب قدرتك.","حافظ على التوازن: برّ الوالدين دون إهمال حقوق الزوج.","إن كانا متوفيين: ادعُ لهما، وتصدّق عنهما، وصِل أصدقاءهما."]}},
{id:"charlatan",t:{fr:"Charlatans, voyance et sorcellerie",en:"Charlatans, fortune-telling and sorcery",ar:"الدجالون والعرافة والسحر"},
 w:{ar:"مَنْ أَتَى عَرَّافًا فَسَأَلَهُ عَنْ شَيْءٍ لَمْ تُقْبَلْ لَهُ صَلَاةٌ أَرْبَعِينَ لَيْلَةً",src:"Muslim 2230",fr:"« Celui qui va voir un devin et l'interroge sur quelque chose, sa prière n'est pas acceptée pendant quarante nuits. » Chercher un charme pour retenir son conjoint ou nuire à une co-épouse, c'est mettre sa foi en danger.",en:"“Whoever goes to a fortune-teller and asks him about something, his prayer is not accepted for forty nights.” Seeking a charm to keep a spouse or harm a co-wife puts one's faith in danger.",tar:"والبحث عن حِرز لاستمالة الزوج أو لإيذاء الضرّة تعريض للإيمان للخطر."},
 h:{ar:"وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ",src:"Coran 65:3",fr:"« Et quiconque place sa confiance en Allah, Il lui suffit. » Allah dit aussi : « Je suis proche : Je réponds à l'appel de celui qui M'invoque » (2:186). Vous n'avez besoin d'aucun intermédiaire.",en:"“And whoever relies upon Allah, He is sufficient for him.” Allah also says: “I am near: I answer the call of the one who calls upon Me” (2:186). You need no intermediary.",tar:"وقال تعالى: ﴿فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ﴾ (البقرة: 186)، فلا تحتاج إلى وسيط."},
 steps:{fr:["Ne retournez plus chez le charlatan et effacez son numéro.","Débarrassez-vous des objets, gris-gris ou « protections » qu'il a donnés.","Protégez-vous par les invocations : Âyat al-Koursî, Al-Ikhlâs, Al-Falaq et An-Nâs matin et soir.","Pour un problème de couple, parlez à un imam ou à un conseiller, pas à un devin.","Pour une maladie, consultez un médecin : chercher le remède fait partie de la foi."],
  en:["Do not go back to the charlatan and delete his number.","Get rid of the objects, amulets or “protections” he gave.","Protect yourself with remembrance: Ayat al-Kursi, Al-Ikhlas, Al-Falaq and An-Nas morning and evening.","For a marriage problem, talk to an imam or a counsellor, not a fortune-teller.","For an illness, see a doctor: seeking a cure is part of faith."],
  ar:["لا تعد إلى الدجال واحذف رقمه.","تخلّص من الأشياء والتمائم و«الحُرُز» التي أعطاك إياها.","تحصّن بالأذكار: آية الكرسي والإخلاص والمعوذتين صباحاً ومساءً.","لمشكلة زوجية تحدّث إلى إمام أو مستشار لا إلى عرّاف.","وللمرض راجع الطبيب، فالتداوي من الإيمان."]}}
];

function twWeek(c){
  const out=[];for(let k=6;k>=0;k--){const d=new Date(today);d.setDate(d.getDate()-k);const s=iso(d);out.push([s,c.days[s]||(s<c.start?"before":"")])}

}

  return `<section class="hello"><h1>${t("twPick")}</h1><p>${t("twPickSub")}</p></section>
  <div class="tw-grid">${TAWBA_SINS.map(s=>`<button class="tw-pick" data-tw-pick="${s.id}">${L3(s.t)}</button>`).join("")}</div>
  <div class="card"><label for="tw-other">${t("twOther")}<input id="tw-other" maxlength="80" placeholder="${t("twOtherPh")}"></label><button class="btn" id="tw-other-go">${t("twGo")}</button></div>`;
}
function twCombat(c){
  const n=twClean(c), td=c.days[iso(today)], s=twSin(c), [ok,gk]=twGrade(c);
  const w=s?s.w:TAWBA_FEAR[dayIdx()%TAWBA_FEAR.length], h=s?s.h:TAWBA_HOPE[dayIdx()%TAWBA_HOPE.length];
  const steps=s?L3(s.steps):[t("twC1"),t("twC2"),t("twC3"),t("twC4")];
  return `<section class="hello tw-hello"><span class="eyebrow">${t("mTawba")}</span><h1>${esc(twName(c))}</h1>
   <button class="tw-eye" data-tw-hide="${c.id}">${c.hide?"👁 "+t("twShow"):"🙈 "+t("twHide")}</button></section>
  <div class="card tw-counter"><div class="tw-big">${n}</div><div class="tw-unit">${n===1?t("twDay"):t("twDays")}</div>
   <p class="note" style="margin:0">${fmt(t("twSince"),{d:twDate(c.last)})} · ${fmt(t("twBest"),{n:Math.max(c.best||0,n)})}</p>
   <span class="eyebrow" style="margin-top:6px">${t("twToday")}</span>
   ${td==="ok"?`<p class="tw-msg ok">✓ ${t("twHeldMsg")}</p>`:td==="fall"?`<p class="tw-msg">${t("twFellMsg")}</p>`:`<div class="tw-check"><button class="btn" data-tw-held="${c.id}">✓ ${t("twHeld")}</button><button class="btn ghost" data-tw-fell="${c.id}">${t("twFell")}</button></div>`}
  </div>
  <button class="tw-sos" data-tw-sos="${c.id}"><b>🆘 ${t("twSOS")}</b><span>${t("twSOSsub")}</span></button>
  <div class="card"><span class="eyebrow">${t("twWeek")}</span><div class="tw-week">${twWeek(c).map(([d,st])=>`<span class="tw-dot ${st}" title="${d}">${new Date(d+"T12:00:00").toLocaleDateString(S.lang==="ar"?"ar":S.lang,{weekday:"narrow"})}</span>`).join("")}</div>
   <p class="tw-grade"><b>${ok}/7</b> · ${t(gk)}</p></div>
  ${versePair(w,"warn")}${versePair(h,"hope")}
  <div class="card"><h3>${t("twPlan")}</h3>${steps.map((x,k)=>`<label class="tw-step"><input type="checkbox" data-tw-step="${k}" ${c.steps[k]?"checked":""}><span>${x}</span></label>`).join("")}
   ${["alcool","paris"].includes(c.sin)?`<p class="note" style="margin:0">${t("twDoctor")}</p>`:""}</div>
  <div class="card"><h3>🔒 ${t("twJournal")}</h3><textarea id="tw-note" rows="3" placeholder="${t("twJournalPh")}"></textarea><button class="btn" id="tw-note-save">${t("twSaveNote")}</button>
   ${c.notes.slice().reverse().map((x,k)=>`<div class="tw-note"><span>${twDate(x.d)}</span><p>${esc(x.txt)}</p><button class="tw-ndel" data-tw-ndel="${c.notes.length-1-k}">${t("twDel")}</button></div>`).join("")}</div>
  ${condCard()}
  <button class="tw-remove" data-tw-remove="${c.id}">${S.tw.sure===c.id?t("twRemoveSure"):t("twRemove")}</button>`;
}
function twSOS(c){
  const f=TAWBA_FEAR[3], h=TAWBA_HOPE[dayIdx()%TAWBA_HOPE.length];
  return `<section class="hello tw-hello"><span class="eyebrow">🆘 ${esc(twName(c))}</span><h1>${t("twSOSTitle")}</h1><p>${t("twSOSWait")}</p></section>
  <div class="card tw-timer"><svg viewBox="0 0 120 120" width="150" height="150"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--soft)" stroke-width="10"/><circle id="tw-ring" cx="60" cy="60" r="52" fill="none" stroke="var(--gold)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0" transform="rotate(-90 60 60)"/></svg><b id="tw-time">10:00</b></div>
  <div class="card"><ol class="tw-sos-steps">${["twS1","twS2","twS3","twS4","twS5","twS6"].map(k=>`<li>${t(k)}</li>`).join("")}</ol></div>
  <button class="tw-dhikr" id="tw-dhikr"><span class="ar">أَسْتَغْفِرُ اللَّهَ</span><b id="tw-dn">${S.tw.dn||0}</b><small>${t("twDhikr")}</small></button>
  ${versePair(f,"warn")}${versePair(h,"hope")}
  <button class="btn sch-go" data-tw-passed="${c.id}">✓ ${t("twPassed")}</button>`;
}
function twFall(c){
  const h1=TAWBA_HOPE[2], h2=TAWBA_HOPE[5];
  return `<section class="hello tw-hello"><h1>${t("twFallTitle")}</h1><p>${t("twFallSub")}</p></section>
  ${versePair(h1,"hope")}
  <div class="card tw-fall"><ol>
   <li>${t("twF1")}<p class="ar verse tw-sayyid">${SAYYID}</p>${S.lang!=="ar"?`<p class="tw-tr">${L3(SAYYID_TR)}</p>`:""}</li>
   <li>${t("twF2")}</li><li>${t("twF3")}</li><li>${t("twF4")}</li></ol></div>
  ${versePair(h2,"hope")}
  <button class="btn sch-go" data-tw-restart="${c.id}">${t("twRestart")} ›</button>`;
}

// ---------- Actions ----------
function twGo(v,cid){S.tab="more";S.sub="tawba";S.tw={v,cid};save();render();scrollTo(0,0)}
function twCreate(sin,title){
  const c={id:"c"+Date.now(),sin,title:title||"",start:iso(today),last:iso(today),best:0,falls:0,days:{},steps:{},notes:[],hide:false};
  TW.combats.push(c);save();twGo("combat",c.id);
}
function twHeld(c){
  c.days[iso(today)]="ok";const n=twClean(c);c.best=Math.max(c.best||0,n);save();
  const m=TW_MILES.filter(x=>x<=n).pop();
  if(m&&!(c.miles||[]).includes(m)){c.miles=[...(c.miles||[]),m];save();toast(`<div class="bt"><div><span>✦ ${t("mTawba")}</span><b>${fmt(t("twMile"),{n:m})}</b></div></div>`,true)}
  else toast(t("twHeldMsg"),true);
  const sy=scrollY;render();scrollTo(0,sy);
}
function twFell(c){
  c.best=Math.max(c.best||0,twClean(c));c.days[iso(today)]="fall";c.last=iso(today);c.falls=(c.falls||0)+1;c.miles=[];save();twGo("fall",c.id);
}
let twTimer=null;
function twStartTimer(){
  clearInterval(twTimer);const end=Date.now()+600000;
  const tick=()=>{const el=document.getElementById("tw-time"),ring=document.getElementById("tw-ring");if(!el){clearInterval(twTimer);return}
    const r=Math.max(0,end-Date.now()),m=Math.floor(r/60000),s=Math.floor(r%60000/1000);el.textContent=`${m}:${String(s).padStart(2,"0")}`;
    if(ring)ring.setAttribute("stroke-dashoffset",(326.7*(1-r/600000)).toFixed(1));if(r<=0)clearInterval(twTimer)};
  tick();twTimer=setInterval(tick,1000);
}
document.addEventListener("click",e=>{
  const el=e.target.closest&&e.target.closest("[data-tw-open],[data-tw-pick],[data-tw-held],[data-tw-fell],[data-tw-sos],[data-tw-passed],[data-tw-restart],[data-tw-hide],[data-tw-remove],[data-tw-ndel],#tw-new,#tw-other-go,#tw-note-save,#tw-dhikr");
  if(!el) return;
  const d=el.dataset, c=TW.combats.find(x=>x.id===(d.twOpen||d.twHeld||d.twFell||d.twSos||d.twPassed||d.twRestart||d.twHide||d.twRemove||S.tw.cid));
  if(d.twOpen){twGo("combat",d.twOpen);return}
  if(el.id==="tw-new"){twGo("pick");return}
  if(d.twPick){twCreate(d.twPick);return}
  if(el.id==="tw-other-go"){const v=(document.getElementById("tw-other").value||"").trim();if(v)twCreate("custom",v);else document.getElementById("tw-other").focus();return}
  if(!c) return;
  if(d.twHeld){twHeld(c);return}
  if(d.twFell){twFell(c);return}
  if(d.twSos){S.tw.dn=0;twGo("sos",c.id);twStartTimer();return}
  if(d.twPassed){clearInterval(twTimer);toast(t("twPassedMsg"),true);twGo("combat",c.id);return}
  if(d.twRestart){twGo("combat",c.id);return}
  if(d.twHide){c.hide=!c.hide;save();const sy=scrollY;render();scrollTo(0,sy);return}
  if(d.twRemove){if(S.tw.sure===c.id){TW.combats=TW.combats.filter(x=>x!==c);S.tawba=TW;twGo("home")}else{S.tw.sure=c.id;const sy=scrollY;render();scrollTo(0,sy)}return}
  if(d.twNdel!==undefined){c.notes.splice(+d.twNdel,1);save();const sy=scrollY;render();scrollTo(0,sy);return}
  if(el.id==="tw-note-save"){const v=(document.getElementById("tw-note").value||"").trim();if(!v)return;c.notes.push({d:iso(today),txt:v.slice(0,1000)});save();toast(t("twNoteSaved"),true);const sy=scrollY;render();scrollTo(0,sy);return}
  if(el.id==="tw-dhikr"){S.tw.dn=(S.tw.dn||0)+1;document.getElementById("tw-dn").textContent=S.tw.dn;if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){};return}
});
document.addEventListener("change",e=>{
  const el=e.target; if(!el.matches||!el.matches("[data-tw-step]")) return;
  const c=TW.combats.find(x=>x.id===S.tw.cid); if(!c) return;
  c.steps[el.dataset.twStep]=el.checked; save();
});
document.addEventListener("click",e=>{
  if(S.sub!=="tawba"||!S.tw||S.tw.v==="home") return;
  if(!(e.target.closest&&e.target.closest("#back"))) return;
  e.stopPropagation();e.preventDefault();tawbaBack();
},true);
function tawbaBack(){
  if(S.sub!=="tawba"||!S.tw||S.tw.v==="home") return false;
  clearInterval(twTimer);
  const v=S.tw.v;S.tw={v:(v==="sos"||v==="fall")?"combat":"home",cid:S.tw.cid};save();render();scrollTo(0,0);return true;
}
function tawbaNotif(){
  if(!TW.combats.length) return null;
  return {id:500,title:"DJAMILLAH HAYAT",body:t("twNotif"),schedule:{on:{hour:21,minute:0},allowWhileIdle:true}};
}
BADGES.push(
 ["tw7",{fr:"7 jours pour Allah",en:"7 days for Allah",ar:"٧ أيام لله"},{fr:"Tenir 7 jours dans un combat",en:"Hold on for 7 days in a struggle",ar:"اصمد ٧ أيام في معركة"},()=>TW.combats.some(c=>Math.max(c.best||0,twClean(c))>=7)],
 ["tw40",{fr:"40 jours pour Allah",en:"40 days for Allah",ar:"٤٠ يوماً لله"},{fr:"Tenir 40 jours dans un combat",en:"Hold on for 40 days in a struggle",ar:"اصمد ٤٠ يوماً في معركة"},()=>TW.combats.some(c=>Math.max(c.best||0,twClean(c))>=40)]
);
Object.assign(BADGE_ICON,{tw7:"7j",tw40:"40"});
Object.assign(MOTIF,{tawba:`<path d="M40 60c-12-8-20-15-20-25a10 10 0 0 1 20-4 10 10 0 0 1 20 4c0 10-8 17-20 25z" fill="${IC.cream}"/><path d="M40 22v-8M30 25l-4-6M50 25l4-6" stroke="${IC.gold}" stroke-width="2.6" stroke-linecap="round"/><path d="M34 40l5 5 9-10" stroke="${IC.bg}" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`});
document.head.insertAdjacentHTML("beforeend",`<style>
.tw-v .verse{font-size:22px;text-align:center;margin:4px 0}.tw-tr{margin:0;font-size:14.5px;line-height:1.6}
.tw-v.warn{border-color:#C0473F;border-width:1.5px}.tw-v.warn .eyebrow{color:#C0473F}
.tw-v.hope{border-color:var(--gold);border-width:1.5px;background:linear-gradient(180deg,var(--surface),var(--soft))}.tw-v.hope .eyebrow{color:var(--gold)}
.tw-cond ol,.tw-fall ol,.tw-sos-steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.55}
.tw-count{flex:none;width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tw-count b{font-size:20px}.tw-count small{font-size:10px;opacity:.85}
.tw-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.tw-hello h1{font-size:24px}.tw-eye{align-self:flex-start;border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:4px 12px;font-size:12.5px}
.tw-counter{align-items:center;text-align:center}.tw-big{font-family:var(--f-display);font-size:72px;line-height:1;color:var(--accent)}.tw-unit{font-weight:800;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.tw-check{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}.tw-check .btn{padding:12px 8px;font-size:14px}
.tw-msg{margin:0;font-size:14.5px}.tw-msg.ok{color:#2E9E6B;font-weight:700}
.tw-sos{width:100%;border:none;border-radius:18px;padding:16px;background:linear-gradient(135deg,#B3473E,#8E2F2A);color:#fff;display:flex;flex-direction:column;gap:2px;align-items:center;box-shadow:0 6px 18px rgba(142,47,42,.3)}
.tw-sos b{font-size:18px}.tw-sos span{font-size:13px;opacity:.9}
.tw-week{display:flex;justify-content:space-between;gap:4px;margin:6px 0}
.tw-dot{flex:1;aspect-ratio:1;max-width:40px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--soft);color:var(--muted)}
.tw-dot.ok{background:#2E9E6B;color:#fff}.tw-dot.fall{background:#C0473F;color:#fff}.tw-dot.before{opacity:.35}
.tw-grade{margin:0;font-size:15px}.tw-grade b{color:var(--accent);font-size:18px}
.tw-step{flex-direction:row!important;font-weight:400!important;color:var(--ink)!important;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5;padding:4px 0}.tw-step input{width:20px!important;min-width:0;padding:0!important;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}
.tw-step input:checked+span{text-decoration:line-through;color:var(--muted)}
.tw-note{border-top:1px solid var(--line);padding-top:8px}.tw-note span{font-size:12px;color:var(--gold);font-weight:700}.tw-note p{margin:2px 0;white-space:pre-wrap}
.tw-ndel{border:none;background:none;color:var(--muted);font-size:12px;padding:0}
.tw-remove{border:none;background:none;color:var(--muted);font-size:13px;text-decoration:underline;align-self:center;padding:8px}
.tw-timer{align-items:center;position:relative}.tw-timer b{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-family:var(--f-display);color:var(--accent)}
.tw-dhikr{width:100%;border:2px solid var(--gold);background:var(--surface);color:var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tw-dhikr .ar{font-size:26px;color:var(--accent)}.tw-dhikr b{font-size:34px;color:var(--gold);font-family:var(--f-display)}.tw-dhikr small{color:var(--muted);font-size:12.5px}
.tw-sayyid{font-size:19px!important;line-height:1.9;text-align:start;margin:6px 0}
</style>`);

scheduleNotifications();
if(S.tab==="challenges"){S.tab="more";S.sub="challenges"}
render();
</script>
