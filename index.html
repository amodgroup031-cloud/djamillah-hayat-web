  ar:["ابدأ من الصلاة القادمة دون أن تنتظر أن تكون «مستعداً».","اضبط منبّهاً لكل صلاة في هاتفك.","ابدأ بألّا تفوتك الفجر والعشاء، فهما الأصعب.","صلِّ مع زوجك أو في المسجد، فالرفقة تعين.","اقضِ الفوائت شيئاً فشيئاً، صلاة إضافية بعد كل صلاة."]}},
{id:"regard",t:{fr:"Regards et contenus indécents",en:"Indecent looks and content",ar:"النظر والمحتوى المحرّم"},
 w:{ar:"إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا",src:"Coran 17:36",fr:"« L'ouïe, la vue et le cœur : sur tout cela on sera interrogé. » Allah dit aussi : « Dis aux croyants de baisser leurs regards et de préserver leur chasteté » (24:30). Ces images abîment le cœur et le regard porté sur son conjoint.",en:"“Hearing, sight and the heart: about all of these one will be questioned.” Allah also says: “Tell the believing men to lower their gaze and guard their chastity” (24:30). These images damage the heart and the way we see our spouse.",tar:"وقال تعالى: ﴿قُل لِّلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ وَيَحْفَظُوا فُرُوجَهُمْ﴾ (النور: 30). وهذه الصور تفسد القلب ونظرة المرء إلى زوجه."},
 h:{ar:"وَرَجُلٌ دَعَتْهُ امْرَأَةٌ ذَاتُ مَنْصِبٍ وَجَمَالٍ فَقَالَ: إِنِّي أَخَافُ اللَّهَ",src:"Bukhari 660",fr:"Parmi les sept qu'Allah abritera sous Son ombre le Jour où il n'y aura pas d'autre ombre : « un homme invité par une femme de rang et de beauté, qui dit : je crains Allah ». Chaque fois que vous détournez le regard, vous êtes de ceux-là.",en:"Among the seven whom Allah will shade on the Day when there is no shade but His: “a man invited by a woman of status and beauty, who says: I fear Allah”. Each time you look away, you are one of them.",tar:"ومن السبعة الذين يظلهم الله في ظله يوم لا ظل إلا ظله: «رجل دعته امرأة ذات منصب وجمال فقال: إني أخاف الله». وكلما غضضت بصرك كنت من هؤلاء."},
 steps:{fr:["Installez un filtre de contenu sur votre téléphone et laissez quelqu'un de confiance choisir le code.","Ne gardez pas le téléphone au lit : rangez-le hors de la chambre la nuit.","Repérez vos moments à risque (seul, fatigué, tard) et prévoyez autre chose.","Rapprochez-vous de votre conjoint : c'est le chemin licite et béni.","Jeûnez le lundi et le jeudi : le Prophète ﷺ a conseillé le jeûne contre le désir (Bukhari 5066)."],
  en:["Install a content filter on your phone and let someone you trust choose the code.","Do not keep the phone in bed: leave it outside the bedroom at night.","Spot your risky moments (alone, tired, late) and plan something else.","Grow closer to your spouse: it is the lawful and blessed path.","Fast on Mondays and Thursdays: the Prophet ﷺ advised fasting against desire (Bukhari 5066)."],
  ar:["ثبّت برنامج تصفية على هاتفك ودع شخصاً تثق به يختار الرمز.","لا تأخذ الهاتف إلى الفراش، واتركه خارج الغرفة ليلاً.","اعرف أوقات الخطر (الوحدة، التعب، السهر) وخطّط لشيء آخر.","تقرّب إلى زوجك، فهو الطريق الحلال المبارك.","صم الاثنين والخميس، فقد أرشد النبي ﷺ إلى الصوم لكسر الشهوة (البخاري 5066)."]}},
{id:"zina",t:{fr:"Relation interdite hors mariage",en:"A forbidden relationship outside marriage",ar:"علاقة محرّمة خارج الزواج"},
 w:{ar:"وَلَا تَقْرَبُوا الزِّنَىٰ ۖ إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا",src:"Coran 17:32",fr:"« N'approchez pas la fornication : c'est une turpitude et quel mauvais chemin ! » Allah ne dit pas seulement « ne le faites pas », mais « n'approchez pas » : messages, rendez-vous seul à seul, tout ce qui y mène.",en:"“Do not approach adultery: it is an immorality and an evil way.” Allah does not only say “do not do it” but “do not approach”: messages, meeting alone, everything that leads to it.",tar:"لم يقل الله «لا تزنوا» فقط، بل ﴿وَلَا تَقْرَبُوا﴾: الرسائل، والخلوة، وكل ما يؤدي إليه."},
 h:{ar:"إِلَّا مَن تَابَ وَآمَنَ وَعَمِلَ عَمَلًا صَالِحًا فَأُولَٰئِكَ يُبَدِّلُ اللَّهُ سَيِّئَاتِهِمْ حَسَنَاتٍ",src:"Coran 25:70",fr:"Juste après avoir cité ce péché, Allah dit : « sauf celui qui se repent, croit et fait une bonne œuvre : Allah changera leurs mauvaises actions en bonnes. » Pas seulement effacées : changées en bonnes.",en:"Right after mentioning this sin, Allah says: “except whoever repents, believes and does good deeds: Allah will replace their evil deeds with good.” Not only erased: turned into good.",tar:"بعد ذكر هذا الذنب قال تعالى: ﴿إِلَّا مَن تَابَ…﴾، فلا تُمحى السيئات فقط بل تُبدَّل حسنات."},
 steps:{fr:["Coupez le contact aujourd'hui : supprimez le numéro et les conversations.","Ne restez jamais seul à seul avec cette personne.","Si vous êtes marié, réparez votre couple ; sinon, pensez sérieusement au mariage.","Ne racontez pas votre faute aux gens : Allah l'a couverte, couvrez-la aussi.","Remplacez le temps libéré par la prière, le sport, la famille."],
  en:["Cut contact today: delete the number and the conversations.","Never stay alone with that person.","If you are married, repair your relationship; if not, think seriously about marriage.","Do not tell people about your sin: Allah has covered it, cover it too.","Fill the freed time with prayer, sport, family."],
  ar:["اقطع التواصل اليوم: احذف الرقم والمحادثات.","لا تخلُ بهذا الشخص أبداً.","إن كنت متزوجاً فأصلح زواجك، وإلا ففكّر جدياً في الزواج.","لا تحدّث الناس بذنبك، فقد ستره الله فاستره.","املأ الوقت بالصلاة والرياضة والأسرة."]}},
{id:"mensonge",t:{fr:"Le mensonge",en:"Lying",ar:"الكذب"},
 w:{ar:"وَإِنَّ الْكَذِبَ يَهْدِي إِلَى الْفُجُورِ، وَإِنَّ الْفُجُورَ يَهْدِي إِلَى النَّارِ",src:"Bukhari 6094",fr:"« Le mensonge mène à la perversité, et la perversité mène au Feu. Un homme continue de mentir jusqu'à être inscrit auprès d'Allah comme grand menteur. » Dans un couple, un seul mensonge découvert peut détruire des années de confiance.",en:"“Lying leads to wickedness, and wickedness leads to the Fire. A man keeps lying until he is written with Allah as a great liar.” In a couple, one discovered lie can destroy years of trust.",tar:"«ولا يزال الرجل يكذب حتى يُكتب عند الله كذّاباً». وفي الزواج قد تهدم كذبة واحدة ثقة سنوات."},
 h:{ar:"إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ",src:"Bukhari 6094",fr:"Le même hadith commence ainsi : « La véracité mène à la bonté, et la bonté mène au Paradis. » Allah promet : « Dites des paroles justes : Il améliorera vos actions et vous pardonnera vos péchés » (33:70-71).",en:"The same hadith begins: “Truthfulness leads to righteousness, and righteousness leads to Paradise.” Allah promises: “Speak words of truth: He will amend your deeds and forgive your sins” (33:70-71).",tar:"وقال تعالى: ﴿وَقُولُوا قَوْلًا سَدِيدًا، يُصْلِحْ لَكُمْ أَعْمَالَكُمْ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ﴾ (الأحزاب: 70-71)."},
 steps:{fr:["Avant de répondre, respirez et posez-vous : « Est-ce vrai ? »","Si vous ne pouvez pas tout dire, taisez-vous plutôt que d'inventer.","Réparez un mensonge passé si cela ne cause pas plus de mal.","Ne promettez que ce que vous pouvez tenir.","Le soir, faites le compte de votre journée : ai-je dit vrai ?"],
  en:["Before answering, breathe and ask yourself: “Is it true?”","If you cannot say everything, stay silent rather than invent.","Repair a past lie if it does not cause more harm.","Only promise what you can keep.","In the evening, review your day: did I speak the truth?"],
  ar:["قبل أن تجيب تنفّس واسأل نفسك: «هل هذا صحيح؟»","إن لم تستطع قول كل شيء فاسكت بدل أن تختلق.","أصلح كذبة سابقة إن لم يترتب على ذلك ضرر أكبر.","لا تَعِد إلا بما تستطيع الوفاء به.","حاسب نفسك في المساء: هل صدقت اليوم؟"]}},
{id:"medisance",t:{fr:"Médisance et calomnie",en:"Backbiting and slander",ar:"الغيبة والنميمة"},
 w:{ar:"وَلَا يَغْتَب بَّعْضُكُم بَعْضًا ۚ أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ",src:"Coran 49:12",fr:"« Ne médisez pas les uns des autres. L'un de vous aimerait-il manger la chair de son frère mort ? Vous en auriez horreur. » Parler des défauts de sa belle-famille, de son conjoint ou des voisins en leur absence, c'est cela.",en:"“Do not backbite one another. Would one of you like to eat the flesh of his dead brother? You would detest it.” Talking about the faults of in-laws, a spouse or neighbours in their absence is exactly that.",tar:"والحديث عن عيوب الأصهار أو الزوج أو الجيران في غيابهم هو من هذا."},
 h:{ar:"مَنْ يَضْمَنْ لِي مَا بَيْنَ لَحْيَيْهِ وَمَا بَيْنَ رِجْلَيْهِ أَضْمَنْ لَهُ الْجَنَّةَ",src:"Bukhari 6474",fr:"« Celui qui me garantit ce qui est entre ses mâchoires et ce qui est entre ses jambes, je lui garantis le Paradis. » Garder sa langue est un chemin direct vers le Paradis.",en:"“Whoever guarantees me what is between his jaws and what is between his legs, I guarantee him Paradise.” Guarding the tongue is a direct path to Paradise.",tar:"فحفظ اللسان طريق مباشر إلى الجنة."},
 steps:{fr:["Quand la conversation tourne à la critique d'un absent, changez de sujet.","Si vous ne pouvez pas, levez-vous poliment et partez.","Dites du bien de la personne dont vous avez médit, devant ceux qui ont entendu.","Invoquez Allah pour elle : c'est une manière de réparer.","Quittez les groupes WhatsApp qui vivent de rumeurs."],
  en:["When the conversation turns to criticising someone absent, change the subject.","If you cannot, get up politely and leave.","Speak well of the person you backbit, in front of those who heard.","Pray to Allah for them: it is a way of making amends.","Leave WhatsApp groups that live on rumours."],
  ar:["إذا تحوّل الحديث إلى ذمّ غائب فغيّر الموضوع.","وإن لم تستطع فانصرف بلطف.","اذكر من اغتبته بخير أمام من سمعوك.","ادعُ الله له، فهذا من الإصلاح.","اخرج من مجموعات واتساب التي تعيش على الإشاعات."]}},
{id:"colere",t:{fr:"Colère, insultes et dureté en famille",en:"Anger, insults and harshness at home",ar:"الغضب والسبّ والقسوة في البيت"},
 w:{ar:"لَيْسَ الْمُؤْمِنُ بِالطَّعَّانِ وَلَا اللَّعَّانِ وَلَا الْفَاحِشِ وَلَا الْبَذِيءِ",src:"Tirmidhi 1977",fr:"« Le croyant n'est ni diffamateur, ni maudisseur, ni grossier, ni vulgaire. » Les mots durs blessent le conjoint et marquent les enfants pour longtemps ; et il n'y a jamais d'excuse à frapper ou à menacer.",en:"“The believer is not a slanderer, nor one who curses, nor obscene, nor vulgar.” Harsh words wound the spouse and mark children for a long time; and there is never an excuse for hitting or threatening.",tar:"والكلمات القاسية تجرح الزوج وتترك أثراً طويلاً في الأطفال، ولا عذر أبداً للضرب أو التهديد."},
 h:{ar:"وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ ۗ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ",src:"Coran 3:134",fr:"« … ceux qui maîtrisent leur colère et pardonnent aux gens. Et Allah aime les bienfaisants. » Chaque colère retenue vous rapproche de l'amour d'Allah.",en:"“…those who restrain anger and pardon people. And Allah loves the doers of good.” Every anger held back brings you closer to Allah's love.",tar:"فكل غضب تكظمه يقرّبك من محبة الله."},
 steps:{fr:["Dès que la colère monte : taisez-vous et dites « A'oûdhou billâhi mina-ch-chaytâni-r-rajîm ».","Si vous êtes debout, asseyez-vous ; sinon, sortez quelques minutes (Abou Daoud 4782).","Faites vos ablutions avant de reprendre la discussion.","Demandez pardon à votre conjoint et à vos enfants, même s'ils sont petits.","Si la violence se répète, parlez-en à un imam ou à un professionnel : on peut changer."],
  en:["As soon as anger rises: stay silent and say “A'udhu billahi mina-sh-shaytani-r-rajim”.","If you are standing, sit down; otherwise, step out for a few minutes (Abu Dawud 4782).","Make wudu before resuming the discussion.","Ask forgiveness from your spouse and your children, even small ones.","If violence repeats, talk to an imam or a professional: change is possible."],
  ar:["عند بداية الغضب: اسكت وقل «أعوذ بالله من الشيطان الرجيم».","إن كنت قائماً فاجلس، وإلا فاخرج دقائق (أبو داود 4782).","توضّأ قبل أن تعود إلى النقاش.","اطلب العفو من زوجك وأولادك ولو كانوا صغاراً.","إن تكرر العنف فتحدّث إلى إمام أو مختص، فالتغيير ممكن."]}},
{id:"alcool",t:{fr:"Alcool et drogue",en:"Alcohol and drugs",ar:"الخمر والمخدرات"},
 w:{ar:"إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنصَابُ وَالْأَزْلَامُ رِجْسٌ مِّنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ",src:"Coran 5:90",fr:"« Le vin, les jeux de hasard, les pierres dressées et les flèches divinatoires ne sont qu'une souillure, œuvre du diable : écartez-vous-en. » Le Prophète ﷺ a dit : « Tout enivrant est interdit » (Muslim 2003). La drogue détruit la santé, l'argent du foyer et la confiance de la famille.",en:"“Wine, gambling, stone altars and divining arrows are only filth, the work of Satan: avoid them.” The Prophet ﷺ said: “Every intoxicant is forbidden” (Muslim 2003). Drugs destroy health, household money and the family's trust.",tar:"وقال ﷺ: «كل مسكر خمر، وكل مسكر حرام» (مسلم 2003). والمخدرات تدمّر الصحة ومال البيت وثقة الأسرة."},
 h:{ar:"قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ",src:"Coran 39:53",fr:"« Dis : Ô Mes serviteurs qui avez commis des excès à votre propre détriment, ne désespérez pas de la miséricorde d'Allah. Allah pardonne tous les péchés. » Peu importe depuis combien de temps : la porte est ouverte.",en:"“Say: O My servants who have transgressed against themselves, do not despair of the mercy of Allah. Allah forgives all sins.” No matter for how long: the door is open.",tar:"مهما طال الزمن، فالباب مفتوح."},
 steps:{fr:["Parlez à un médecin ou un centre de santé : la dépendance se soigne, et arrêter brutalement peut être dangereux.","Éloignez-vous des lieux et des amis liés à la consommation.","Ne gardez pas d'argent liquide en trop sur vous les premières semaines.","Choisissez une personne de confiance à appeler quand l'envie vient.","Remplacez le moment de consommation par la marche, la prière ou un ami."],
  en:["Talk to a doctor or a health centre: addiction can be treated, and stopping abruptly can be dangerous.","Stay away from places and friends linked to using.","Do not carry extra cash during the first weeks.","Choose a trusted person to call when the urge comes.","Replace the time of using with walking, prayer or a friend."],
  ar:["تحدّث إلى طبيب أو مركز صحي، فالإدمان يُعالج، والتوقف المفاجئ قد يكون خطراً.","ابتعد عن الأماكن والأصدقاء المرتبطين بالتعاطي.","لا تحمل نقوداً زائدة في الأسابيع الأولى.","اختر شخصاً تثق به تتصل به عند الرغبة.","استبدل وقت التعاطي بالمشي أو الصلاة أو صديق."]}},
{id:"paris",t:{fr:"Paris sportifs et jeux d'argent",en:"Sports betting and gambling",ar:"المراهنات والقمار"},
 w:{ar:"إِنَّمَا يُرِيدُ الشَّيْطَانُ أَن يُوقِعَ بَيْنَكُمُ الْعَدَاوَةَ وَالْبَغْضَاءَ فِي الْخَمْرِ وَالْمَيْسِرِ وَيَصُدَّكُمْ عَن ذِكْرِ اللَّهِ وَعَنِ الصَّلَاةِ",src:"Coran 5:91",fr:"« Le diable ne veut que jeter entre vous l'inimitié et la haine par le vin et le jeu de hasard, et vous détourner du rappel d'Allah et de la prière. » Les paris vident la poche du foyer, créent des dettes et des disputes.",en:"“Satan only wants to cause enmity and hatred between you through wine and gambling, and to turn you away from the remembrance of Allah and from prayer.” Betting empties the household's pocket and creates debts and quarrels.",tar:"والمراهنات تفرغ جيب الأسرة وتجلب الديون والخصومات."},
 h:{ar:"وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا، وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ",src:"Coran 65:2-3",fr:"« Quiconque craint Allah, Il lui donne une issue et le pourvoit de là où il ne s'attend pas. » La vraie richesse vient du travail honnête et de la baraka, pas d'un ticket.",en:"“Whoever fears Allah, He will make a way out for him and provide for him from where he does not expect.” True wealth comes from honest work and barakah, not from a ticket.",tar:"فالرزق الحقيقي يأتي من العمل الحلال والبركة، لا من ورقة رهان."},
 steps:{fr:["Supprimez aujourd'hui les applications et les comptes de paris.","Ne passez plus devant les points de paris ; changez d'itinéraire.","Confiez la gestion de votre argent à votre conjoint ou à une personne sûre pour un temps.","Notez ce que vous avez perdu : la vérité des chiffres aide à arrêter.","Mettez de côté chaque semaine la somme que vous auriez pariée : vous verrez ce qu'elle devient."],
  en:["Delete betting apps and accounts today.","Stop walking past betting shops; change your route.","Let your spouse or a trusted person manage your money for a while.","Write down what you have lost: the truth of the numbers helps you stop.","Each week, put aside the amount you would have bet: see what it becomes."],
  ar:["احذف اليوم تطبيقات وحسابات المراهنة.","لا تمرّ بأماكن المراهنات، وغيّر طريقك.","دع زوجك أو شخصاً أميناً يدير مالك مدة من الزمن.","اكتب ما خسرته، فحقيقة الأرقام تعين على التوقف.","ادّخر كل أسبوع المبلغ الذي كنت ستراهن به، وانظر ماذا يصير."]}},
{id:"argent",t:{fr:"Argent malhonnête : vol, corruption, tricherie",en:"Dishonest money: theft, bribery, cheating",ar:"المال الحرام: السرقة والرشوة والغش"},
 w:{ar:"وَلَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ وَتُدْلُوا بِهَا إِلَى الْحُكَّامِ",src:"Coran 2:188",fr:"« Ne dévorez pas vos biens entre vous illicitement, et ne vous en servez pas pour corrompre les juges. » Le Prophète ﷺ a maudit celui qui donne un pot-de-vin et celui qui le reçoit (Abou Daoud 3580). Ce qui nourrit le foyer de façon illicite retire la baraka.",en:"“Do not consume one another's wealth unjustly, nor use it to bribe the authorities.” The Prophet ﷺ cursed the one who gives a bribe and the one who takes it (Abu Dawud 3580). Feeding the home unlawfully removes barakah.",tar:"ولعن رسول الله ﷺ الراشي والمرتشي (أبو داود 3580). والمال الحرام ينزع البركة من البيت."},
 h:{ar:"إِنَّكَ لَنْ تَدَعَ شَيْئًا لِلَّهِ إِلَّا أَبْدَلَكَ اللَّهُ بِهِ مَا هُوَ خَيْرٌ لَكَ مِنْهُ",src:"Ahmad 23074",fr:"« Tu ne laisseras rien pour Allah sans qu'Allah ne te le remplace par mieux. » L'argent auquel vous renoncez aujourd'hui pour Allah n'est pas perdu.",en:"“You will not leave anything for the sake of Allah except that Allah will replace it with something better for you.” The money you give up today for Allah is not lost.",tar:"فالمال الذي تتركه اليوم لله ليس ضائعاً."},
 steps:{fr:["Arrêtez dès aujourd'hui toute nouvelle entrée d'argent illicite.","Rendez ce qui a été pris à son propriétaire, discrètement si besoin, ou à ses héritiers.","Si vous ne pouvez pas retrouver la personne, donnez l'équivalent en aumône en son nom.","Cherchez un revenu halal, même plus petit : la baraka compense.","Parlez-en à un imam pour les cas compliqués."],
  en:["Stop any new unlawful income from today.","Return what was taken to its owner, discreetly if needed, or to their heirs.","If you cannot find the person, give the equivalent in charity on their behalf.","Look for halal income, even smaller: barakah makes up for it.","Talk to an imam about complicated cases."],
  ar:["أوقف من اليوم كل دخل حرام جديد.","ردّ ما أُخذ إلى صاحبه، ولو سراً، أو إلى ورثته.","إن لم تجد صاحبه فتصدّق بمثله عنه.","ابحث عن رزق حلال ولو كان أقل، فالبركة تعوّض.","استشر إماماً في الحالات المعقدة."]}},
{id:"parents",t:{fr:"Désobéir ou manquer de respect aux parents",en:"Disobeying or disrespecting parents",ar:"عقوق الوالدين"},
 w:{ar:"فَلَا تَقُل لَّهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًا كَرِيمًا",src:"Coran 17:23",fr:"« Ne leur dis même pas « ouf », ne les brusque pas, et adresse-leur des paroles respectueuses. » Le Prophète ﷺ a cité la désobéissance aux parents parmi les plus grands péchés (Bukhari 2654).",en:"“Do not even say “uff” to them, do not repel them, and speak to them with respect.” The Prophet ﷺ listed disobedience to parents among the greatest sins (Bukhari 2654).",tar:"وعدّ النبي ﷺ عقوق الوالدين من أكبر الكبائر (البخاري 2654)."},
 h:{ar:"رِضَى الرَّبِّ فِي رِضَى الْوَالِدِ",src:"Tirmidhi 1899",fr:"« La satisfaction du Seigneur est dans la satisfaction du père (et de la mère). » Et même si vos parents sont décédés, vous pouvez encore les honorer : « Seigneur, fais-leur miséricorde comme ils m'ont élevé tout petit » (17:24).",en:"“The Lord's pleasure lies in the parent's pleasure.” And even if your parents have passed away, you can still honour them: “My Lord, have mercy on them as they raised me when I was small” (17:24).",tar:"وإن كان والداك قد توفيا فما زال البرّ ممكناً: ﴿رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا﴾ (الإسراء: 24)."},
 steps:{fr:["Appelez vos parents aujourd'hui, simplement pour prendre des nouvelles.","Demandez-leur pardon pour une parole ou un oubli précis.","Prévoyez chaque mois une aide, même petite, selon vos moyens.","Gardez l'équilibre : honorer ses parents sans négliger les droits de son conjoint.","S'ils sont décédés : invoquez pour eux, donnez une aumône en leur nom, visitez leurs amis."],
  en:["Call your parents today, simply to ask how they are.","Ask their forgiveness for a specific word or neglect.","Plan some help every month, even small, according to your means.","Keep the balance: honour your parents without neglecting your spouse's rights.","If they have passed away: pray for them, give charity on their behalf, visit their friends."],
  ar:["اتصل بوالديك اليوم لتطمئن عليهما فقط.","اطلب منهما العفو عن كلمة أو تقصير بعينه.","خصّص كل شهر عوناً ولو قليلاً بحسب قدرتك.","حافظ على التوازن: برّ الوالدين دون إهمال حقوق الزوج.","إن كانا متوفيين: ادعُ لهما، وتصدّق عنهما، وصِل أصدقاءهما."]}},
{id:"charlatan",t:{fr:"Charlatans, voyance et sorcellerie",en:"Charlatans, fortune-telling and sorcery",ar:"الدجالون والعرافة والسحر"},
 w:{ar:"مَنْ أَتَى عَرَّافًا فَسَأَلَهُ عَنْ شَيْءٍ لَمْ تُقْبَلْ لَهُ صَلَاةٌ أَرْبَعِينَ لَيْلَةً",src:"Muslim 2230",fr:"« Celui qui va voir un devin et l'interroge sur quelque chose, sa prière n'est pas acceptée pendant quarante nuits. » Chercher un charme pour retenir son conjoint ou nuire à une co-épouse, c'est mettre sa foi en danger.",en:"“Whoever goes to a fortune-teller and asks him about something, his prayer is not accepted for forty nights.” Seeking a charm to keep a spouse or harm a co-wife puts one's faith in danger.",tar:"والبحث عن حِرز لاستمالة الزوج أو لإيذاء الضرّة تعريض للإيمان للخطر."},
 h:{ar:"وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ",src:"Coran 65:3",fr:"« Et quiconque place sa confiance en Allah, Il lui suffit. » Allah dit aussi : « Je suis proche : Je réponds à l'appel de celui qui M'invoque » (2:186). Vous n'avez besoin d'aucun intermédiaire.",en:"“And whoever relies upon Allah, He is sufficient for him.” Allah also says: “I am near: I answer the call of the one who calls upon Me” (2:186). You need no intermediary.",tar:"وقال تعالى: ﴿فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ﴾ (البقرة: 186)، فلا تحتاج إلى وسيط."},
 steps:{fr:["Ne retournez plus chez le charlatan et effacez son numéro.","Débarrassez-vous des objets, gris-gris ou « protections » qu'il a donnés.","Protégez-vous par les invocations : Âyat al-Koursî, Al-Ikhlâs, Al-Falaq et An-Nâs matin et soir.","Pour un problème de couple, parlez à un imam ou à un conseiller, pas à un devin.","Pour une maladie, consultez un médecin : chercher le remède fait partie de la foi."],
  en:["Do not go back to the charlatan and delete his number.","Get rid of the objects, amulets or “protections” he gave.","Protect yourself with remembrance: Ayat al-Kursi, Al-Ikhlas, Al-Falaq and An-Nas morning and evening.","For a marriage problem, talk to an imam or a counsellor, not a fortune-teller.","For an illness, see a doctor: seeking a cure is part of faith."],
  ar:["لا تعد إلى الدجال واحذف رقمه.","تخلّص من الأشياء والتمائم و«الحُرُز» التي أعطاك إياها.","تحصّن بالأذكار: آية الكرسي والإخلاص والمعوذتين صباحاً ومساءً.","لمشكلة زوجية تحدّث إلى إمام أو مستشار لا إلى عرّاف.","وللمرض راجع الطبيب، فالتداوي من الإيمان."]}}
];

const dayDiff=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const twClean=c=>Math.max(0,dayDiff(c.last,iso(today))-(c.days[iso(today)]==="fall"?0:0));
const twDate=d=>new Date(d+"T12:00:00").toLocaleDateString(S.lang==="ar"?"ar":S.lang,{day:"numeric",month:"long"});

function versePair(v,cls){

}
function twWeek(c){
  const out=[];for(let k=6;k>=0;k--){const d=new Date(today);d.setDate(d.getDate()-k);const s=iso(d);out.push([s,c.days[s]||(s<c.start?"before":"")])}
  return out;
}
function twGrade(c){const ok=twWeek(c).filter(x=>x[1]==="ok").length;return [ok,ok>=6?"twG6":ok>=4?"twG4":ok>=1?"twG1":"twG0"]}

function viewTawba(){

}

  </div>

   <p class="tw-grade"><b>${ok}/7</b> · ${t(gk)}</p></div>
  ${versePair(w,"warn")}${versePair(h,"hope")}
  <div class="card"><h3>${t("twPlan")}</h3>${steps.map((x,k)=>`<label class="tw-step"><input type="checkbox" data-tw-step="${k}" ${c.steps[k]?"checked":""}><span>${x}</span></label>`).join("")}
   ${["alcool","paris"].includes(c.sin)?`<p class="note" style="margin:0">${t("twDoctor")}</p>`:""}</div>
  <div class="card"><h3>🔒 ${t("twJournal")}</h3><textarea id="tw-note" rows="3" placeholder="${t("twJournalPh")}"></textarea><button class="btn" id="tw-note-save">${t("twSaveNote")}</button>
   ${c.notes.slice().reverse().map((x,k)=>`<div class="tw-note"><span>${twDate(x.d)}</span><p>${esc(x.txt)}</p><button class="tw-ndel" data-tw-ndel="${c.notes.length-1-k}">${t("twDel")}</button></div>`).join("")}</div>
  ${condCard()}
  <button class="tw-remove" data-tw-remove="${c.id}">${S.tw.sure===c.id?t("twRemoveSure"):t("twRemove")}</button>`;
}
function twSOS(c){

function twGo(v,cid){S.tab="more";S.sub="tawba";const r=n=>Math.floor(Math.random()*n);S.tw={v,cid,f:r(TAWBA_FEAR.length),h:r(TAWBA_HOPE.length),h2:r(TAWBA_HOPE.length-1)};save();render();scrollTo(0,0)}
function twCreate(sin,title){
  const c={id:"c"+Date.now(),sin,title:title||"",start:iso(today),last:iso(today),best:0,falls:0,days:{},steps:{},notes:[],hide:false};
  TW.combats.push(c);save();twGo("combat",c.id);
}
function twHeld(c){
  c.days[iso(today)]="ok";const n=twClean(c);c.best=Math.max(c.best||0,n);save();
  const m=TW_MILES.filter(x=>x<=n).pop();
  if(m&&!(c.miles||[]).includes(m)){c.miles=[...(c.miles||[]),m];save();toast(`<div class="bt"><div><span>✦ ${t("mTawba")}</span><b>${fmt(t("twMile"),{n:m})}</b></div></div>`,true)}
  else toast(t("twHeldMsg"),true);
  const sy=scrollY;render();scrollTo(0,sy);
}
function twFell(c){
  c.best=Math.max(c.best||0,twClean(c));c.days[iso(today)]="fall";c.last=iso(today);c.falls=(c.falls||0)+1;c.miles=[];save();twGo("fall",c.id);
}
let twTimer=null;
function twStartTimer(){
  clearInterval(twTimer);const end=Date.now()+600000;
  const tick=()=>{const el=document.getElementById("tw-time"),ring=document.getElementById("tw-ring");if(!el){clearInterval(twTimer);return}
    const r=Math.max(0,end-Date.now()),m=Math.floor(r/60000),s=Math.floor(r%60000/1000);el.textContent=`${m}:${String(s).padStart(2,"0")}`;
    if(ring)ring.setAttribute("stroke-dashoffset",(326.7*(1-r/600000)).toFixed(1));if(r<=0)clearInterval(twTimer)};
  tick();twTimer=setInterval(tick,1000);
}
document.addEventListener("click",e=>{
  const el=e.target.closest&&e.target.closest("[data-tw-open],[data-tw-pick],[data-tw-held],[data-tw-fell],[data-tw-sos],[data-tw-passed],[data-tw-restart],[data-tw-hide],[data-tw-remove],[data-tw-ndel],#tw-new,#tw-other-go,#tw-note-save,#tw-dhikr");
  if(!el) return;
  const d=el.dataset, c=TW.combats.find(x=>x.id===(d.twOpen||d.twHeld||d.twFell||d.twSos||d.twPassed||d.twRestart||d.twHide||d.twRemove||S.tw.cid));
  if(d.twOpen){twGo("combat",d.twOpen);return}
  if(el.id==="tw-new"){twGo("pick");return}
  if(d.twPick){twCreate(d.twPick);return}
  if(el.id==="tw-other-go"){const v=(document.getElementById("tw-other").value||"").trim();if(v)twCreate("custom",v);else document.getElementById("tw-other").focus();return}
  if(!c) return;
  if(d.twHeld){twHeld(c);return}
  if(d.twFell){twFell(c);return}
  if(d.twSos){S.tw.dn=0;twGo("sos",c.id);twStartTimer();return}
  if(d.twPassed){clearInterval(twTimer);toast(t("twPassedMsg"),true);twGo("combat",c.id);return}
  if(d.twRestart){twGo("combat",c.id);return}
  if(d.twHide){c.hide=!c.hide;save();const sy=scrollY;render();scrollTo(0,sy);return}
  if(d.twRemove){if(S.tw.sure===c.id){TW.combats=TW.combats.filter(x=>x!==c);S.tawba=TW;twGo("home")}else{S.tw.sure=c.id;const sy=scrollY;render();scrollTo(0,sy)}return}
  if(d.twNdel!==undefined){c.notes.splice(+d.twNdel,1);save();const sy=scrollY;render();scrollTo(0,sy);return}
  if(el.id==="tw-note-save"){const v=(document.getElementById("tw-note").value||"").trim();if(!v)return;c.notes.push({d:iso(today),txt:v.slice(0,1000)});save();toast(t("twNoteSaved"),true);const sy=scrollY;render();scrollTo(0,sy);return}
  if(el.id==="tw-dhikr"){S.tw.dn=(S.tw.dn||0)+1;document.getElementById("tw-dn").textContent=S.tw.dn;if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){};return}
});
document.addEventListener("change",e=>{
  const el=e.target; if(!el.matches||!el.matches("[data-tw-step]")) return;

  c.steps[el.dataset.twStep]=el.checked; save();

document.addEventListener("click",e=>{
  if(S.sub!=="tawba"||!S.tw||S.tw.v==="home") return;

// ---------- État ----------
S.quran=S.quran||{mem:{},qdone:{},rec:"muallim",rep:1,pause:false,hide:0,tr:true};
S.qr=S.qr||{v:"home"};
const QR=S.quran;
const QCACHE={};
const QMARKS=/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
const qnorm=s=>s.replace(QMARKS,"").replace(/[ٱأإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[^ء-ي\s]/g,"").trim();
const memCount=n=>(QR.mem[n]||[]).length;
const pad3=x=>String(x).padStart(3,"0");

async function loadSurah(n){
  if(QCACHE[n]) return QCACHE[n];
  try{const c=localStorage.getItem("djh-q-"+n);if(c){QCACHE[n]=JSON.parse(c);return QCACHE[n]}}catch(e){}
  let d=null;
  try{const r=await fetch("quran/"+n+".json");if(r.ok)d=await r.json()}catch(e){}
  if(!d){
    const r=await fetch(`https://api.alquran.cloud/v1/surah/${n}/editions/quran-uthmani,fr.hamidullah,en.sahih`);
    const j=(await r.json()).data;
    const ar=j[0].ayahs.map(a=>a.text);
    if(n!==1&&n!==9){const w=ar[0].split(" ");if(w.slice(0,4).map(qnorm).join(" ")==="بسم الله الرحمن الرحيم")ar[0]=w.slice(4).join(" ")}
    d={n,ar,fr:j[1].ayahs.map(a=>a.text),en:j[2].ayahs.map(a=>a.text),g:j[0].ayahs.map(a=>a.number)};
  }
  d.ar=d.ar.map(x=>x.replace(/^\ufeff/,""));
  QCACHE[n]=d; try{localStorage.setItem("djh-q-"+n,JSON.stringify(d))}catch(e){}
  return d;
}

// ---------- Audio de récitation ----------
const QP={playing:false,k:0,audio:null,timer:null,single:false};
function qUrl(n,k,fallback){
  if(fallback){const d=QCACHE[n];return `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${d.g[k-1]}.mp3`}
  const r=RECITERS.find(x=>x[0]===QR.rec)||RECITERS[0];
  return `https://everyayah.com/data/${r[2]}/${pad3(n)}${pad3(k)}.mp3`;
}
function qStop(){QP.playing=false;clearTimeout(QP.timer);if(QP.audio){QP.audio.pause();QP.audio.src=""}document.querySelectorAll(".qr-ay.playing").forEach(e=>e.classList.remove("playing"));const b=document.getElementById("qr-all");if(b)b.textContent="▶ "+t("playAll")}
function qPlay(k,single){
  try{if(typeof audioEl!=="undefined"&&audioEl&&!audioEl.paused)audioEl.pause()}catch(e){}
  qStop(); if(!QCACHE[S.qr.n]) return;
  QP.playing=true;QP.single=single;QP.n=S.qr.n;QP.k=k;QP.left=QR.rep;
  const b=document.getElementById("qr-all");if(b)b.textContent="■ "+t("stop");
  qStep(false);
}
function qStep(fb){
  if(!QP.playing) return;
  const n=QP.n,k=QP.k,a=QP.audio||(QP.audio=new Audio());
  document.querySelectorAll(".qr-ay.playing").forEach(e=>e.classList.remove("playing"));
  const el=document.getElementById("ay-"+k);if(el){el.classList.add("playing");el.scrollIntoView({block:"center",behavior:"smooth"})}
  a.src=qUrl(n,k,fb);
  a.onerror=()=>{if(!fb)qStep(true);else qStop()};
  a.onended=()=>{
    const wait=QR.pause?Math.min(30000,(a.duration||4)*1000+600):250;
    QP.timer=setTimeout(()=>{
      if(!QP.playing) return;
      QP.left--; if(QP.left>0){qStep(fb);return}
      if(QP.single||k>=QSURAH[n][3]){qStop();return}
      QP.k=k+1;QP.left=QR.rep;qStep(false);
    },wait);
  };
  a.play().catch(()=>{if(!fb)qStep(true);else qStop()});
}

// ---------- Vérifier la récitation ----------
async function listenAr(){
  if(NATIVE&&PL.SpeechRecognition){
    const av=await PL.SpeechRecognition.available(); if(!av||!av.available) throw 0;
    await PL.SpeechRecognition.requestPermissions();
    const res=await PL.SpeechRecognition.start({language:"ar-SA",maxResults:1,prompt:t("listening"),partialResults:false,popup:true});
    return (res&&res.matches&&res.matches[0])||"";
  }
  const R=window.SpeechRecognition||window.webkitSpeechRecognition; if(!R) throw 0;
  return await new Promise((ok,ko)=>{const r=new R();r.lang="ar-SA";r.onresult=e=>ok(e.results[0][0].transcript);r.onerror=()=>ko(0);r.onend=()=>ok("");r.start()});
}
async function qCheck(k){
  const n=S.qr.n,d=QCACHE[n],box=document.getElementById("chk-"+k); if(!d||!box) return;
  qStop(); box.hidden=false; box.innerHTML=`<p class="note" style="margin:0">🎙 ${t("listening")}</p>`;
  let said="";
  try{said=await listenAr()}catch(e){box.innerHTML=`<p class="note" style="margin:0">${t("micNoQ")}</p>`;return}
  const words=d.ar[k-1].split(" ").filter(w=>qnorm(w)), got=qnorm(said).split(/\s+/).filter(Boolean);
  const pool=[...got]; let hit=0;
  const marks=words.map(w=>{const nw=qnorm(w);const j=pool.findIndex(x=>x===nw||(nw.length>3&&(x.includes(nw)||nw.includes(x))&&Math.abs(x.length-nw.length)<=2));if(j>=0){pool.splice(j,1);hit++;return `<span class="ok">${w}</span>`}return `<span class="ko">${w}</span>`});
  const p=Math.round(hit/words.length*100), ok=p>=80;
  box.innerHTML=`<p class="ar qr-mark">${marks.join(" ")}</p><p class="tw-msg ${ok?"ok":""}">${fmt(t(ok?"checkOk":"checkKo"),{p})}</p>`;
  if(ok&&!(QR.mem[n]||[]).includes(k)) setMem(n,k,true,true);
}
function setMem(n,k,on,keepScroll){
  const m=QR.mem[n]=QR.mem[n]||[];
  if(on&&!m.includes(k)){m.push(k);if(typeof addPts==="function")addPts(5)}
  if(!on){const i=m.indexOf(k);if(i>=0)m.splice(i,1)}
  if(on&&m.length===QSURAH[n][3]&&!(QR.doneS||[]).includes(n)){QR.doneS=[...(QR.doneS||[]),n];if(typeof addPts==="function")addPts(50);toast(`<div class="bt"><div><span>۩ ${QSURAH[n][1]}</span><b>${t("surahDone")}</b></div></div>`,true)}
  save();
  if(!keepScroll){const sy=scrollY;render();scrollTo(0,sy)}
  else{const el=document.getElementById("ay-"+k);if(el){el.classList.toggle("mem",on);const b=el.querySelector("[data-qmem]");if(b){b.className=on?"on":"";b.textContent=(on?"✓ "+t("knownOk"):"○ "+t("known"))}}}
}

// ---------- Exercices du professeur ----------
function sayAr(s){speakSeq([[s,"ar-SA"]])}
function startQaidaQuiz(){
  const l=QAIDA.find(x=>x.id===S.qr.ql), pool=(l.quizFrom||l.items)(), rounds=[];
  const pick=()=>pool[Math.floor(Math.random()*pool.length)];
  for(let i=0;i<5;i++){
    let base=Math.floor(Math.random()*pool.length);
    if(l.grp) base-=base%l.grp;
    const set=l.grp?pool.slice(base,base+l.grp):(()=>{const s=[pool[base]];while(s.length<3){const x=pick();if(!s.includes(x))s.push(x)}return s})();
    const opts=[...set].sort(()=>Math.random()-.5);
    rounds.push({opts,a:opts.indexOf(set[l.grp?Math.floor(Math.random()*l.grp):0])});
  }
  S.qr={...S.qr,v:"qquiz",quiz:{rounds,i:0,sel:null,s:0}};save();render();scrollTo(0,0);
  setTimeout(()=>{const r=rounds[0];sayAr(r.opts[r.a].say)},400);
}

  if(!el||S.sub!=="quran") return;

  if(el.id==="qa-next"){const z=S.qr.quiz;
    if(z.i<4){z.i++;z.sel=null;save();render();scrollTo(0,0);setTimeout(()=>{const r=z.rounds[z.i];sayAr(r.opts[r.a].say)},350);return}
    const id=S.qr.ql,prev=QR.qdone[id]||0;if(z.s>prev)QR.qdone[id]=z.s;if(z.s>=4&&prev<4&&typeof addPts==="function")addPts(20);
    toast(`${fmt(t("qRes"),{s:z.s})} · ${z.s>=4?t("qPass"):t("qFail")}`,z.s>=4);qrGo({v:z.s>=4?"qaida":"qlesson"});return}
  if(d.surah){REV.clear();qrGo({v:"surah",n:+d.surah});return}
  if(d.qset){const v=d.qset==="rec"?d.v:+d.v;QR[d.qset]=v;if(d.qset==="rec"&&QP.playing){const k=QP.k;save();render();qPlay(k,QP.single);return}save();const sy=scrollY;render();scrollTo(0,sy);return}
  if(el.id==="qr-tr"){QR.tr=!QR.tr;save();const sy=scrollY;render();scrollTo(0,sy);return}
  if(el.id==="qr-all"){if(QP.playing)qStop();else qPlay(1,false);return}

  if(d.qrec){qCheck(+d.qrec);return}

});

function qaidaLesson(){
  const l=QAIDA.find(x=>x.id===S.qr.ql), i=QAIDA.indexOf(l), it=l.items(), au=LECON_AUDIO[l.id];
  const tile=(x,k,pre)=>`<button class="qa-tile ${au?"":"mute"} ${isHuman(x)?"human":""}" data-lx="${pre}${k}">${isHuman(x)?'<i class="hm" title="voix humaine">👤</i>':""}<span class="ar">${x.show}</span><small>${trl(x.tr)}${x.name?" · <span class='ar'>"+x.name+"</span>":""}</small></button>`;
  (l.needs||[]).forEach(n=>{if(!QCACHE[n])loadSurah(n).then(()=>{if(S.qr.v==="qlesson"){const sy=scrollY;render();scrollTo(0,sy)}}).catch(()=>{})});
  const exv=l.ex, d=QCACHE[exv[0]]; if(!d) loadSurah(exv[0]).then(()=>{if(S.qr.v==="qlesson"){const sy=scrollY;render();scrollTo(0,sy)}}).catch(()=>{});
  const surahBlock=l.surah&&QCACHE[l.surah]?QCACHE[l.surah].ar.map((v,k)=>`<div class="card lx-ex"><div class="qr-line"><p class="ar qr-txt">${v}</p><span class="qr-num">${String(k+1).replace(/\d/g,x=>"٠١٢٣٤٥٦٧٨٩"[x])}</span></div><button class="btn ghost" data-lex="${l.surah}:${k+1}">▶ ${t("playV")}</button></div>`).join(""):"";
  return `<section class="hello"><span class="eyebrow">${arW(t("qaida").split(" · ")[0])} · ${fmt(t("lessonN"),{n:i+1})}</span><h1>${arW(L3(l.t))}</h1></section>
  <div class="card"><p style="margin:0;line-height:1.65">${arW(L3(l.x))}</p>${it.length?`<p class="note" style="margin:0">${au?fmt(t("voiceBy"),{v:au.voice}):t("voiceSoon")}</p>`:""}</div>
  ${it.length?`<div class="qa-grid ${l.grp===3?"g3":""} ${l.wide?"wide":""} ${l.id>="L15"?"words":""}">${it.map((x,k)=>tile(x,k,"i")).join("")}</div>`:""}
  ${l.words?`<h3 class="lx-h">${t("lxWords")}</h3><div class="qa-grid words">${l.words.map((x,k)=>tile(x,k,"w")).join("")}</div>`:""}
  ${!l.surah?`<div class="card lx-ex"><span class="eyebrow">▶ ${t("exQ")}</span>${d?`<div class="qr-line"><p class="ar qr-txt">${d.ar[exv[1]-1]}</p><span class="qr-num">${String(exv[1]).replace(/\d/g,x=>"٠١٢٣٤٥٦٧٨٩"[x])}</span></div>`:`<p class="note">${t("loading")}</p>`}<p class="src">${QSURAH[exv[0]][1]} · ${exv[0]}:${exv[1]}</p><button class="btn" data-lex="${exv[0]}:${exv[1]}">▶ ${t("playV")}</button></div>`:surahBlock}
  ${l.quiz!=="none"?`<button class="btn sch-go" id="qa-quiz">${t("practice")} ›</button>`:`<button class="btn sch-go" id="lx-finish">✓ ${t("lxFinish")}</button>`}`;
}

  const z=S.qr.quiz, r=z.rounds[z.i], sel=z.sel, l=QAIDA.find(x=>x.id===S.qr.ql);
  return `<section class="hello"><span class="eyebrow">${arW(L3(l.t))}</span><h1 class="sch-q-of">${fmt(t("qOf"),{i:z.i+1,n:5})}</h1></section>

const TR_C={"ء":"ʾ","أ":"ʾ","إ":"ʾ","ؤ":"ʾ","ئ":"ʾ","آ":"ʾâ","ب":"b","ت":"t","ة":"t","ث":"th","ج":"dj","ح":"ḥ","خ":"kh","د":"d","ذ":"dh","ر":"r","ز":"z","س":"s","ش":"ch","ص":"ṣ","ض":"ḍ","ط":"ṭ","ظ":"ẓ","ع":"'","غ":"gh","ف":"f","ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ى":"","ا":""};
function trlAuto(tok){
  const p=[];for(const c of tok.replace(/﻿/g,"")){if(/[ء-يٱ]/.test(c))p.push([c,""]);else if(p.length)p[p.length-1][1]+=c}
  let o="",sun=false;
  const lengthen=()=>{if(o.endsWith("ou"))o=o.slice(0,-2)+"oû";else if(o.endsWith("a"))o=o.slice(0,-1)+"â";else if(o.endsWith("i"))o=o.slice(0,-1)+"î"};
  p.forEach(([c,m],i)=>{
    if(c==="ٱ"){o+=i===0?"a":"";return}
    if(c==="ل"&&i===1&&p[0][0]==="ٱ"){if(!m){const nx=p[2]&&TR_C[p[2][0]];o+=(nx||"l")+"-";sun=true}else o+="l-";return}
    if(!m){if(c==="ا"&&/an$/.test(o))return;if("اوىي".includes(c)){lengthen();return}}
    let cs=TR_C[c]??"";
    if(m.includes("ّ")&&!sun) cs=cs+cs;
    sun=false;
    let v="";
    if(m.includes("َ"))v="a";else if(m.includes("ِ"))v="i";else if(m.includes("ُ"))v="ou";
    else if(m.includes("ً"))v="an";else if(m.includes("ٍ"))v="in";else if(m.includes("ٌ"))v="oun";
    if(m.includes("ٰ"))v="â";
    o+=cs+v;
  });
  return o.replace(/^ʾ/,"").replace(/ʾ/g,"'");
}

// ---------- 1. Variété : un choix différent chaque jour, sans ordre prévisible ----------
const dayNum=(off=0)=>{const d=new Date(today);d.setDate(d.getDate()+off);return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTime()/864e5)};
function seeded(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hashStr(x){let h=2166136261;for(const c of String(x)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function dayPick(n,salt,off){
  if(n<=1) return 0;
  const dn=dayNum(off||0), cycle=Math.floor(dn/n), r=seeded(hashStr(salt+":"+cycle)), p=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
  return p[((dn%n)+n)%n];
}
const rndPick=a=>a[Math.floor(Math.random()*a.length)];
if(typeof PROVERBS!=="undefined") proverbOfDay=function(){return PROVERBS[dayPick(PROVERBS.length,"proverb")]};

S.hadj=S.hadj||0;
function hParts(d){
  const x=new Date(d);x.setDate(x.getDate()+(S.hadj||0));
  try{const p=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric"}).formatToParts(x);
    const g=k=>+((p.find(z=>z.type===k)||{}).value||"0").replace(/\D/g,"");return {d:g("day"),m:g("month"),y:g("year")}}catch(e){return {d:0,m:0,y:0}}
}
const H_MONTHS={fr:["Mouharram","Safar","Rabî' al-awwal","Rabî' ath-thânî","Joumâdâ al-oûlâ","Joumâdâ ath-thâniya","Rajab","Cha'bân","Ramadan","Chawwâl","Dhoul-Qa'da","Dhoul-Hijja"],en:["Muharram","Safar","Rabi' al-Awwal","Rabi' al-Thani","Jumada al-Ula","Jumada al-Thaniyah","Rajab","Sha'ban","Ramadan","Shawwal","Dhul-Qa'dah","Dhul-Hijjah"],ar:["محرّم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوّال","ذو القعدة","ذو الحجة"]};
const hMonth=m=>(H_MONTHS[S.lang]||H_MONTHS.fr)[m-1]||"";
const arNum=n=>S.lang==="ar"?String(n).replace(/\d/g,x=>"٠١٢٣٤٥٦٧٨٩"[x]):String(n);
hijriStr=function(d){const h=hParts(d);return h.y?`${arNum(h.d)} ${hMonth(h.m)} ${arNum(h.y)}`:""};
function forbiddenFast(d){const h=hParts(d);return (h.m===10&&h.d===1)||(h.m===12&&h.d>=10&&h.d<=13)}
function hEvent(d){
  const h=hParts(d);
  if(h.m===1&&h.d===1) return "ev_newyear"; if(h.m===1&&h.d===9) return "ev_tasua"; if(h.m===1&&h.d===10) return "ev_ashura";
  if(h.m===9&&h.d===1) return "ev_ramadan"; if(h.m===9&&h.d>=21&&h.d%2===1) return "ev_laylat";
  if(h.m===10&&h.d===1) return "ev_fitr"; if(h.m===12&&h.d===9) return "ev_arafat"; if(h.m===12&&h.d===10) return "ev_adha"; if(h.m===12&&h.d>=11&&h.d<=13) return "ev_tashriq";
  return "";
}

function plLog(id,day){PL_.log[id]=PL_.log[id]||{};return PL_.log[id][day||iso(today)]}
function plSet(id,v,day){PL_.log[id]=PL_.log[id]||{};PL_.log[id][day||iso(today)]=v;save()}
function isFastDay(p,dIso){
  const d=new Date(dIso+"T12:00:00"), def=planDef(p.id);
  if(forbiddenFast(d)) return false;
  if(def.kind==="daoud") return dayDiffD(p.start,dIso)%2===0;
  if(def.kind==="mt") return d.getDay()===1||d.getDay()===4;
  if(def.kind==="white"){const h=hParts(d);return h.d>=13&&h.d<=15}
  return false;
}

function nextFast(p){for(let i=1;i<60;i++){const s=isoOff(i);if(isFastDay(p,s))return s}return ""}
const fmtD=s=>new Date(s+"T12:00:00").toLocaleDateString(S.lang==="ar"?"ar":S.lang,{weekday:"long",day:"numeric",month:"long"});
function khatmaState(p){
  const tot=Object.values(PL_.log.khatma||{}).reduce((a,b)=>a+(+b||0),0)-(p.base||0);
  const per=Math.ceil(604/p.days), pos=Math.min(604,Math.max(0,tot));
  return {per,pos,juz:Math.min(30,Math.floor(pos/20.13)+1)};
}
// Taux de réussite d'un plan sur les 7 derniers jours
function planScore(p){
  const def=planDef(p.id); let exp=0,done=0;
  for(let i=0;i<7;i++){
    const s=isoOff(-i); if(s<p.start) continue; const v=plLog(p.id,s);
    if(def.kind==="day"){const n=def.count||1;exp+=n;done+=Array.isArray(v)?v.filter(Boolean).length:(v?1:0)}
    else if(def.kind==="count"){exp+=1;done+=Math.min(1,(+v||0)/def.goal)}
    else if(def.kind==="pages"){exp+=1;done+=Math.min(1,(+v||0)/khatmaState(p).per)}
    else if(["daoud","mt","white"].includes(def.kind)){if(isFastDay(p,s)&&!(i===0&&v==null)){exp+=1;done+=v==="ok"?1:0}}
  }
  if(def.kind==="week"){const wk=[...Array(7).keys()].map(i=>plLog(p.id,isoOff(-i))).some(Boolean);const started=dayDiffD(p.start,iso(today))>=6||wk;if(started){exp=1;done=wk?1:0}}
  return exp?done/exp:null;
}

const KAABA=[21.4225,39.8262];
S.qb=S.qb||{};
function qiblaBearing(lat,lon){const r=Math.PI/180,f1=lat*r,f2=KAABA[0]*r,dl=(KAABA[1]-lon)*r;
  const y=Math.sin(dl)*Math.cos(f2),x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl);return (Math.atan2(y,x)/r+360)%360}
function distKm(lat,lon){const r=Math.PI/180,dLat=(KAABA[0]-lat)*r,dLon=(KAABA[1]-lon)*r,a=Math.sin(dLat/2)**2+Math.cos(lat*r)*Math.cos(KAABA[0]*r)*Math.sin(dLon/2)**2;return Math.round(12742*Math.asin(Math.sqrt(a)))}

    <circle cx="150" cy="150" r="9" fill="var(--accent)"/></svg></div>

   <label for="qb-city">${t("qbCity")}<select id="qb-city">${(typeof CITIES!=="undefined"?CITIES:[]).map(c=>`<option ${S.qb.lat==null&&c[0]===name?"selected":""}>${c[0]}</option>`).join("")}</select></label></div>`;

let qbHeading=null,qbListening=false,qbLastVib=0;
function qbOnOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number") h=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!=null) h=360-e.alpha;
  else if(e.alpha!=null&&e.type==="deviceorientationabsolute") h=360-e.alpha;
  if(h==null) return;
  const so=(screen.orientation&&screen.orientation.angle)||0; h=(h+so+360)%360; qbHeading=h;
  const dial=document.getElementById("qb-dial"), msg=document.getElementById("qb-msg"); if(!dial) return;
  dial.style.transform=`rotate(${-h}deg)`;
  const [lat,lon]=qbPos(), b=qiblaBearing(lat,lon); let diff=((b-h+540)%360)-180;
  const ok=Math.abs(diff)<5; dial.parentElement.classList.toggle("ok",ok);

}

  if(!qbListening){qbListening=true;if("ondeviceorientationabsolute" in window)addEventListener("deviceorientationabsolute",qbOnOrient,true);else addEventListener("deviceorientation",qbOnOrient,true)}
  setTimeout(()=>{if(qbHeading==null)toast(t("qbNoSensor"))},2500);

// ---------- 2. Voix naturelle : fichiers préparés, Coran récité par Al-Husary, sinon voix du téléphone ----------
let VOX={};
fetch("voix/index.json").then(r=>r.ok?r.json():{}).then(j=>{VOX=j||{}}).catch(()=>{});
function voxKey(l,text){let h=2166136261;const s=l+"|"+String(text).trim();for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
let voxGen=0, voxAudio=null;
function voxStop(){voxGen++;try{if(voxAudio){voxAudio.pause();voxAudio.src=""}}catch(e){}
  try{if(NATIVE&&PL.TextToSpeech)PL.TextToSpeech.stop().catch(()=>{});else speechSynthesis.cancel()}catch(e){}}
function playUrl(u,gen){return new Promise(res=>{if(gen!==voxGen)return res(false);
  try{if(typeof audioEl!=="undefined"&&audioEl&&!audioEl.paused)audioEl.pause()}catch(e){}
  const a=voxAudio||(voxAudio=new Audio());a.onended=()=>res(true);a.onerror=()=>res(false);a.src=u;a.play().catch(()=>res(false))})}
function ttsOne(text,lang,gen){return new Promise(res=>{if(gen!==voxGen)return res();
  if(NATIVE&&PL.TextToSpeech){PL.TextToSpeech.speak({text,lang,rate:0.95,pitch:1,volume:1,category:"playback"}).then(res).catch(res);return}
  try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.95;u.onend=res;u.onerror=res;speechSynthesis.speak(u);setTimeout(res,Math.max(4000,text.length*120))}catch(e){res()}})}
const pad3v=x=>String(x).padStart(3,"0");
async function speakSeq(parts){
  voxStop(); const gen=voxGen;
  for(const [text,lang] of parts){
    if(gen!==voxGen) return;
    if(!text) continue;
    const l=String(lang||"").slice(0,2), v=VOX[voxKey(l,text)];
    if(v&&typeof v==="string"&&v.startsWith("q:")){                 // verset : récitation d'Al-Husary
      const [s,a]=v.slice(2).split(":"), [a1,a2]=a.split("-").map(Number);
      let ok=true; for(let k=a1;k<=(a2||a1)&&gen===voxGen;k++) ok=await playUrl(`https://everyayah.com/data/Husary_128kbps/${pad3v(s)}${pad3v(k)}.mp3`,gen)&&ok;
      continue;                                                       // jamais de voix de synthèse pour le Coran
    }
    if(v){const ok=await playUrl("voix/"+voxKey(l,text)+".mp3",gen);if(ok)continue}
    await ttsOne(text,lang,gen);
  }
}
function speak(text,lang){speakSeq([[text,lang]])}

// ---------- 3. Le programme du jour ----------
function birthdaysToday(){const md=iso(today).slice(5);return (S.family||[]).filter(f=>f.birth&&f.birth.slice(5)===md).map(f=>f.name)}
function planToday(){
  if(typeof PL_==="undefined") return {n:0,d:0,fast:[],fastTom:[]};
  let n=0,d=0;const fast=[],fastTom=[];
  PL_.list.forEach(p=>{const def=planDef(p.id),v=plLog(p.id);
    if(["daoud","mt","white"].includes(def.kind)){if(isFastDay(p,iso(today))){fast.push(L3(def.t));n++;if(v==="ok")d++}if(isFastDay(p,isoOff(1)))fastTom.push(L3(def.t));return}
    if(def.kind==="week"){if(def.fri&&today.getDay()!==5)return;n++;if([...Array(7).keys()].some(i=>plLog(p.id,isoOff(-i))))d++;return}
    n++;
    if(def.kind==="day"){const c=def.count||1;if(Array.isArray(v)?v.filter(Boolean).length>=c:!!v)d++}
    else if(def.kind==="count"){if((+v||0)>=def.goal)d++}
    else if(def.kind==="pages"){if((+v||0)>=khatmaState(p).per)d++}
  });
  return {n,d,fast,fastTom};
}
function nextPrayerInfo(){try{return nextPrayer()}catch(e){return null}}
function briefingLines(){
  const L=[], np=nextPrayerInfo(), pt=planToday();
  if(np) L.push(["🕌",fmt(t("brNext"),{p:np.name,h:np.time})]);
  if(pt.fast.length) L.push(["☾",fmt(t("brFast"),{p:pt.fast.join(", ")})]);
  if(pt.n) L.push(["✓",fmt(t("brPlan"),{d:pt.d,n:pt.n})]);
  if(pt.fastTom.length) L.push(["☾",fmt(t("brFastTom"),{p:pt.fastTom.join(", ")})]);
  if(typeof TW!=="undefined"&&TW.combats.length&&TW.combats.some(c=>!c.days[iso(today)])) L.push(["✦",t("brTawba")]);
  birthdaysToday().forEach(n=>L.push(["🎂",fmt(t("brBirthday"),{n})]));
  if(typeof deathOf==="function") L.push(["🕯",fmt(t("brDeath"),{a:L3(deathOf(0).a)})]);
  return L;
}
function briefingText(){
  const tips=getTips(), tip=tips[dayPick(tips.length,"tip"+S.gender,0)];
  const d=today.toLocaleDateString(S.lang==="ar"?"ar":S.lang,{weekday:"long",day:"numeric",month:"long"});
  const parts=[fmt(t("brHello"),{n:S.name||"",d,h:hijriStr(today)}).replace("  "," "),...briefingLines().map(x=>x[1]+"."),t("brTip")+" : "+String(tip.islam||"").split(/(?<=[.!?])\s/)[0],t("brEnd")];
  return parts.join(" ").replace(/ﷺ/g,S.lang==="fr"?", paix et salut sur lui,":S.lang==="en"?", peace be upon him,":"ﷺ");
}

S.rpSeen=S.rpSeen||{};
S.rpFrom=S.rpFrom||iso(today);   // pas de rappels « manqués » avant l'installation de cette version
function rpItems(){
  const R=S.rem||{}, out=[], now=new Date();
  const at=(d,hhmm)=>{const [h,m]=(hhmm||"07:00").split(":").map(Number);const x=new Date(d);x.setHours(h,m,0,0);return x};
  for(let i=6;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);const di=iso(d);
    if(di<S.rpFrom) continue;
    if(R.morning!==false){const tips=getTips(),x=tips[dayPick(tips.length,"tip"+S.gender,-i)];out.push({k:"m"+di,when:at(d,R.time),ic:"☀",title:t("todayIs"),body:String(x.islam||"").split(/(?<=[.!?])\s/)[0],go:"today",off:-i,say:[[x.ar,"ar-SA"],[x.islam,VOICE[S.lang]]]})}
    if(S.death&&S.death.on&&typeof deathOf==="function"){const x=deathOf(-i);out.push({k:"d"+di,when:at(d,S.death.time),ic:"🕯",title:t("deathT"),body:(S.lang==="ar"?x.ar2:L3(x))+" "+t("deathAct")+" : "+L3(x.a),go:"plan",say:[[x.ar,"ar-SA"],[S.lang==="ar"?x.ar2:L3(x),VOICE[S.lang]],[t("deathAct")+" : "+L3(x.a),VOICE[S.lang]]]})}
    if(typeof PL_!=="undefined"&&PL_.list.length&&PL_.notif!==false){
      let n=0,dn=0;PL_.list.forEach(p=>{if(di<p.start)return;const def=planDef(p.id),v=plLog(p.id,di);
        if(["daoud","mt","white"].includes(def.kind)){if(isFastDay(p,di)){n++;if(v==="ok")dn++}return}
        if(def.kind==="week")return; n++;
        if(def.kind==="day"){const c=def.count||1;if(Array.isArray(v)?v.filter(Boolean).length>=c:!!v)dn++}
        else if(def.kind==="count"){if((+v||0)>=def.goal)dn++}
        else if(def.kind==="pages"){if((+v||0)>=khatmaState(p).per)dn++}});
      if(n) out.push({k:"p"+di,when:at(d,PL_.time),ic:"✓",title:t("mPlan"),body:dn>=n?t("rpPlanAll"):fmt(t("rpPlanLeft"),{n:n-dn}),go:"plan",done:dn>=n})}
    if(typeof TW!=="undefined"&&TW.combats.length){const ok=TW.combats.every(c=>c.days[di]);out.push({k:"t"+di,when:at(d,"21:00"),ic:"✦",title:t("mTawba"),body:ok?t("rpTawbaOk"):t("rpTawbaNo"),go:"tawba",done:ok})}
    (S.family||[]).filter(f=>f.birth&&f.birth.slice(5)===di.slice(5)).forEach(f=>out.push({k:"b"+di+f.name,when:at(d,"08:00"),ic:"🎂",title:fmt(t("brBirthday"),{n:f.name}),body:t("giftIdeas")+" "+f.name,go:"family"}));
  }
  return out.filter(x=>x.when<=now).sort((a,b)=>b.when-a.when);
}
function rpState(x){if(x.done)return "done";if(S.rpSeen[x.k])return "seen";return "missed"}
function rpMissedCount(){try{return rpItems().filter(x=>rpState(x)==="missed").length}catch(e){return 0}}

     <p class="rp-b">${x.body}</p><div class="br-acts">${x.say?`<button class="btn ghost" data-rp-say="${i}">🔊 ${t("rpListen")}</button>`:""}<button class="btn" data-rp-go="${i}">${t("rpOpen")} ›</button></div></div>`}).join(""):`<p class="note">${t("rpNone")}</p>`}`;

function hvOpen(){return new Promise(res=>{if(HV.db)return res(HV.db);try{const r=indexedDB.open("djh-voix-humaine",1);r.onupgradeneeded=()=>r.result.createObjectStore("v");r.onsuccess=()=>{HV.db=r.result;res(HV.db)};r.onerror=()=>res(null)}catch(e){res(null)}})}
async function hvTx(mode,fn){const db=await hvOpen();if(!db)return null;return new Promise(res=>{const tx=db.transaction("v",mode),st=tx.objectStore("v");const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>res(null)})}
const hvPut=(k,v)=>hvTx("readwrite",st=>st.put(v,k));

// ---------- Export .zip (sans compression) ----------
function crc32(b){let c,t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const f of files){const name=enc.encode(f.name),data=f.data,crc=crc32(data);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length}
  const cdLen=cd.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdLen),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:"application/zip"});
}

    files.push({name:`${k}.${ext}`,data:new Uint8Array(await v.blob.arrayBuffer())});meta[k]={t:v.t,l:v.l}}
  files.push({name:"liste.json",data:new TextEncoder().encode(JSON.stringify({oustaz:S.st.name||"",app:APP_VERSION,voix:meta},null,1))});
  const zip=makeZip(files), fname=`voix-oustaz-${(S.st.name||"djh").replace(/[^\w]+/g,"-")}-${iso(today)}.zip`;
  try{
    if(NATIVE&&PL.Filesystem&&PL.Share){

 chien garde les moutons.","اَلْجَمَلُ يَحْمِلُ الْحَطَبَ":"Le chameau porte le bois.","اَلْوَلَدُ يَقْطِفُ الْوَرْدَ":"Le garçon cueille la rose.","أَحْمَدُ يَلْعَبُ مَعَ الْكَلْبِ":"Ahmad joue avec le chien.","وَزَيْنَبُ تَلْعَبُ مَعَ الْأَرْنَبِ":"Et Zaynab joue avec le lapin.","اَلْأَرْنَبُ يَقْفِزُ فَوْقَ الْحَبْلِ":"Le lapin saute par-dessus la corde.","وَأَحْمَدُ يَقْفِزُ خَلْفَ الْأَرْنَبِ":"Et Ahmad saute derrière le lapin.","وَزَيْنَبُ تَنْظُرُ إِلَيْهِ وَتَضْحَكُ":"Et Zaynab le regarde et rit.","مَنْ يَكْتُبُ؟ أَحْمَدُ يَكْتُبُ":"Qui écrit ? Ahmad écrit.","وَمَنْ تَقْرَأُ؟ زَيْنَبُ تَقْرَأُ":"Et qui lit ? Zaynab lit.","أَحْمَدُ يَكْتُبُ دَرْسَهُ بَعْدَ أَنْ يَقْرَأَهُ، فَيُمْسِكُ الْقَلَمَ بِيَدِهِ وَيَكْتُبُ بِهِ فَوْقَ الْوَرَقِ":"Ahmad écrit sa leçon après l'avoir lue : il tient le crayon dans sa main et écrit sur le papier.","وَبَعْدَ أَنْ يَفْرُغَ يَلْعَبُ مَعَ أُخْتِهِ زَيْنَبَ بِكُرَتِهِ":"Et quand il a fini, il joue au ballon avec sa sœur Zaynab.","أَحْمَدُ يَلْعَبُ بِكُرَتِهِ مَعَ أُخْتِهِ زَيْنَبَ بَعْدَ أَنْ يَقْرَأَ دَرْسَهُ وَيَكْتُبَهُ بِقَلَمِهِ":"Ahmad joue au ballon avec sa sœur Zaynab après avoir lu sa leçon et l'avoir écrite avec son crayon.","أَحْمَدُ يَضْرِبُ الْكُرَةَ بِيَدِهِ أَوْ رِجْلِهِ فَتَذْهَبُ عِنْدَ أُخْتِهِ زَيْنَبَ":"Ahmad frappe le ballon de la main ou du pied, et il va vers sa sœur Zaynab.","وَزَيْنَبُ تَلْقَفُ الْكُرَةَ قَبْلَ أَنْ تَقَعَ":"Et Zaynab attrape le ballon avant qu'il ne tombe.","إِنْ حَكَمْتَ فَلَا تَظْلِمْ يَا عَادِلُ":"Si tu juges, ne sois pas injuste, ô 'Âdil.","إِنْ وَعَدْتَ فَلَا تُخْلِفْ يَا حَامِدُ":"Si tu promets, ne manque pas à ta parole, ô Ḥâmid.","إِنْ أَكَلْتَ فَلَا تُسْرِفْ يَا صَالِحُ":"Si tu manges, ne mange pas avec excès, ô Ṣâliḥ.","اُنْظُرْ تَجِدْ أَمَامَكَ نُعْمَانَ وَأُخْتَهُ سُعَادَ وَهُمَا يَلْعَبَانِ الْحَبْلَ مَعَ الْأَوْلَادِ دَاخِلَ الْبُسْتَانِ":"Regarde : tu trouves devant toi Nou'mân et sa sœur Sou'âd qui jouent à la corde avec les enfants dans le jardin.","نُعْمَانُ يُمْسِكُ طَرَفَ الْحَبْلِ بِيَدِهِ، وَسُعَادُ تُمْسِكُ طَرَفَهُ الْآخَرَ، وَهَانِمُ تَقْفِزُ فَوْقَ الْحَبْلِ":"Nou'mân tient un bout de la corde dans sa main, Sou'âd tient l'autre bout, et Hânim saute par-dessus la corde.","أَمَامَكَ وَلَدَانِ وَبِنْتَانِ دَاخِلَ الْبُسْتَانِ":"Devant toi, deux garçons et deux filles dans le jardin.","تَجْلِسُ فَاطِمَةُ مَعَ أُخْتِهَا سُعَادَ، وَيَجْلِسُ نُعْمَانُ وَأَحْمَدُ أَمَامَهُمَا":"Fâṭima est assise avec sa sœur Sou'âd, et Nou'mân et Aḥmad sont assis en face d'elles.","سُعَادُ تُمْسِكُ أُخْتَهَا بِيَدَيْهَا، وَنُعْمَانُ يُمْسِكُ أَخَاهُ بِيَدَيْهِ":"Sou'âd tient sa sœur de ses deux mains, et Nou'mân tient son frère de ses deux mains.","اَلْوَلَدَانِ يَهْبِطَانِ وَالْبِنْتَانِ تَعْلُوَانِ":"Les deux garçons descendent et les deux filles montent.","نَجُودُ بِمَالِنَا":"Nous sommes généreux de nos biens.","نَصُونُ بِلَادَنَا":"Nous protégeons notre pays.","نَعُودُ لِدَارِنَا":"Nous retournons à notre maison.","نَسُودُ بِعَمَلِنَا":"Nous nous élevons par notre travail.","تَصْفُو قُلُوبُنَا":"Nos cœurs deviennent purs.","تَنْمُو عُقُولُنَا":"Nos esprits grandissent.","اَلْقِرْدُ يَلْعَبُ مَعَ صَاحِبِهِ":"Le singe joue avec son maître.","اُنْظُرْ إِلَيْهِ وَقَدْ أَمْسَكَ الْعَصَا بِيَدَيْهِ، وَالْأَوْلَادُ وَاقِفُونَ حَوْلَهُ يَنْظُرُونَ إِلَيْهِ وَهُوَ يَقْفِزُ وَيَرْقُصُ، وَهُمْ يَفْرَحُونَ بِهِ وَيَضْحَكُونَ مِنْهُ":"Regarde-le : il tient le bâton dans ses deux mains, et les enfants debout autour de lui le regardent sauter et danser ; ils s'en réjouissent et en rient.","هَذَا هُوَ الْبُسْتَانُ ذُو الْأَزْهَارِ":"Voici le jardin plein de fleurs.","أَنَا أُشَاهِدُ الْأَشْجَارَ الْعَالِيَةَ وَالْأَزْهَارَ الْجَمِيلَةَ، وَأَنْظُرُ الْأَطْفَالَ وَالْأَوْلَادَ الْكِبَارَ يَجْرُونَ وَيَلْعَبُونَ، وَيَقْطِفُونَ الْأَثْمَارَ وَالْأَزْهَارَ، وَيَعُودُونَ لِلْمَنْزِلِ وَهُمْ فَرِحُونَ":"Je vois les grands arbres et les belles fleurs, et je regarde les petits et les grands enfants courir et jouer, cueillir les fruits et les fleurs, puis rentrer à la maison tout joyeux.","يَطِيرُ حَمَامِي":"Mon pigeon vole.","يَصِيحُ دَجَاجِي":"Mon coq chante.","أَصُونُ لِسَانِي":"Je surveille ma langue.","أَجُودُ بِمَالِي":"Je donne généreusement de mes biens.","أَزُورُ سَامِي":"Je rends visite à Sâmî.","أَعُودُ لِدَارِي":"Je retourne à ma maison.","هَذِهِ كُرَتِي، أَنَا أَلْعَبُ بِهَا فِي حَدِيقَتِي مَعَ أَخِي سَامِي وَأُخْتِي سُعَادَ":"Voici mon ballon ; je joue avec lui dans mon jardin avec mon frère Sâmî et ma sœur Sou'âd.","أَنَا أَضْرِبُ الْكُرَةَ بِرِجْلِي فَتَجْرِي أَمَامَنَا، وَنَحْنُ نَجْرِي خَلْفَهَا، وَتُحَاوِلُ سُعَادُ أَنْ تُمْسِكَهَا بِيَدِهَا فَلَا تَقْدِرُ":"Je frappe le ballon du pied, il roule devant nous et nous courons derrière lui ; Sou'âd essaie de l'attraper avec la main mais n'y arrive pas.","هَذِهِ سَاعَتِي، اُنْظُرِي إِلَيْهَا يَا زَيْنَبُ":"Voici ma montre, regarde-la, ô Zaynab.","أَنَا أَعْرِفُ بِهَا أَوْقَاتِي عِنْدَ قِيَامِي مِنْ نَوْمِي وَذَهَابِي لِلْمَدْرَسَةِ":"Grâce à elle je connais mes horaires : quand je me lève et quand je vais à l'école.","وَقَدْ أَوْصَانِي أَبِي أَنْ أَحْفَظَهَا فِي جَيْبِي، وَعِنْدَمَا أَنَامُ أَضَعُهَا فِي دُرْجِي":"Mon père m'a recommandé de la garder dans ma poche, et quand je dors je la pose dans mon tiroir.","هَلْ رَأَيْتَ خَرُوفِي يَا سَعِيدُ؟":"As-tu vu mon mouton, ô Sa'îd ?","نَعَمْ رَأَيْتُهُ يَجْرِي وَيَقْفِزُ":"Oui, je l'ai vu courir et sauter.","خَرُوفِي صُوفُهُ أَبْيَضُ جَمِيلٌ":"Mon mouton a une belle laine blanche.","أَنَا أَضَعُ لَهُ عِقْدِي فِي رَقَبَتِهِ":"Je lui mets mon collier autour du cou.","وَأُلَاعِبُهُ وَهُوَ لَا يَنْطَحُنِي":"Je joue avec lui et il ne me donne pas de coups de corne.","عِنْدَمَا أَسِيرُ يَمْشِي خَلْفِي":"Quand je marche, il marche derrière moi.","وَعِنْدَمَا أَجْلِسُ يَقِفُ جَنْبِي":"Et quand je m'assois, il reste debout à côté de moi.","اُعْبُدْ رَبَّكَ":"Adore ton Seigneur.","أَكْرِمْ أُمَّكَ":"Honore ta mère.","قَابِلْ عَمَّكَ":"Rencontre ton oncle.","رَافِقْ جَدَّكَ":"Accompagne ton grand-père.","لَاعِبْ هِرَّكَ":"Joue avec ton chat.","اُشْكُلْ خَطَّكَ":"Mets les voyelles à ton écriture.","أُحِبُّ أَبِي":"J'aime mon père.","أَوَدُّ أَخِي":"J'ai de l'affection pour mon frère.","أُعِزُّ أُخْتِي":"Je chéris ma sœur.","أَهُزُّ يَدِي":"Je secoue ma main.","أَقُطُّ قَلَمِي":"Je taille mon crayon.","أَشُمُّ زَهْرِي":"Je sens ma fleur.","أَعُدُّ مَالِي":"Je compte mon argent.","أَسُرُّ جَارِي":"Je fais plaisir à mon voisin.","أَوَدُّ سَامِي":"J'ai de l'affection pour Sâmî.","أَقُولُ الْحَقَّ":"Je dis la vérité.","أَذُمُّ الْكَذِبَ":"Je blâme le mensonge.","أَشُمُّ الْفُلَّ":"Je sens le jasmin.","اِشْتَدَّ الْحَرُّ":"La chaleur est devenue forte.","عَمُّكَ يَوَدُّكَ":"Ton oncle t'aime.","جَدُّكَ يُحِبُّكَ":"Ton grand-père t'aime.","عَظِّمْ رَبَّكَ":"Glorifie ton Seigneur.","حَسِّنْ خَطَّكَ":"Améliore ton écriture.","نَظِّفْ جِسْمَكَ":"Nettoie ton corps.","هَذِّبْ نَفْسَكَ":"Éduque ton âme.","رَتِّبْ كُتُبَكَ":"Range tes livres.","نَظِّمْ عَمَلَكَ":"Organise ton travail.","أَخَافُ رَبِّي":"Je crains mon Seigneur.","أَبَرُّ أُمِّي":"Je suis bon envers ma mère.","أَوَدُّ عَمِّي":"J'aime mon oncle.","أُحِبُّ جَدِّي":"J'aime mon grand-père.","أَشُمُّ فُلِّي":"Je sens mon jasmin.","أُعِزُّ قِطِّي":"Je chéris mon chat.","أَقُصُّ شَعْرِي":"Je coupe mes cheveux.","هَذَا هُوَ عَلَمُ بِلَادِنَا، رَمْزُ وَطَنِنَا الْعَزِيزِ":"Voici le drapeau de notre pays, symbole de notre chère patrie.","يُرْفَعُ فَوْقَ الْمَدَارِسِ فِي الْأَعْيَادِ وَالْمُنَاسَبَاتِ":"Il est levé au-dessus des écoles pendant les fêtes et les cérémonies.","نَحْنُ نُحِبُّ بِلَادَنَا، وَنَعْمَلُ بِجِدٍّ لِخَيْرِهَا وَسَعَادَتِهَا":"Nous aimons notre pays et nous travaillons dur pour son bien et son bonheur.","أَرَادَ أَحْمَدُ أَنْ يَصِيدَ الْفَأْرَ، فَأَحْضَرَ الْمِصْيَدَةَ وَوَضَعَ فِيهَا الْخُبْزَ":"Ahmad voulut attraper la souris : il apporta la souricière et y mit du pain.","فَجَاءَ الْفَأْرُ وَدَخَلَ الْمِصْيَدَةَ وَأَكَلَ مِنَ الْخُبْزِ، فَتَحَرَّكَ الْغِطَاءُ وَانْطَبَقَ عَلَيْهِ":"La souris vint, entra dans la souricière et mangea du pain ; le couvercle bougea et se referma sur elle.","فَأَخَذَهُ أَحْمَدُ وَرَمَاهُ لِلْقِطَّةِ، وَاسْتَرَاحَ مِنْ شَرِّهِ":"Ahmad la prit, la donna à la chatte et fut débarrassé de ses méfaits.","قِطَّتِي صَغِيرَهْ وَاسْمُهَا نَمِيرَهْ":"Ma chatte est petite, elle s'appelle Namîra.","شَكْلُهَا جَمِيلُ شَعْرُهَا طَوِيلُ":"Elle est belle, ses poils sont longs.","لَعِبُهَا يُسَلِّي وَهْيَ لِي كَظِلِّي":"Ses jeux sont amusants, elle me suit comme mon ombre.","تُظْهِرُ الْمَهَارَهْ كَيْ تَصِيدَ فَارَهْ":"Elle montre son habileté pour attraper une souris.","دَرْسٌ مُفِيدٌ":"Une leçon utile.","خَيْرٌ كَثِيرٌ":"Beaucoup de bien.","بَلَدٌ أَمِينٌ":"Un pays sûr.","وَطَنٌ عَزِيزٌ":"Une chère patrie.","رَجُلٌ كَرِيمٌ":"Un homme généreux.","قَمَرٌ مُنِيرٌ":"Une lune brillante.","لِلْفِيلِ خُرْطُومٌ طَوِيلٌ وَرَأْسٌ كَبِيرٌ":"L'éléphant a une longue trompe et une grosse tête.","لِلْأَسَدِ شَكْلٌ مُخِيفٌ وَذَيْلٌ طَوِيلٌ":"Le lion a un air effrayant et une longue queue.","لِلْعُصْفُورِ شَكْلٌ جَمِيلٌ وَرِيشٌ كَثِيرٌ":"Le moineau a une belle forme et beaucoup de plumes.","جَبَلٌ عَالٍ":"Une haute montagne.","زَرْعٌ نَامٍ":"Une culture qui pousse.","زَهْرٌ زَاهٍ":"Une fleur éclatante.","ثَوْبٌ بَالٍ":"Un vêtement usé.","وَلَدٌ رَاعٍ":"Un garçon berger.","ثَمَرٌ دَانٍ":"Un fruit à portée de main.","قَلْبٌ وَاعٍ":"Un cœur attentif.","كَيْلٌ وَافٍ":"Une mesure complète.","مَاءٌ جَارٍ":"Une eau qui coule.","عَسَلٌ مِنْ نَحْلٍ":"Du miel des abeilles.","سَمْنٌ مِنْ لَبَنٍ":"Du beurre fait avec du lait.","خُبْزٌ مِنْ قَمْحٍ":"Du pain fait avec du blé.","ثَوْبٌ مِنْ قُطْنٍ":"Un vêtement en coton.","طَيْرٌ فِي قَفَصٍ":"Un oiseau dans une cage.","سَمَكٌ فِي بَحْرٍ":"Des poissons dans la mer.","أَخَافُ رَبِّي فِي كُلِّ وَقْتٍ":"Je crains mon Seigneur à tout moment.","وَأَتَوَكَّلُ عَلَيْهِ فِي كُلِّ أَمْرٍ":"Et je m'en remets à Lui en toute chose.","وَأَعُوذُ بِهِ مِنْ كُلِّ ضَرَرٍ":"Et je cherche protection auprès de Lui contre tout mal.","قَرَأْتُ دَرْسًا مُفِيدًا":"J'ai lu une leçon utile.","لَبِسْتُ ثَوْبًا جَدِيدًا":"J'ai mis un vêtement neuf.","عَمِلْتُ عَمَلًا جَلِيلًا":"J'ai fait un travail important.","أَكَلْتُ خُبْزًا وَجُبْنًا":"J'ai mangé du pain et du fromage.","شَرِبْتُ مَاءً وَلَبَنًا":"J'ai bu de l'eau et du lait.","نَزْرَعُ فِي حَقْلِنَا قُطْنًا وَقَمْحًا":"Nous semons dans notre champ du coton et du blé.","نَقْطِفُ مِنْ بُسْتَانِنَا زَهْرًا وَعِنَبًا":"Nous cueillons dans notre jardin des fleurs et du raisin.","نَأْخُذُ مِنْ نَحْلِنَا عَسَلًا وَشَمْعًا":"Nous prenons de nos abeilles du miel et de la cire.","هَذَا عُصْفُورٌ لَهُ شَكْلٌ جَمِيلٌ، وَرِيشٌ كَثِيرٌ، وَذَيْلٌ طَوِيلٌ، وَمِنْقَارٌ قَصِيرٌ، وَصَوْتٌ رَخِيمٌ":"Voici un moineau : il a une belle forme, beaucoup de plumes, une longue queue, un bec court et une voix douce.","هُوَ يَطِيرُ فَوْقَ الْأَشْجَارِ، وَيَلْعَبُ وَيَصِيحُ بَيْنَ الْأَغْصَانِ بِسُرُورٍ وَانْشِرَاحٍ":"Il vole au-dessus des arbres, joue et chante entre les branches avec joie et gaieté.","كَانَتْ لِفَاطِمَةَ قِطَّةٌ جَمِيلَةٌ تُحِبُّهَا كَثِيرًا، تُلَاعِبُهَا وَتُنَظِّفُهَا وَتُطْعِمُهَا مِنْ طَعَامِهَا وَتَسْقِيهَا مِنْ شَرَابِهَا":"Fâṭima avait une belle chatte qu'elle aimait beaucoup : elle jouait avec elle, la lavait, la nourrissait de sa nourriture et lui donnait à boire de sa boisson.","وَلِهَذَا كَانَتِ الْقِطَّةُ تُحِبُّهَا، فَإِذَا رَأَتْهَا دَارَتْ حَوْلَهَا رَافِعَةً ذَيْلَهَا فَرَحًا وَسُرُورًا بِهَا":"C'est pourquoi la chatte l'aimait : quand elle la voyait, elle tournait autour d'elle en levant la queue, de joie et de bonheur.","يَا طَائِرًا مَا أَجْمَلَكْ":"Ô oiseau, que tu es beau !","يَا بُلْبُلًا مَا أَحْسَنَكْ":"Ô rossignol, que tu es joli !","غَرِّدْ وَصِحْ وَقْتَ السَّحَرْ":"Chante et gazouille à l'aube.","وَالْعَبْ وَطِرْ فَوْقَ الشَّجَرْ":"Joue et vole au-dessus des arbres.","الزَّهْرُ حَوْلَكَ فِي عَجَبْ":"Les fleurs autour de toi s'émerveillent.","وَالْوَرْدُ مِثْلِي فِي طَرَبْ":"Et les roses, comme moi, sont ravies.","أَعْطَاكَ رَبِّي ذُو الْكَرَمْ":"Mon Seigneur, le Généreux, t'a donné","مَا أَنْتَ فِيهِ مِنْ نِعَمْ":"tous les bienfaits dans lesquels tu vis.","رَبٌّ كَرِيمٌ":"Un Seigneur généreux.","جَدٌّ شَرِيفٌ":"Un grand-père noble.","لِسَانٌ عَرَبِيٌّ":"Une langue arabe.","حَمَامٌ بَلَدِيٌّ":"Des pigeons du pays.","بِسَاطٌ عَجَمِيٌّ":"Un tapis persan.","نَسِيجٌ وَطَنِيٌّ":"Un tissu national.","بَيْضٌ فِي عُشٍّ":"Des œufs dans un nid.","أَسَدٌ فِي فَخٍّ":"Un lion dans un piège.","دُبٌّ عَلَى تَلٍّ":"Un ours sur une colline.","مَلَابِسُنَا مِنْ نَسِيجٍ وَطَنِيٍّ":"Nos vêtements sont faits de tissu national.","خُبْزُنَا مِنْ بُرٍّ بَلَدِيٍّ":"Notre pain est fait de blé du pays.","لَا تُفْشِ سِرًّا":"Ne divulgue pas un secret.","لَا تَعْمَلْ شَرًّا":"Ne fais pas le mal.","لَا تَقْبَلْ ذُلًّا":"N'accepte pas l'humiliation.","لَا تُحَاوِلْ غِشًّا":"N'essaie pas de tricher.","لَا تَصْحَبْ غِرًّا":"Ne fréquente pas un insouciant.","لَا تَحْمِلْ هَمًّا":"Ne te fais pas de soucis.","اَلْقَمَرُ الْمُنِيرُ":"La lune brillante.","اَلْوَرْدُ الْجَمِيلُ":"La belle rose.","اَلْوَلَدُ الْأَمِينُ":"Le garçon honnête.","اَلْوَطَنُ الْعَزِيزُ":"La chère patrie.","اَلْخَيْرُ الْكَثِيرُ":"Le bien abondant.","اَلْعَمَلُ الْمُفِيدُ":"Le travail utile.","نَزْرَعُ الْقُطْنَ وَالْقَمْحَ فِي الْحُقُولِ":"Nous semons le coton et le blé dans les champs.","نَقْطِفُ الْوَرْدَ وَالْعِنَبَ مِنَ الْبَسَاتِينِ":"Nous cueillons les roses et le raisin dans les jardins.","نَرْكَبُ الْخَيْلَ وَالْبِغَالَ وَالْحَمِيرَ":"Nous montons les chevaux, les mulets et les ânes.","نَأْخُذُ الْحَرِيرَ مِنْ دُودِ الْقَزِّ":"Nous tirons la soie du ver à soie.","نَسْتَخْرِجُ الْمَعَادِنَ مِنْ بَطْنِ الْأَرْضِ":"Nous extrayons les minerais du ventre de la terre.","نَصْنَعُ الْجُبْنَ مِنْ لَبَنِ الْغَنَمِ وَالْبَقَرِ":"Nous fabriquons le fromage avec le lait des moutons et des vaches.","قَصَّ الشَّعْرَ":"Il a coupé les cheveux.","قَطَّ الْقَلَمَ":"Il a taillé le crayon.","جَزَّ الصُّوفَ":"Il a tondu la laine.","خَاطَ الثَّوْبَ":"Il a cousu le vêtement.","طَارَ الصَّقْرُ":"Le faucon s'est envolé.","فَاضَ النَّهْرُ":"Le fleuve a débordé.","حَرَثَ الْأَرْضَ":"Il a labouré la terre.","بَذَرَ الْحَبَّ":"Il a semé les graines.","حَصَدَ الزَّرْعَ":"Il a moissonné la récolte.","أُحِبُّ الصِّدْقَ":"J'aime la sincérité.","أَشُمُّ الزَّهْرَ":"Je sens les fleurs.","أَقْبَلُ النُّصْحَ":"J'accepte le conseil.","أُحِبُّ الْوَطَنَ":"J'aime la patrie.","أَفْعَلُ الْخَيْرَ":"Je fais le bien.","أُتْقِنُ الْعَمَلَ":"Je fais bien mon travail.","أُكْرِمُ الْجَارَ":"J'honore le voisin.","حَيَوَانٌ كَبِيرُ الْجِسْمِ، طَوِيلُ الذَّيْلِ، سَرِيعُ الْعَدْوِ، أَنْوَاعُهُ كَثِيرَةٌ وَمَنَافِعُهُ عَظِيمَةٌ":"C'est un animal au grand corps, à la longue queue, rapide à la course ; il en existe beaucoup d'espèces et ses bienfaits sont grands.","يُسْتَخْدَمُ فِي الرُّكُوبِ وَجَرِّ الْعَرَبَاتِ":"On l'utilise pour monter et pour tirer les charrettes.","وَمِنْ جِلْدِهِ تُصْنَعُ النِّعَالُ، وَمِنْ شَعْرِهِ الْأَوْتَارُ، وَمِنْ حَوَافِرِهِ الْغِرَاءُ":"De sa peau on fait des sandales, de ses crins des cordes, et de ses sabots de la colle.","اَلْبَقَرَةُ كَبِيرَةُ الْجِسْمِ، كَثِيرَةُ النَّفْعِ":"La vache a un grand corps et rend beaucoup de services.","نَحْلُبُ مِنْهَا اللَّبَنَ لِنَشْرَبَهُ، وَنَعْمَلُ مِنْهُ الْجُبْنَ وَالزُّبْدَ":"Nous la trayons pour boire son lait, et nous en faisons du fromage et du beurre.","وَنَسْتَخْدِمُهَا فِي حَرْثِ الْأَرْضِ وَسَقْيِ النَّبَاتِ وَدَرْسِ الْحَصَادِ وَطَحْنِ الْحَبِّ، وَنَعْمَلُ مِنْ جِلْدِهَا الْأَحْذِيَةَ":"Nous l'utilisons pour labourer la terre, arroser les plantes, battre la récolte et moudre le grain, et nous faisons des chaussures avec sa peau.","اَلْحَمَامُ مِنَ الطُّيُورِ الْجَمِيلَةِ النَّافِعَةِ، نَرَاهُ بِكَثْرَةٍ فِي الْحُقُولِ وَقْتَ حَصَادِ الْحُبُوبِ":"Les pigeons sont de beaux oiseaux utiles ; on les voit nombreux dans les champs au moment de la moisson.","وَيَعْتَنِي كَثِيرٌ مِنَ النَّاسِ بِتَرْبِيَتِهِ فِي مَنَازِلِهِمْ لِلْغِذَاءِ بِلَحْمِهِ، وَتَسْمِيدِ الْأَرْضِ الزِّرَاعِيَّةِ بِفَضَلَاتِهِ":"Beaucoup de gens les élèvent chez eux pour se nourrir de leur viande et engraisser la terre agricole avec leurs fientes.","كَانَ سَامِي عِنْدَمَا يَقُومُ مِنْ نَوْمِهِ صَبَاحًا يُعْنَى بِنَظَافَةِ جِسْمِهِ، فَيَغْسِلُ يَدَيْهِ وَوَجْهَهُ وَعَيْنَيْهِ وَشَعْرَهُ، ثُمَّ يَلْبَسُ مَلَابِسَهُ وَيَذْهَبُ إِلَى الْمَدْرَسَةِ مَسْرُورًا":"Quand Sâmî se levait le matin, il prenait soin de la propreté de son corps : il lavait ses mains, son visage, ses yeux et ses cheveux, puis il s'habillait et partait à l'école tout content.","نَحْنُ نُحِبُّ سَامِي لِأَنَّهُ نَظِيفٌ وَمُجْتَهِدٌ":"Nous aimons Sâmî parce qu'il est propre et travailleur.","هَيَّا بِنَا هَيَّا بِنَا نَلْعَبُ فِي الْبُسْتَانِ":"Allons-y, allons-y, jouons dans le jardin !","نَجْرِي عَلَى حَشَائِشٍ مُخْضَرَّةِ الْأَلْوَانِ":"Courons sur l'herbe aux couleurs bien vertes.","فَنَجْتَنِي الْأَزْهَارَ مِنْ وَرْدٍ وَمِنْ رَيْحَانِ":"Cueillons les fleurs, roses et basilic,","وَنَقْطِفُ الْأَثْمَارَ مِنْ خَوْخٍ وَمِنْ رُمَّانِ":"et cueillons les fruits, pêches et grenades.","نَقْضِي فَرَاغَ الْوَقْتِ فِي رِيَاضَةِ الْأَبْدَانِ":"Passons le temps libre à exercer nos corps,","ثُمَّ نَعُودُ بَعْدَهَا لِلْعِلْمِ وَالْعِرْفَانِ":"puis revenons ensuite à la science et au savoir.","يَذْهَبُ سَامِي إِلَى الْمَدْرَسَةِ كُلَّ صَبَاحٍ مَعَ أُخْتِهِ سُعَادَ":"Sâmî va à l'école chaque matin avec sa sœur Sou'âd.","اُنْظُرْ إِلَيْهِ وَقَدْ حَمَلَ كُتُبَهُ وَأَدَوَاتِهِ، وَسَارَ بِنَشَاطٍ وَبِجَانِبِهِ أُخْتُهُ سُعَادُ":"Regarde-le : il a pris ses livres et ses affaires et marche avec entrain, sa sœur Sou'âd à ses côtés.","نَحْنُ نُحِبُّ الْمَدْرَسَةَ لِأَنَّهَا تُعَلِّمُنَا الْعِلْمَ وَالْأَدَبَ":"Nous aimons l'école parce qu'elle nous apprend la science et la politesse.","مَا نَقَصَ مَالٌ مِنْ صَدَقَةٍ":"L'aumône ne diminue pas les biens.","اَلصَّبْرُ مِفْتَاحُ الْفَرَجِ":"La patience est la clé du soulagement.","وَقِيلَ ادْخُلُوا الْجَنَّةَ":"Et il fut dit : « Entrez au Paradis. »","اَلتِّلْمِيذُ الْمُهَذَّبُ يُنَظِّفُ وَجْهَهُ، وَيُقَلِّمُ أَظَافِرَهُ، وَيُرَتِّبُ كُتُبَهُ، وَيُصَلِّي فَرْضَهُ، وَيُطِيعُ وَالِدَيْهِ، وَيَعْبُدُ رَبَّهُ، وَيَحْمَدُ خَالِقَهُ":"L'élève bien élevé lave son visage, coupe ses ongles, range ses livres, accomplit sa prière obligatoire, obéit à ses parents, adore son Seigneur et loue son Créateur.","آمَنْتُ بِاللَّهِ كَمَا هُوَ بِأَسْمَائِهِ وَصِفَاتِهِ، وَقَبِلْتُ جَمِيعَ أَحْكَامِهِ وَأَرْكَانِهِ":"J'ai cru en Allah tel qu'Il est, avec Ses noms et Ses attributs, et j'ai accepté toutes Ses règles et Ses piliers.","آمَنْتُ بِاللَّهِ، وَمَلَائِكَتِهِ، وَكُتُبِهِ، وَرُسُلِهِ، وَالْيَوْمِ الْآخِرِ، وَالْقَدَرِ خَيْرِهِ وَشَرِّهِ مِنَ اللَّهِ تَعَالَى، وَالْبَعْثِ بَعْدَ الْمَوْتِ حَقٌّ":"J'ai cru en Allah, en Ses anges, en Ses livres, en Ses messagers, au Jour dernier, au destin, son bien et son mal venant d'Allah le Très-Haut, et la résurrection après la mort est une vérité.","لَا إِلَهَ إِلَّا اللَّهُ مُحَمَّدٌ رَسُولُ اللَّهِ":"Il n'y a de divinité qu'Allah, Muhammad est le Messager d'Allah.","اَلتَّوَاضُعُ مَعَ الْمُتَوَاضِعِينَ":"L'humilité avec les humbles,","وَالتَّكَبُّرُ مَعَ الْمُتَكَبِّرِينَ":"et la fierté face aux orgueilleux.","اَلْعِلْمُ حَسَنٌ وَالْجَهْلُ قَبِيحٌ":"La science est belle et l'ignorance est laide.","اَلذِّكْرُ نُورٌ وَالْغَفْلَةُ ظُلُمَاتٌ":"Le rappel d'Allah est lumière et l'insouciance est ténèbres.","وَاللَّهُ أَعْلَمُ بِالصَّوَابِ":"Et Allah est le plus savant de la vérité.","وَتَمَّتْ كَلِمَتُ رَبِّكَ صِدْقًا وَعَدْلًا لَا مُبَدِّلَ لِكَلِمَاتِهِ وَهُوَ السَّمِيعُ الْعَلِيمُ":"« Et la parole de ton Seigneur s'est accomplie en vérité et en justice. Nul ne peut changer Ses paroles. Il est Celui qui entend tout et sait tout. » (Al-An'âm 115)","سُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ وَسَلَامٌ عَلَى الْمُرْسَلِينَ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ":"« Gloire à ton Seigneur, le Seigneur de la puissance, au-dessus de ce qu'ils décrivent. Et paix sur les messagers. Et louange à Allah, Seigneur des mondes. » (As-Sâffât 180-182)"};

function lvMakeQuiz(i){

function lxParticiples(P,R,t){
