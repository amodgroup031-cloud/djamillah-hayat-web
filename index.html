eau, une patience silencieuse. Allah n'oublie rien.", "Faites aujourd'hui un « petit » bien dans votre foyer."], ["إِنَّ أَوَّلَ مَا يُحَاسَبُ بِهِ الْعَبْدُ يَوْمَ الْقِيَامَةِ مِنْ عَمَلِهِ صَلَاتُهُ", "Hadith · at-Tirmidhî 413", "La première question le Jour du Jugement portera sur la prière. Si elle est perdue, le reste est en danger.", "Si elle est bonne, le reste sera arrangé. Chaque prière faite à l'heure est une porte qui s'ouvre pour vous.", "Priez la prochaine prière dès l'appel, sans attendre."], ["وَقِفُوهُمْ إِنَّهُمْ مَسْئُولُونَ", "Coran · As-Sâffât 37:24", "On arrêtera chacun pour l'interroger. Vous serez questionné sur votre foyer, votre femme, vos enfants, votre langue.", "Préparez la réponse dès aujourd'hui : chaque jour de bonté envers votre famille est une réponse écrite à l'avance.", "Demandez à votre famille : « Ai-je été dur avec vous ? »"], ["وَلَنَبْلُوَنَّكُمْ بِشَيْءٍ مِنَ الْخَوْفِ وَالْجُوعِ وَنَقْصٍ مِنَ الْأَمْوَالِ وَالْأَنْفُسِ وَالثَّمَرَاتِ وَبَشِّرِ الصَّابِرِينَ", "Coran · Al-Baqara 2:155", "Les épreuves viendront : peur, manque, perte. Ce monde n'est pas le Paradis.", "Mais Allah dit : « Annonce la bonne nouvelle aux patients. » Votre épreuve d'aujourd'hui peut devenir votre plus grande récompense.", "Dites « Inna lillahi wa inna ilayhi raji'oun » devant votre difficulté du jour."], ["مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ", "Hadith · al-Bukhârî 6018, Muslim 47", "La langue est petite, mais elle remplit le registre des péchés : médisance, mensonge, mots durs à la maison.", "Celui qui garde sa langue garde son foyer. Un silence au bon moment peut sauver un mariage.", "Aujourd'hui, avant de parler en colère, comptez jusqu'à dix."], ["وَإِنِّي لَغَفَّارٌ لِمَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَى", "Coran · Tâ-Hâ 20:82", "Remettre la repentance à demain, c'est parier sur un lendemain que personne ne vous a promis.", "Allah dit qu'Il est « Ghaffâr » : Celui qui pardonne encore et encore. La porte est ouverte tant que l'âme n'a pas atteint la gorge.", "Faites deux unités de prière de repentir aujourd'hui."], ["يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ وَأُمِّهِ وَأَبِيهِ وَصَاحِبَتِهِ وَبَنِيهِ", "Coran · 'Abasa 80:34-36", "Un jour, l'homme fuira son frère, sa mère, son père, sa femme et ses enfants. Chacun ne pensera qu'à lui-même.", "Aujourd'hui encore, vous pouvez aider les vôtres à se préparer : prier ensemble, apprendre ensemble, pardonner ensemble.", "Priez une prière en famille aujourd'hui."], ["الدُّنْيَا سِجْنُ الْمُؤْمِنِ وَجَنَّةُ الْكَافِرِ", "Hadith · Muslim 2956", "Si ce monde vous paraît facile et que vous oubliez Allah, méfiez-vous : ce n'est peut-être qu'un prêt.", "Si vous souffrez en restant fidèle, sachez que votre vraie liberté vous attend auprès d'Allah.", "Remerciez Allah pour une chose difficile qui vous a rapproché de Lui."], ["وَمَا هَذِهِ الْحَيَاةُ الدُّنْيَا إِلَّا لَهْوٌ وَلَعِبٌ وَإِنَّ الدَّارَ الْآخِرَةَ لَهِيَ الْحَيَوَانُ", "Coran · Al-'Ankabût 29:64", "Ce monde n'est qu'amusement et jeu. Combien d'heures passées sur le téléphone, et combien de minutes avec le Coran ?", "La vraie vie, la vie qui ne finit pas, est dans l'au-delà. Chaque minute donnée à Allah y devient éternelle.", "Remplacez 15 minutes d'écran par 15 minutes de Coran."], ["إِنَّ اللَّهَ يَقْبَلُ تَوْبَةَ الْعَبْدِ مَا لَمْ يُغَرْغِرْ", "Hadith · at-Tirmidhî 3537", "Il viendra un moment où la repentance ne sera plus acceptée : quand le dernier souffle arrivera à la gorge.", "Tant que vous respirez, Allah accepte votre retour. Vous respirez en lisant ces mots : c'est le moment.", "Dites cent fois aujourd'hui : « Astaghfirullah »."], ["وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَى فَإِنَّ الْجَنَّةَ هِيَ الْمَأْوَى", "Coran · An-Nâzi'ât 79:40-41", "Suivre ses envies sans frein mène à la perte. L'ego ne se rassasie jamais.", "Celui qui craint de se tenir devant Allah et retient son âme reçoit le Paradis comme demeure.", "Refusez aujourd'hui une envie que vous savez mauvaise."], ["لَا يَدْخُلُ الْجَنَّةَ قَاطِعٌ", "Hadith · al-Bukhârî 5984, Muslim 2556", "Celui qui coupe les liens de parenté est menacé de ne pas entrer au Paradis. Une rancune familiale peut fermer une porte.", "Celui qui renoue avec sa famille voit sa vie et sa subsistance bénies, comme l'a promis le Prophète ﷺ.", "Appelez aujourd'hui un parent que vous n'avez pas appelé depuis longtemps."], ["وَبِالْوَالِدَيْنِ إِحْسَانًا", "Coran · Al-Isrâ 17:23", "Un « ouf » de lassitude envers vos parents est déjà interdit. Combien de mots plus durs leur avons-nous dits ?", "Vos parents sont une porte du Paradis. Tant qu'ils vivent, cette porte est ouverte pour vous.", "Faites plaisir à votre père ou votre mère aujourd'hui, ou priez pour eux s'ils sont décédés."], ["رَغِمَ أَنْفُ مَنْ أَدْرَكَ أَبَوَيْهِ عِنْدَ الْكِبَرِ أَحَدَهُمَا أَوْ كِلَيْهِمَا فَلَمْ يَدْخُلِ الْجَنَّةَ", "Hadith · Muslim 2551", "Quelle honte d'avoir des parents âgés et de ne pas gagner le Paradis par eux.", "Chaque service rendu à un parent âgé est un pas vers le Paradis, plus sûr que bien des voyages.", "Rendez un service concret à un parent âgé aujourd'hui."], ["إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ", "Hadith · Muslim 2564", "Allah ne regarde pas vos habits, votre maison ni votre compte en banque. Un cœur sale ne se cache pas devant Lui.", "Il regarde votre cœur et vos actes : un cœur sincère et pauvre vaut plus qu'un palais vide de foi.", "Purifiez votre intention avant chaque action aujourd'hui."], ["يَا أَيُّهَا الَّذِينَ آمَنُوا قُوا أَنْفُسَكُمْ وَأَهْلِيكُمْ نَارًا", "Coran · At-Tahrîm 66:6", "Allah vous ordonne de protéger votre famille du Feu. Vous êtes responsable de la foi de votre foyer.", "Une famille qui prie et apprend ensemble se protège mutuellement. Vous pouvez commencer ce soir, simplement.", "Lisez une courte sourate avec vos enfants aujourd'hui."], ["كُلُّكُمْ رَاعٍ وَكُلُّكُمْ مَسْئُولٌ عَنْ رَعِيَّتِهِ", "Hadith · al-Bukhârî 893, Muslim 1829", "Vous êtes un berger, et le berger rendra compte de chaque brebis. Votre femme, vos enfants, vos employés.", "Le berger qui prend soin de son troupeau aura une grande récompense. Chaque effort pour eux compte.", "Prenez dix minutes pour écouter chaque membre de votre famille."], ["إِنَّ مَعَ الْعُسْرِ يُسْرًا", "Coran · Ash-Sharh 94:6", "La difficulté que vous vivez peut durer plus que vous ne l'espérez. Le désespoir est un piège de Satan.", "Allah l'a dit deux fois : avec la difficulté vient la facilité. Pas après : avec. Elle est déjà là, cachée.", "Cherchez aujourd'hui un bienfait caché dans votre difficulté."], ["مَا مِنْ مُسْلِمٍ يُصِيبُهُ أَذًى إِلَّا حَاتَّ اللَّهُ عَنْهُ خَطَايَاهُ كَمَا تَحَاتُّ وَرَقُ الشَّجَرِ", "Hadith · al-Bukhârî 5648, Muslim 2571", "La maladie, la fatigue, la tristesse… rien n'est inutile pour le croyant.", "Chaque douleur fait tomber vos péchés comme tombent les feuilles d'un arbre en saison sèche.", "Supportez aujourd'hui une gêne sans vous plaindre."], ["وَلَا يَغْتَبْ بَعْضُكُمْ بَعْضًا أَيُحِبُّ أَحَدُكُمْ أَنْ يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا", "Coran · Al-Hujurât 49:12", "La médisance, c'est manger la chair de son frère mort. Combien de repas de ce genre dans nos conversations ?", "Celui qui défend l'honneur de son frère absent, Allah défendra son visage du Feu.", "Aujourd'hui, si quelqu'un médit devant vous, changez de sujet."], ["الْمُفْلِسُ مِنْ أُمَّتِي مَنْ يَأْتِي يَوْمَ الْقِيَامَةِ بِصَلَاةٍ وَصِيَامٍ وَزَكَاةٍ وَيَأْتِي قَدْ شَتَمَ هَذَا وَقَذَفَ هَذَا", "Hadith · Muslim 2581", "Le vrai ruiné viendra avec prières et jeûnes, mais ayant insulté et blessé les gens : ses bonnes actions seront données à ses victimes.", "Demandez pardon aujourd'hui à ceux que vous avez blessés : c'est mieux que de payer avec vos prières.", "Demandez pardon à une personne que vous avez blessée."], ["إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ", "Coran · Al-Baqara 2:222", "Persister dans un péché en disant « Allah est Pardonneur » est une tromperie de l'ego.", "Allah aime ceux qui reviennent souvent vers Lui. Revenir, même après être retombé, vous rend aimé de Lui.", "Faites vos ablutions avec soin avant chaque prière aujourd'hui."], ["لَلَّهُ أَشَدُّ فَرَحًا بِتَوْبَةِ عَبْدِهِ مِنْ أَحَدِكُمْ سَقَطَ عَلَى بَعِيرِهِ وَقَدْ أَضَلَّهُ فِي أَرْضِ فَلَاةٍ", "Hadith · al-Bukhârî 6309, Muslim 2747", "Sans Allah, nous sommes perdus comme un voyageur sans monture dans le désert.", "Allah se réjouit de votre repentir plus que ce voyageur qui retrouve son chameau. Imaginez cette joie… pour vous.", "Revenez vers Allah aujourd'hui pour une faute que vous cachez."], ["يَوْمَئِذٍ تُعْرَضُونَ لَا تَخْفَى مِنْكُمْ خَافِيَةٌ", "Coran · Al-Hâqqa 69:18", "Ce jour-là, rien ne sera caché : ni les messages effacés, ni les pensées, ni les regards interdits.", "Celui qui se corrige en secret aujourd'hui sera couvert par Allah ce jour-là.", "Effacez aujourd'hui de votre téléphone ce qui déplaît à Allah."], ["سَبْعَةٌ يُظِلُّهُمُ اللَّهُ فِي ظِلِّهِ يَوْمَ لَا ظِلَّ إِلَّا ظِلُّهُ", "Hadith · al-Bukhârî 660, Muslim 1031", "Le Jour dernier, le soleil sera proche et la chaleur terrible. Les gens se noieront dans leur sueur.", "Sept catégories seront à l'ombre d'Allah, dont l'homme dont le cœur est attaché aux mosquées et celui qui donne en secret.", "Donnez une aumône en secret aujourd'hui."], ["وَسَارِعُوا إِلَى مَغْفِرَةٍ مِنْ رَبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ", "Coran · Âl-'Imrân 3:133", "Nous nous dépêchons pour l'argent et le travail, mais nous traînons pour la prière.", "Allah vous invite à courir vers un Paradis aussi large que les cieux et la terre. La course commence aujourd'hui.", "Soyez le premier de votre maison à vous lever pour la prière."], ["مَنْ صَلَّى الْبَرْدَيْنِ دَخَلَ الْجَنَّةَ", "Hadith · al-Bukhârî 574, Muslim 635", "Perdre la prière de l'aube pour quelques minutes de sommeil, c'est perdre un trésor.", "Celui qui garde les deux prières fraîches (Fadjr et 'Asr) entre au Paradis, a promis le Prophète ﷺ.", "Mettez votre réveil pour le Fadjr ce soir."], ["وَأَقِمِ الصَّلَاةَ إِنَّ الصَّلَاةَ تَنْهَى عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ", "Coran · Al-'Ankabût 29:45", "Si votre prière ne vous éloigne pas du mal, c'est qu'elle est faite avec le corps mais pas avec le cœur.", "Une prière vivante change l'homme de l'intérieur. Allah vous offre cinq occasions par jour de vous laver.", "Priez la prochaine prière lentement, en comprenant ce que vous dites."], ["بَيْنَ الرَّجُلِ وَبَيْنَ الشِّرْكِ وَالْكُفْرِ تَرْكُ الصَّلَاةِ", "Hadith · Muslim 82", "Abandonner la prière est une frontière dangereuse : le Prophète ﷺ l'a placée entre l'homme et la mécréance.", "Même si vous l'avez négligée longtemps, recommencer aujourd'hui efface la frontière. Allah attend votre retour.", "Ne manquez aucune prière aujourd'hui, même au travail."], ["إِنَّ الَّذِينَ قَالُوا رَبُّنَا اللَّهُ ثُمَّ اسْتَقَامُوا تَتَنَزَّلُ عَلَيْهِمُ الْمَلَائِكَةُ أَلَّا تَخَافُوا وَلَا تَحْزَنُوا", "Coran · Fussilat 41:30", "À la mort, les anges viendront. Pour certains avec la colère, pour d'autres avec la paix.", "À ceux qui sont restés droits, ils diront : « N'ayez pas peur, ne soyez pas tristes. » Restez droit aujourd'hui.", "Tenez une bonne résolution toute la journée."], ["الْقَبْرُ أَوَّلُ مَنْزِلٍ مِنْ مَنَازِلِ الْآخِرَةِ", "Hadith · at-Tirmidhî 2308", "La tombe est la première étape de l'au-delà. Si elle est difficile, ce qui suit est plus difficile encore.", "Si elle est facile, ce qui suit est plus facile. On la rend douce dès maintenant, par la prière et la bonté.", "Visitez un cimetière ou méditez cinq minutes sur votre tombe."], ["وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ", "Coran · Al-Baqara 2:281", "Un jour, vous reviendrez à Allah, et chaque âme recevra exactement ce qu'elle a gagné, sans aucune injustice.", "Ce même Allah est Ar-Rahmân. Celui qui revient vers Lui aujourd'hui Le trouvera Miséricordieux demain.", "Faites aujourd'hui une action pour votre retour vers Allah."], ["مَنْ غَشَّنَا فَلَيْسَ مِنَّا", "Hadith · Muslim 101", "Tricher au marché, dans la balance, dans un contrat… le Prophète ﷺ dit : celui qui triche n'est pas des nôtres.", "Le commerçant honnête sera, selon le hadith, avec les prophètes et les véridiques. L'honnêteté est un commerce gagnant.", "Soyez parfaitement honnête dans chaque échange aujourd'hui."], ["يَمْحَقُ اللَّهُ الرِّبَا وَيُرْبِي الصَّدَقَاتِ", "Coran · Al-Baqara 2:276", "L'intérêt (riba) semble faire grandir l'argent, mais Allah en retire la bénédiction.", "L'aumône semble diminuer l'argent, mais Allah la fait grandir. Choisir le halal, c'est choisir la baraka.", "Vérifiez qu'aucun gain de la semaine n'est douteux."], ["مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ", "Hadith · Muslim 2588", "L'avarice fait peur de manquer. Mais garder tout pour soi ne protège de rien.", "Le Prophète ﷺ a promis : l'aumône ne diminue jamais les biens. Elle les purifie et les multiplie.", "Donnez aujourd'hui, même une petite somme."], ["وَلَا تَقْرَبُوا الزِّنَا إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا", "Coran · Al-Isrâ 17:32", "Allah ne dit pas seulement « ne commettez pas » : Il dit « n'approchez pas ». Les regards, les messages, les rendez-vous cachés sont des approches.", "Celui qui protège sa chasteté pour Allah, Allah protège son foyer et lui donne mieux.", "Fermez aujourd'hui une porte qui mène à l'interdit."], ["مَنْ يَضْمَنْ لِي مَا بَيْنَ لَحْيَيْهِ وَمَا بَيْنَ رِجْلَيْهِ أَضْمَنْ لَهُ الْجَنَّةَ", "Hadith · al-Bukhârî 6474", "Deux portes mènent beaucoup de gens au Feu : la langue et la chasteté.", "Celui qui garde les deux, le Prophète ﷺ lui garantit le Paradis. Une garantie personnelle.", "Surveillez aujourd'hui chacune de vos paroles."], ["وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا لِتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً", "Coran · Ar-Rûm 30:21", "Un mariage sans affection ni miséricorde devient une prison, et l'on y commet beaucoup de péchés de la langue.", "Allah a placé entre les époux l'amour et la miséricorde. On les ranime par un mot doux, un geste, un pardon.", "Dites aujourd'hui un mot tendre à votre conjoint."], ["خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ", "Hadith · at-Tirmidhî 3895", "Être aimable avec les étrangers et dur avec sa femme, c'est inverser les valeurs de l'islam.", "Le meilleur d'entre vous est le meilleur envers sa famille. Votre maison est votre premier lieu d'adoration.", "Aidez dans une tâche de la maison aujourd'hui."], ["إِذَا صَلَّتِ الْمَرْأَةُ خَمْسَهَا وَصَامَتْ شَهْرَهَا وَحَفِظَتْ فَرْجَهَا وَأَطَاعَتْ زَوْجَهَا قِيلَ لَهَا ادْخُلِي الْجَنَّةَ مِنْ أَيِّ أَبْوَابِ الْجَنَّةِ شِئْتِ", "Hadith · Ahmad 1661", "La femme qui néglige ses prières et son foyer perd ce qu'Allah lui a rendu si proche.", "Prières, jeûne, chasteté et bonne entente : on lui dira d'entrer au Paradis par la porte qu'elle veut.", "Accomplissez aujourd'hui vos cinq prières à l'heure."], ["وَلَا تَنْسَوُا الْفَضْلَ بَيْنَكُمْ", "Coran · Al-Baqara 2:237", "Dans les disputes, on oublie tout le bien vécu ensemble. L'ingratitude détruit les foyers.", "Allah demande aux époux, même au moment de la séparation, de ne pas oublier le bien entre eux. Combien plus pendant le mariage !", "Rappelez-vous trois bienfaits de votre conjoint et remerciez-le."], ["لَا يَفْرَكْ مُؤْمِنٌ مُؤْمِنَةً إِنْ كَرِهَ مِنْهَا خُلُقًا رَضِيَ مِنْهَا آخَرَ", "Hadith · Muslim 1469", "Se focaliser sur un défaut de son épouse rend aveugle à toutes ses qualités.", "Si un trait vous déplaît, un autre vous plaira. Regarder le bien, c'est ce qui garde un foyer heureux.", "Notez une qualité de votre conjoint que vous oubliez souvent."], ["وَالْعَصْرِ إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ", "Coran · Al-'Asr 103:1-2", "Allah jure par le temps : l'homme est en perdition. Chaque heure qui passe sans bien est perdue pour toujours.", "Sauf ceux qui croient, font le bien, se recommandent la vérité et la patience. Quatre clés pour ne pas perdre sa vie.", "Recommandez un bien à un proche aujourd'hui."], ["نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ الصِّحَّةُ وَالْفَرَاغُ", "Hadith · al-Bukhârî 6412", "La santé et le temps libre : beaucoup les gaspillent, puis les regrettent sur leur lit de malade.", "Aujourd'hui vous êtes en bonne santé et vous avez du temps. Ce sont des trésors à investir pour l'au-delà.", "Utilisez une heure libre pour un acte d'adoration."], ["حَتَّى إِذَا جَاءَ أَحَدَهُمُ الْمَوْتُ قَالَ رَبِّ ارْجِعُونِ لَعَلِّي أَعْمَلُ صَالِحًا فِيمَا تَرَكْتُ", "Coran · Al-Mu'minûn 23:99-100", "À la mort, certains supplieront : « Seigneur, fais-moi revenir pour que je fasse le bien ! » La réponse sera : non.", "Vous êtes encore dans le temps que d'autres supplieront de retrouver. Faites aujourd'hui ce bien qu'ils regretteront de ne pas avoir fait.", "Faites aujourd'hui le bien que vous remettez toujours à demain."], ["إِذَا مَاتَ الْإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلَّا مِنْ ثَلَاثَةٍ", "Hadith · Muslim 1631", "À la mort, le registre des actes se ferme. Plus aucune prière possible, plus aucune aumône.", "Sauf trois choses : une aumône continue, une science utile, un enfant pieux qui prie pour vous. Construisez-les maintenant.", "Enseignez quelque chose d'utile à quelqu'un aujourd'hui."], ["رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا", "Coran · Al-Furqân 25:74", "Des enfants élevés sans foi peuvent devenir une épreuve pour leurs parents, ici et dans l'au-delà.", "Des enfants pieux sont la fraîcheur des yeux. Cette invocation est un trésor : répétez-la pour votre famille.", "Récitez cette invocation après chaque prière aujourd'hui."], ["مُرُوا أَوْلَادَكُمْ بِالصَّلَاةِ وَهُمْ أَبْنَاءُ سَبْعِ سِنِينَ", "Hadith · Abû Dâwûd 495", "Un enfant qui grandit sans prière deviendra souvent un adulte qui ne prie pas. Les parents en répondront.", "Commencer tôt, avec douceur et exemple, donne aux enfants un trésor pour toute leur vie.", "Priez devant vos enfants aujourd'hui et invitez-les avec vous."], ["إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّى يُغَيِّرُوا مَا بِأَنْفُسِهِمْ", "Coran · Ar-Ra'd 13:11", "Attendre que la situation change sans se changer soi-même, c'est attendre en vain.", "Dès que vous changez votre cœur, Allah commence à changer votre situation. Le premier pas est le vôtre.", "Changez une mauvaise habitude dès aujourd'hui."], ["الطُّهُورُ شَطْرُ الْإِيمَانِ", "Hadith · Muslim 223", "Négliger la propreté et les ablutions, c'est négliger la moitié de la foi.", "Chaque ablution fait couler les péchés avec l'eau, jusqu'à la dernière goutte.", "Faites vos ablutions en pensant aux péchés qui partent."], ["وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ", "Coran · Ghâfir 40:60", "Celui qui refuse d'invoquer Allah par orgueil est menacé, dit la suite du verset. Ne pas demander, c'est se croire autosuffisant.", "Allah promet de répondre. Il aime qu'on Lui demande, même les petites choses.", "Faites aujourd'hui une invocation longue et sincère."], ["لَيْسَ شَيْءٌ أَكْرَمَ عَلَى اللَّهِ مِنَ الدُّعَاءِ", "Hadith · at-Tirmidhî 3370", "Celui qui se tourne vers les gens avant Allah sera déçu.", "Rien n'est plus noble auprès d'Allah que l'invocation. Vos mains levées valent plus que mille démarches.", "Invoquez Allah pour quelqu'un d'autre en secret."], ["وَمَنْ يَتَّقِ اللَّهَ يَجْعَلْ لَهُ مَخْرَجًا وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ", "Coran · At-Talâq 65:2-3", "Chercher la subsistance par l'interdit, c'est fermer la porte de la vraie subsistance.", "Celui qui craint Allah, Allah lui ouvre une issue et le nourrit d'où il ne s'y attend pas.", "Refusez aujourd'hui un gain douteux."], ["لَوْ أَنَّكُمْ تَتَوَكَّلُونَ عَلَى اللَّهِ حَقَّ تَوَكُّلِهِ لَرَزَقَكُمْ كَمَا يَرْزُقُ الطَّيْرَ تَغْدُو خِمَاصًا وَتَرُوحُ بِطَانًا", "Hadith · at-Tirmidhî 2344", "L'angoisse de l'argent ronge le cœur et pousse au péché.", "Les oiseaux partent le ventre vide le matin et rentrent rassasiés le soir. Travaillez et confiez-vous à Allah.", "Avant de travailler, dites « Bismillah, tawakkaltu 'ala Allah »."], ["وَلَا تَمُدَّنَّ عَيْنَيْكَ إِلَى مَا مَتَّعْنَا بِهِ أَزْوَاجًا مِنْهُمْ", "Coran · Tâ-Hâ 20:131", "Regarder sans cesse ce que possèdent les autres fait naître la jalousie et l'ingratitude.", "Ce qu'Allah vous a donné est mieux et plus durable. La satisfaction est une richesse que personne ne peut voler.", "Remerciez Allah pour cinq choses que vous possédez."], ["انْظُرُوا إِلَى مَنْ أَسْفَلَ مِنْكُمْ وَلَا تَنْظُرُوا إِلَى مَنْ هُوَ فَوْقَكُمْ", "Hadith · Muslim 2963", "Se comparer à plus riche rend malheureux et ingrat envers Allah.", "Regarder ceux qui ont moins vous fait voir les bienfaits que vous ne voyiez plus.", "Aidez aujourd'hui quelqu'un qui a moins que vous."], ["وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ فَلَا تُظْلَمُ نَفْسٌ شَيْئًا", "Coran · Al-Anbiyâ 21:47", "La balance sera posée. Le poids d'un grain de moutarde sera compté. Aucune injustice ne passera.", "Pour le croyant, c'est aussi une bonne nouvelle : aucun bien caché ne sera oublié.", "Rendez aujourd'hui un droit que vous devez à quelqu'un."], ["كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ ثَقِيلَتَانِ فِي الْمِيزَانِ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ سُبْحَانَ اللَّهِ الْعَظِيمِ", "Hadith · al-Bukhârî 6406, Muslim 2694", "Une langue qui ne fait que parler du monde laisse la balance vide.", "Deux paroles légères sur la langue, lourdes dans la balance. Une minute peut remplir votre balance.", "Dites ces deux paroles cent fois aujourd'hui."], ["فَأَمَّا مَنْ ثَقُلَتْ مَوَازِينُهُ فَهُوَ فِي عِيشَةٍ رَاضِيَةٍ وَأَمَّا مَنْ خَفَّتْ مَوَازِينُهُ فَأُمُّهُ هَاوِيَةٌ", "Coran · Al-Qâri'a 101:6-9", "Celui dont la balance sera légère aura pour demeure un abîme de feu brûlant.", "Celui dont la balance sera lourde vivra une vie agréable. Chaque jour, vous pouvez ajouter du poids.", "Ajoutez aujourd'hui une bonne action « lourde » : prière de nuit, aumône, pardon."], ["اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا", "Hadith · at-Tirmidhî 1987", "Allah vous voit partout : seul, en voyage, au bureau, devant l'écran.", "Si vous tombez, faites suivre la mauvaise action d'une bonne : elle l'effacera. N'attendez pas.", "Après chaque faute aujourd'hui, faites immédiatement un bien."], ["إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ", "Coran · Hûd 11:114", "Les péchés accumulés sans repentir assombrissent le cœur jusqu'à le rendre dur.", "Les bonnes actions effacent les mauvaises. Chaque prière est une eau qui lave.", "Accomplissez une prière surérogatoire aujourd'hui."], ["إِنَّ الْعَبْدَ إِذَا أَخْطَأَ خَطِيئَةً نُكِتَتْ فِي قَلْبِهِ نُكْتَةٌ سَوْدَاءُ", "Hadith · at-Tirmidhî 3334", "Chaque péché laisse une tache noire sur le cœur. À force, le cœur se couvre et ne voit plus la vérité.", "S'il se repent, le cœur est poli et redevient brillant. Le repentir est un nettoyage.", "Demandez pardon pour vos péchés de la semaine, un par un."], ["أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ", "Coran · Ar-Ra'd 13:28", "Chercher la paix dans les distractions laisse le cœur encore plus vide.", "C'est par le rappel d'Allah que les cœurs s'apaisent. Votre anxiété a un remède gratuit.", "Faites les invocations du matin et du soir aujourd'hui."], ["مَثَلُ الَّذِي يَذْكُرُ رَبَّهُ وَالَّذِي لَا يَذْكُرُ رَبَّهُ مَثَلُ الْحَيِّ وَالْمَيِّتِ", "Hadith · al-Bukhârî 6407", "Celui qui ne se souvient pas d'Allah est comme un mort qui marche.", "Celui qui se souvient de Lui est vivant. Ramenez votre cœur à la vie par le dhikr.", "Dites « La ilaha illa Allah » cent fois aujourd'hui."], ["فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ", "Coran · Al-Baqara 2:152", "L'ingratitude envers Allah éloigne Ses bienfaits.", "Si vous vous souvenez d'Allah, Il se souvient de vous. Le Créateur des cieux pense à vous !", "Remerciez Allah à voix haute pour un bienfait du jour."], ["مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ", "Hadith · Muslim 2699", "Rester ignorant de sa religion rend facile la chute dans l'erreur.", "Chaque pas pour apprendre facilite un chemin vers le Paradis. Votre leçon d'aujourd'hui est ce chemin.", "Faites une leçon de l'École de l'islam aujourd'hui."], ["هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ", "Coran · Az-Zumar 39:9", "Celui qui sait et celui qui ne sait pas ne sont pas égaux. L'ignorance volontaire est un choix.", "La science élève ceux qui l'apprennent et la pratiquent. Il n'est jamais trop tard pour commencer.", "Apprenez aujourd'hui un verset avec son sens."], ["خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ", "Hadith · al-Bukhârî 5027", "Un Coran ouvert seulement pendant le Ramadan est un Coran délaissé.", "Le meilleur d'entre vous est celui qui apprend le Coran et l'enseigne. Une seule sourate apprise est déjà un honneur.", "Lisez une page du Coran aujourd'hui."], ["وَقَالَ الرَّسُولُ يَا رَبِّ إِنَّ قَوْمِي اتَّخَذُوا هَذَا الْقُرْآنَ مَهْجُورًا", "Coran · Al-Furqân 25:30", "Le Messager se plaindra de ceux qui ont délaissé le Coran. Ne soyez pas de ceux-là.", "Le Coran intercédera pour ceux qui le lisent. Chaque lettre lue vaut dix bonnes actions.", "Écoutez une sourate en suivant le texte."], ["اقْرَءُوا الْقُرْآنَ فَإِنَّهُ يَأْتِي يَوْمَ الْقِيَامَةِ شَفِيعًا لِأَصْحَابِهِ", "Hadith · Muslim 804", "Le Jour dernier, chacun cherchera un défenseur. Certains n'en trouveront aucun.", "Le Coran viendra intercéder pour ceux qui l'ont lu. Faites-en votre ami dès aujourd'hui.", "Lisez la sourate Al-Mulk avant de dormir."], ["وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَئِكَ كَانَ عَنْهُ مَسْئُولًا", "Coran · Al-Isrâ 17:36", "Vos oreilles, vos yeux et votre cœur témoigneront. Ce que vous écoutez et regardez sera interrogé.", "Utilisés pour le bien, ces mêmes organes témoigneront en votre faveur.", "Évitez aujourd'hui tout regard et toute musique qui éloignent d'Allah."], ["الْعَيْنَانِ تَزْنِيَانِ وَزِنَاهُمَا النَّظَرُ", "Hadith · Muslim 2657", "Le regard interdit est le début de la chute. Il commence par les yeux et finit dans le cœur.", "Celui qui baisse le regard pour Allah reçoit une douceur de foi dans le cœur.", "Baissez le regard aujourd'hui devant ce qui est interdit."], ["يَا أَيُّهَا الَّذِينَ آمَنُوا اجْتَنِبُوا كَثِيرًا مِنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌ", "Coran · Al-Hujurât 49:12", "Les soupçons détruisent les foyers : soupçonner sa femme, son mari, ses voisins sans preuve.", "Penser du bien des autres apaise le cœur et protège les relations.", "Donnez aujourd'hui une excuse à quelqu'un au lieu de le soupçonner."], ["إِيَّاكُمْ وَالظَّنَّ فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ", "Hadith · al-Bukhârî 6064", "Le soupçon est la plus mensongère des paroles. Il fait mentir le cœur avant la langue.", "Celui qui pense du bien de ses frères vit en paix et se fait aimer.", "Ne vérifiez pas le téléphone de votre conjoint par soupçon : parlez-lui."], ["وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ", "Coran · Âl-'Imrân 3:134", "La colère libérée détruit en une minute ce que l'amour a construit en des années.", "Ceux qui retiennent leur colère et pardonnent sont aimés d'Allah. Le pardon est une force.", "Pardonnez aujourd'hui une offense, même sans excuse."], ["لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ", "Hadith · al-Bukhârî 6114, Muslim 2609", "Crier, frapper, insulter dans la colère, ce n'est pas de la force : c'est une défaite.", "Le vrai fort se maîtrise quand il est en colère. Cette force se gagne jour après jour.", "En cas de colère, faites vos ablutions et asseyez-vous."], ["وَلْيَعْفُوا وَلْيَصْفَحُوا أَلَا تُحِبُّونَ أَنْ يَغْفِرَ اللَّهُ لَكُمْ", "Coran · An-Nûr 24:22", "Garder la rancune, c'est demander à Allah le pardon tout en le refusant aux autres.", "Allah demande : « N'aimeriez-vous pas qu'Allah vous pardonne ? » Pardonnez, et attendez Son pardon.", "Pardonnez dans votre cœur à quelqu'un qui vous a fait du mal."], ["مَنْ لَا يَرْحَمُ النَّاسَ لَا يَرْحَمُهُ اللَّهُ", "Hadith · al-Bukhârî 7376, Muslim 2319", "Celui qui est dur avec les gens, les enfants, les domestiques, ne doit pas s'attendre à la miséricorde.", "Soyez miséricordieux envers ceux de la terre, Celui qui est au ciel vous fera miséricorde.", "Soyez doux aujourd'hui avec un enfant ou un employé."], ["وَإِذَا الْمَوْءُودَةُ سُئِلَتْ بِأَيِّ ذَنْبٍ قُتِلَتْ", "Coran · At-Takwîr 81:8-9", "Les injustices faites aux faibles, aux filles, aux enfants seront jugées publiquement.", "Celui qui élève bien ses filles, le Prophète ﷺ a promis qu'elles seront pour lui une protection contre le Feu.", "Faites aujourd'hui un geste d'amour envers votre fille ou une fillette de la famille."], ["مَنْ عَالَ جَارِيَتَيْنِ حَتَّى تَبْلُغَا جَاءَ يَوْمَ الْقِيَامَةِ أَنَا وَهُوَ وَضَمَّ أَصَابِعَهُ", "Hadith · Muslim 2631", "Négliger l'éducation de ses filles, c'est perdre un trésor.", "Celui qui prend soin de deux filles jusqu'à l'âge adulte sera avec le Prophète ﷺ le Jour dernier, comme deux doigts unis.", "Encouragez aujourd'hui une fille dans ses études."], ["وَلَا تَقْتُلُوا أَوْلَادَكُمْ خَشْيَةَ إِمْلَاقٍ نَحْنُ نَرْزُقُهُمْ وَإِيَّاكُمْ", "Coran · Al-Isrâ 17:31", "La peur de la pauvreté pousse à des décisions qui offensent Allah.", "C'est Allah qui nourrit vos enfants et vous-mêmes. Chaque enfant vient avec sa subsistance.", "Remerciez Allah pour chacun de vos enfants par son nom."], ["إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ", "Hadith · al-Bukhârî 6094, Muslim 2607", "Le mensonge mène au péché, et le péché mène au Feu. Un petit mensonge en appelle un grand.", "La sincérité mène à la bonté, et la bonté mène au Paradis. Un mot vrai est une marche vers le haut.", "Ne dites aucun mensonge aujourd'hui, même pour plaisanter."], ["يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ", "Coran · At-Tawba 9:119", "Les mauvaises fréquentations entraînent doucement vers le bas.", "Allah vous demande d'être avec les véridiques. Choisissez des amis qui vous rappellent Allah.", "Passez du temps aujourd'hui avec une personne pieuse."], ["الْمَرْءُ عَلَى دِينِ خَلِيلِهِ فَلْيَنْظُرْ أَحَدُكُمْ مَنْ يُخَالِلُ", "Hadith · Abû Dâwûd 4833, at-Tirmidhî 2378", "Vous finirez par ressembler à vos amis. Certains vous tirent vers le Feu sans que vous le sentiez.", "Un bon ami est comme un vendeur de parfum : même sans acheter, vous repartez parfumé.", "Faites le point sur vos amitiés aujourd'hui."], ["يَوْمَ تَشْهَدُ عَلَيْهِمْ أَلْسِنَتُهُمْ وَأَيْدِيهِمْ وَأَرْجُلُهُمْ بِمَا كَانُوا يَعْمَلُونَ", "Coran · An-Nûr 24:24", "Un jour, vos mains et vos pieds parleront contre vous. Ce que vous avez touché, là où vous êtes allé.", "Ces mêmes membres peuvent témoigner de vos prosternations, de vos pas vers la mosquée.", "Marchez aujourd'hui vers un lieu de bien."], ["مَنْ تَطَهَّرَ فِي بَيْتِهِ ثُمَّ مَشَى إِلَى بَيْتٍ مِنْ بُيُوتِ اللَّهِ كَانَتْ خَطْوَتَاهُ إِحْدَاهُمَا تَحُطُّ خَطِيئَةً وَالْأُخْرَى تَرْفَعُ دَرَجَةً", "Hadith · Muslim 666", "Délaisser la mosquée alors qu'elle est proche, c'est perdre des récompenses à chaque pas.", "Chaque pas vers la mosquée efface un péché et élève d'un degré.", "Allez prier au moins une prière à la mosquée aujourd'hui."], ["وَأَنْفِقُوا مِنْ مَا رَزَقْنَاكُمْ مِنْ قَبْلِ أَنْ يَأْتِيَ أَحَدَكُمُ الْمَوْتُ", "Coran · Al-Munâfiqûn 63:10", "À la mort, certains diront : « Si seulement j'avais eu un peu de temps pour faire l'aumône ! »", "Vous avez ce temps aujourd'hui. Ce que vous donnez maintenant vous attend, intact.", "Donnez une aumône avant ce soir."], ["اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ", "Hadith · al-Bukhârî 1417, Muslim 1016", "Le Feu est réel, et l'on s'en protège même avec une demi-datte donnée.", "Aucun don n'est trop petit : une demi-datte peut être votre bouclier.", "Donnez aujourd'hui, même très peu."], ["إِنَّ الْمُنَافِقِينَ فِي الدَّرْكِ الْأَسْفَلِ مِنَ النَّارِ", "Coran · An-Nisâ 4:145", "Prier devant les gens et négliger seul, promettre et trahir… l'hypocrisie mène au plus profond du Feu.", "Ceux qui se repentent et deviennent sincères sont avec les croyants, dit le verset suivant.", "Faites aujourd'hui une adoration en secret, pour Allah seul."], ["آيَةُ الْمُنَافِقِ ثَلَاثٌ إِذَا حَدَّثَ كَذَبَ وَإِذَا وَعَدَ أَخْلَفَ وَإِذَا اؤْتُمِنَ خَانَ", "Hadith · al-Bukhârî 33, Muslim 59", "Mentir, ne pas tenir sa promesse, trahir la confiance : trois signes de l'hypocrite.", "Les corriger fait de vous une personne digne de confiance, aimée d'Allah et des gens.", "Tenez aujourd'hui une promesse que vous aviez oubliée."], ["وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا إِنَّ اللَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٍ فَخُورٍ", "Coran · Luqmân 31:18", "L'orgueil est le péché de Satan. Le moindre grain d'orgueil peut empêcher d'entrer au Paradis.", "L'humilité élève : celui qui s'humilie pour Allah, Allah l'élève.", "Servez quelqu'un aujourd'hui avec humilité."], ["لَا يَدْخُلُ الْجَنَّةَ مَنْ كَانَ فِي قَلْبِهِ مِثْقَالُ ذَرَّةٍ مِنْ كِبْرٍ", "Hadith · Muslim 91", "Un atome d'orgueil suffit à fermer la porte du Paradis.", "L'orgueil, c'est refuser la vérité et mépriser les gens. Accepter un conseil est déjà une victoire sur lui.", "Acceptez aujourd'hui une critique sans vous défendre."], ["إِنَّ اللَّهَ مَعَ الصَّابِرِينَ", "Coran · Al-Baqara 2:153", "L'impatience fait perdre la récompense de l'épreuve.", "Allah est avec ceux qui patientent. Dans votre difficulté, vous n'êtes pas seul.", "Patientez aujourd'hui sans vous plaindre à personne d'autre qu'Allah."], ["عَجَبًا لِأَمْرِ الْمُؤْمِنِ إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ", "Hadith · Muslim 2999", "Celui qui se plaint de tout transforme ses bienfaits en malheurs.", "Tout est bien pour le croyant : il remercie dans la joie et patiente dans l'épreuve. Les deux sont récompensés.", "Dites « Al-hamdu lillah » pour tout ce qui arrive aujourd'hui."], ["وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَى", "Coran · Ad-Duhâ 93:5", "Les jours sombres font croire qu'Allah vous a abandonné. C'est un mensonge du découragement.", "Allah dit à Son Prophète : « Ton Seigneur te donnera et tu seras satisfait. » Cette promesse console tous les cœurs brisés.", "Lisez la sourate Ad-Duhâ avec son sens."], ["لَا يَقْضِي اللَّهُ لِلْمُؤْمِنِ قَضَاءً إِلَّا كَانَ خَيْرًا لَهُ", "Hadith · Ahmad 12160", "Refuser le décret d'Allah fait souffrir deux fois : l'épreuve et la révolte.", "Tout ce qu'Allah décrète pour le croyant est un bien, même s'il ne le voit pas encore.", "Acceptez aujourd'hui une chose que vous ne pouvez pas changer."], ["فَفِرُّوا إِلَى اللَّهِ", "Coran · Adh-Dhâriyât 51:50", "On fuit les problèmes vers le téléphone, les gens, les distractions… et ils reviennent.", "Fuyez vers Allah : Il est le seul refuge qui ne déçoit jamais.", "Quand un souci arrive aujourd'hui, priez deux unités."], ["وَلَذِكْرُ اللَّهِ أَكْبَرُ", "Coran · Al-'Ankabût 29:45", "Une journée sans rappel d'Allah est une journée perdue, même pleine d'activité.", "Le rappel d'Allah est plus grand que tout. Une parole de dhikr peut valoir plus que des heures de travail.", "Faites du dhikr sur le chemin aujourd'hui."], ["وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ", "Coran · Âl-'Imrân 3:133", "Le Paradis n'est pas donné à celui qui ne fait rien : il est préparé pour les pieux.", "Mais il est immense, assez large pour vous. Allah veut que vous y entriez.", "Faites aujourd'hui une action en pensant au Paradis."], ["قَالَ اللَّهُ أَعْدَدْتُ لِعِبَادِيَ الصَّالِحِينَ مَا لَا عَيْنٌ رَأَتْ وَلَا أُذُنٌ سَمِعَتْ وَلَا خَطَرَ عَلَى قَلْبِ بَشَرٍ", "Hadith qudsî · al-Bukhârî 3244, Muslim 2824", "Échanger cela contre quelques plaisirs interdits serait la pire affaire.", "Ce qu'Allah a préparé pour les vertueux, aucun œil ne l'a vu, aucune oreille ne l'a entendu. Votre patience a un prix immense.", "Imaginez le Paradis cinq minutes avant de dormir."], ["وَسِيقَ الَّذِينَ كَفَرُوا إِلَى جَهَنَّمَ زُمَرًا", "Coran · Az-Zumar 39:71", "Des groupes seront conduits vers l'Enfer, et ses gardiens leur demanderont : « Ne vous avait-on pas avertis ? »", "D'autres seront conduits vers le Paradis, accueillis par « Paix sur vous ». Vous êtes averti aujourd'hui : choisissez votre groupe.", "Écrivez une résolution pour votre au-delà."], ["نَارُكُمْ جُزْءٌ مِنْ سَبْعِينَ جُزْءًا مِنْ نَارِ جَهَنَّمَ", "Hadith · al-Bukhârî 3265, Muslim 2843", "Le feu de ce monde, qui nous brûle en un instant, n'est qu'une partie sur soixante-dix du feu de l'Enfer.", "Allah n'a pas créé le Feu pour vous : Il vous a envoyé un Prophète pour vous en protéger. Écoutez-le.", "Rappelez-vous ce hadith devant une flamme aujourd'hui."], ["وَلَوْ تَرَى إِذِ الْمُجْرِمُونَ نَاكِسُو رُءُوسِهِمْ عِنْدَ رَبِّهِمْ", "Coran · As-Sajda 32:12", "Les coupables baisseront la tête devant leur Seigneur en disant : « Nous avons vu et entendu, renvoie-nous ! »", "Vous n'avez pas besoin d'attendre de voir. Vous pouvez croire et agir aujourd'hui.", "Faites aujourd'hui ce que vous voudriez avoir fait si vous mouriez demain."], ["إِنَّ أَحَدَكُمْ لَيَعْمَلُ بِعَمَلِ أَهْلِ الْجَنَّةِ حَتَّى مَا يَكُونُ بَيْنَهُ وَبَيْنَهَا إِلَّا ذِرَاعٌ", "Hadith · al-Bukhârî 3208, Muslim 2643", "La fin compte plus que tout : ne vous croyez jamais sauvé, ne relâchez jamais vos efforts.", "Demandez à Allah une belle fin. Le Prophète ﷺ disait : « Ô Toi qui retournes les cœurs, affermis mon cœur sur Ta religion. »", "Répétez cette invocation aujourd'hui : « Yâ muqallib al-qulûb… »"], ["رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا", "Coran · Âl-'Imrân 3:8", "Combien ont connu la foi puis l'ont perdue ? Le cœur peut dévier.", "Cette invocation des savants protège le cœur. Celui qui la dit sincèrement est tenu par Allah.", "Récitez cette invocation dans votre prosternation."], ["مَنْ أَحَبَّ لِقَاءَ اللَّهِ أَحَبَّ اللَّهُ لِقَاءَهُ", "Hadith · al-Bukhârî 6507, Muslim 2683", "Celui qui a peur de la mort parce qu'il ne s'y est pas préparé redoute la rencontre avec Allah.", "Celui qui aime rencontrer Allah, Allah aime le rencontrer. Préparez cette rencontre comme on prépare la visite d'un être aimé.", "Faites aujourd'hui une action que vous voudriez présenter à Allah."], ["يَا أَيَّتُهَا النَّفْسُ الْمُطْمَئِنَّةُ ارْجِعِي إِلَى رَبِّكِ رَاضِيَةً مَرْضِيَّةً", "Coran · Al-Fajr 89:27-28", "Certaines âmes seront arrachées avec violence au moment de la mort.", "À l'âme apaisée, on dira : « Reviens vers ton Seigneur, satisfaite et agréée. » Puissiez-vous l'entendre.", "Vivez aujourd'hui comme une âme apaisée : sans rancune, sans péché volontaire."], ["مَنْ كَانَ آخِرُ كَلَامِهِ لَا إِلَهَ إِلَّا اللَّهُ دَخَلَ الْجَنَّةَ", "Hadith · Abû Dâwûd 3116", "On meurt comme on a vécu : la langue habituée au mensonge ne trouvera pas la chahâda à la fin.", "Habituez votre langue à « La ilaha illa Allah » : elle sera vos derniers mots, inchâ Allah.", "Dites la chahâda à voix haute plusieurs fois aujourd'hui."], ["فَمَنْ زُحْزِحَ عَنِ النَّارِ وَأُدْخِلَ الْجَنَّةَ فَقَدْ فَازَ", "Coran · Âl-'Imrân 3:185", "Toutes les réussites du monde ne valent rien si l'on échoue à la dernière épreuve.", "La vraie réussite est d'être écarté du Feu et admis au Paradis. C'est le seul diplôme qui compte.", "Fixez-vous aujourd'hui un objectif pour l'au-delà."], ["لَا تَحْقِرَنَّ مِنَ الْمَعْرُوفِ شَيْئًا وَلَوْ أَنْ تَلْقَى أَخَاكَ بِوَجْهٍ طَلْقٍ", "Hadith · Muslim 2626", "Mépriser les petits biens fait perdre de nombreuses récompenses.", "Même accueillir votre frère avec un visage souriant est un bien. Votre sourire à la maison est une aumône.", "Souriez à chaque membre de votre famille aujourd'hui."], ["وَقُولُوا لِلنَّاسِ حُسْنًا", "Coran · Al-Baqara 2:83", "Les mots durs restent dans les cœurs longtemps après avoir été dits.", "Allah ordonne de dire aux gens de belles paroles. Une belle parole est une aumône.", "Ne dites que des paroles douces à votre famille aujourd'hui."], ["الْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ", "Hadith · al-Bukhârî 2989, Muslim 1009", "Une parole blessante peut détruire une journée, une amitié, un mariage.", "Une bonne parole est une aumône. Vous pouvez faire l'aumône toute la journée sans argent.", "Complimentez sincèrement trois personnes aujourd'hui."], ["إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ", "Coran · Al-Baqara 2:156", "Nous appartenons à Allah : nos enfants, nos biens, nos corps ne sont qu'un dépôt qu'Il reprendra.", "Celui qui le dit avec patience reçoit les bénédictions et la miséricorde de son Seigneur, et il est bien guidé.", "Prenez soin aujourd'hui du « dépôt » qu'est votre santé."], ["مَا يُصِيبُ الْمُسْلِمَ مِنْ نَصَبٍ وَلَا وَصَبٍ وَلَا هَمٍّ وَلَا حُزْنٍ حَتَّى الشَّوْكَةِ يُشَاكُهَا إِلَّا كَفَّرَ اللَّهُ بِهَا مِنْ خَطَايَاهُ", "Hadith · al-Bukhârî 5641", "Rien de ce que vous endurez n'est vain : ni la fatigue, ni l'inquiétude, ni la tristesse.", "Même l'épine qui vous pique efface des péchés. Votre douleur d'aujourd'hui vous purifie.", "Offrez à Allah votre fatigue de la journée."], ["الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ بِاللَّيْلِ وَالنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "Coran · Al-Baqara 2:274", "L'argent gardé sera un poids le Jour dernier.", "Ceux qui donnent nuit et jour, en secret et en public, n'auront ni peur ni tristesse.", "Donnez de nuit, en secret, aujourd'hui."], ["أَحَبُّ الْأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ", "Hadith · al-Bukhârî 6464, Muslim 783", "Les grandes résolutions abandonnées au bout de trois jours laissent un vide.", "L'action la plus aimée d'Allah est la plus régulière, même petite. Un peu chaque jour vaut plus que beaucoup une fois.", "Choisissez une petite adoration à faire chaque jour, et commencez aujourd'hui."], ["وَتُوبُوا إِلَى اللَّهِ جَمِيعًا أَيُّهَ الْمُؤْمِنُونَ لَعَلَّكُمْ تُفْلِحُونَ", "Coran · An-Nûr 24:31", "Personne n'est au-dessus du besoin de repentir : Allah s'adresse à tous les croyants.", "La réussite est promise à ceux qui se repentent. Le repentir n'est pas une honte, c'est le chemin des gagnants.", "Faites un repentir en famille ce soir : chacun demande pardon à Allah."], ["وَاللَّهِ إِنِّي لَأَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ فِي الْيَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةً", "Hadith · al-Bukhârî 6307", "Si le Prophète ﷺ, pardonné, demandait pardon plus de soixante-dix fois par jour, que dire de nous ?", "L'istighfâr ouvre les portes de la subsistance, de la pluie et des enfants (Nûh 71:10-12).", "Dites « Astaghfirullah wa atoubou ilayh » soixante-dix fois aujourd'hui."], ["فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا يُرْسِلِ السَّمَاءَ عَلَيْكُمْ مِدْرَارًا", "Coran · Nûh 71:10-11", "Les péchés retiennent la pluie, la baraka et la subsistance.", "Demandez pardon : Allah envoie la pluie, les biens et les enfants à ceux qui implorent Son pardon.", "Faites l'istighfâr pour votre pays aujourd'hui."], ["يَنْزِلُ رَبُّنَا كُلَّ لَيْلَةٍ إِلَى السَّمَاءِ الدُّنْيَا حِينَ يَبْقَى ثُلُثُ اللَّيْلِ الْآخِرُ", "Hadith · al-Bukhârî 1145, Muslim 758", "Combien de nuits passées à dormir pendant qu'Allah appelle : « Qui M'invoque, que Je lui réponde ? »", "Chaque nuit, la dernière partie offre une porte ouverte. Une seule prière de nuit peut changer votre vie.", "Réveillez-vous cette nuit pour deux unités de prière, même courtes."], ["وَبِالْأَسْحَارِ هُمْ يَسْتَغْفِرُونَ", "Coran · Adh-Dhâriyât 51:18", "Les pieux dormaient peu la nuit et demandaient pardon à l'aube. Et nous, que faisons-nous de nos nuits ?", "L'aube est un moment béni : une invocation à ce moment n'est pas perdue.", "Faites l'istighfâr avant le Fadjr demain."], ["مَنْ قَالَ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ فِي يَوْمٍ مِائَةَ مَرَّةٍ كَانَتْ لَهُ حِرْزًا مِنَ الشَّيْطَانِ", "Hadith · al-Bukhârî 3293, Muslim 2691", "Satan vous attaque chaque jour : par la colère, la paresse, les regards.", "Cette parole dite cent fois par jour est une forteresse contre lui jusqu'au soir.", "Dites cette parole cent fois ce matin."], ["إِنَّ الشَّيْطَانَ لَكُمْ عَدُوٌّ فَاتَّخِذُوهُ عَدُوًّا", "Coran · Fâtir 35:6", "Satan est un ennemi déclaré. Il ne vous veut que le Feu, et il est patient.", "Allah vous a donné les armes : la prière, le dhikr, la sourate Al-Baqara à la maison.", "Lisez Âyat al-Kursî après chaque prière aujourd'hui."], ["لَا تَجْعَلُوا بُيُوتَكُمْ مَقَابِرَ إِنَّ الشَّيْطَانَ يَنْفِرُ مِنَ الْبَيْتِ الَّذِي تُقْرَأُ فِيهِ سُورَةُ الْبَقَرَةِ", "Hadith · Muslim 780", "Une maison sans Coran ni prière ressemble à un cimetière, et les disputes y trouvent leur place.", "Satan fuit la maison où l'on récite Al-Baqara. Faites de votre maison un lieu vivant.", "Faites jouer ou lisez la sourate Al-Baqara à la maison cette semaine."], ["وَأْمُرْ أَهْلَكَ بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا", "Coran · Tâ-Hâ 20:132", "Fermer les yeux sur la prière de sa famille, c'est la laisser se perdre.", "Allah demande de patienter dans cet effort. Il ajoute : « Nous ne te demandons pas de subsistance, c'est Nous qui te nourrissons. »", "Réveillez votre famille pour le Fadjr demain, avec douceur."], ["مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ", "Hadith · al-Bukhârî 38, Muslim 760", "Jeûner par habitude, sans foi ni espoir de récompense, laisse le cœur inchangé.", "Jeûner avec foi et espoir efface les péchés passés. Les jeûnes volontaires (lundi, jeudi) gardent cette lumière toute l'année.", "Prévoyez un jeûne volontaire cette semaine."], ["إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ", "Hadith · al-Bukhârî 1, Muslim 1907", "Une grande action faite pour être vu ne vaut rien auprès d'Allah.", "Une petite action avec une intention pure peut peser une montagne. Même manger et dormir deviennent adoration avec la bonne intention.", "Formulez une intention pour Allah avant votre travail aujourd'hui."], ["وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ", "Coran · Al-Bayyina 98:5", "Chercher les compliments des gens dans l'adoration annule la récompense.", "La sincérité transforme les petites choses en grands trésors.", "Faites aujourd'hui un bien sans le raconter à personne."], ["وَعَسَى أَنْ تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَكُمْ", "Coran · Al-Baqara 2:216", "On se révolte souvent contre ce qui était en réalité un bien caché.", "Allah sait et vous ne savez pas. Ce qui vous déplaît aujourd'hui peut être la porte de votre bonheur.", "Faites confiance à Allah pour une situation qui vous inquiète."], ["لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا", "Coran · Al-Baqara 2:286", "Se dire « je ne peux pas » pour fuir une obligation est souvent une excuse.", "Allah ne demande jamais plus que ce que vous pouvez porter. Votre épreuve est à votre mesure.", "Faites aujourd'hui une adoration que vous trouvez difficile."], ["إِنَّ اللَّهَ كَتَبَ الْإِحْسَانَ عَلَى كُلِّ شَيْءٍ", "Hadith · Muslim 1955", "Le travail bâclé, la prière précipitée, la promesse à moitié tenue : Allah voit le manque de soin.", "Allah a prescrit l'excellence en toute chose. Bien faire son travail est une adoration.", "Faites votre travail aujourd'hui comme si Allah le regardait, car Il le regarde."], ["وَهُوَ مَعَكُمْ أَيْنَ مَا كُنْتُمْ", "Coran · Al-Hadîd 57:4", "Il n'y a pas d'endroit caché à Allah : ni la chambre fermée, ni le message privé.", "Il est avec vous dans la solitude aussi : vous n'êtes jamais seul dans vos peines.", "Parlez à Allah aujourd'hui comme à un proche qui vous écoute."]];            // [ar, source, peur, espoir, action]
const CONSEILS={"couple": [["Un mot de remerciement précis (« merci d'avoir préparé ce repas ») touche plus qu'un « merci » général.", "Remerciez votre conjoint pour une chose précise aujourd'hui."], ["Les disputes ne se règlent jamais bien quand on a faim, sommeil ou qu'on est fatigué. Reportez la discussion à un moment calme.", "Fixez avec votre conjoint un « moment calme » pour parler des sujets difficiles."], ["Le téléphone à table vole les meilleurs moments du foyer. Un repas sans écran rapproche plus qu'une sortie coûteuse.", "Faites un repas sans téléphone aujourd'hui."], ["Le Prophète ﷺ faisait la course avec 'Âïcha. Le jeu et le rire entre époux font partie de la Sunna.", "Partagez un moment de rire avec votre conjoint aujourd'hui."], ["Critiquer le comportement est possible ; critiquer la personne blesse. Dites « Ce retard m'a inquiété », pas « Tu es irresponsable ».", "Remplacez un reproche par une phrase qui commence par « Je ressens… »."], ["Les petites attentions régulières comptent plus qu'un grand cadeau une fois par an.", "Faites une petite surprise sans occasion."], ["Le silence boudeur de plusieurs jours est un poison. Le Prophète ﷺ a interdit de bouder son frère plus de trois jours ; que dire de son conjoint ?", "Si vous boudez, faites le premier pas aujourd'hui."], ["Votre conjoint n'est pas votre adversaire : c'est le problème qui est l'adversaire. Asseyez-vous du même côté de la table.", "Face à un problème, dites : « Comment pouvons-nous le résoudre ensemble ? »"], ["Les secrets du foyer ne se racontent ni à la famille ni aux amis. La confiance se construit dans la discrétion.", "Gardez pour vous les détails de votre dernière dispute."], ["Écouter, ce n'est pas préparer sa réponse pendant que l'autre parle. C'est chercher à comprendre.", "Écoutez votre conjoint dix minutes sans l'interrompre."], ["L'argent est l'une des premières causes de disputes. Un budget fait à deux évite les soupçons et les reproches.", "Faites le point sur les dépenses du mois ensemble."], ["Demander pardon n'est pas une faiblesse : c'est la force des cœurs nobles.", "Demandez pardon pour une parole dure, même ancienne."], ["Les compliments ne doivent pas s'arrêter après le mariage. Votre conjoint a besoin de se sentir beau ou belle à vos yeux.", "Faites un compliment sincère à votre conjoint."], ["Le Prophète ﷺ aidait aux tâches de la maison : il raccommodait ses vêtements et servait sa famille.", "Prenez en charge une tâche ménagère aujourd'hui sans qu'on vous le demande."], ["Comparer son conjoint à d'autres (« le mari de ma sœur… », « la femme de mon ami… ») détruit l'estime.", "Ne comparez jamais votre conjoint à quelqu'un d'autre."], ["Se souvenir des débuts ravive l'amour : les premiers jours, les premiers rêves partagés.", "Racontez ensemble un beau souvenir de votre mariage."], ["La jalousie excessive étouffe. La confiance se donne, et elle se mérite par la transparence.", "Rassurez votre conjoint sur un sujet qui l'inquiète."], ["Prier ensemble unit les cœurs devant Allah avant de les unir dans la maison.", "Priez au moins une prière ensemble aujourd'hui."], ["Les belles-familles sont à respecter, mais les décisions du foyer appartiennent au couple.", "Discutez à deux d'une décision avant d'en parler à la famille."], ["Le toucher bienveillant (une main sur l'épaule, un câlin) apaise plus que de longs discours.", "Offrez un geste de tendresse à votre conjoint."], ["Une dispute n'est pas un tribunal : le but n'est pas de gagner, mais de rester unis.", "Lors d'un désaccord, cherchez la paix plutôt que la victoire."], ["Les hommes et les femmes expriment souvent l'amour différemment. Demandez à votre conjoint ce qui le fait se sentir aimé.", "Posez la question : « Qu'est-ce qui te fait te sentir aimé(e) ? »"], ["Ne laissez pas le soleil se coucher sur une colère. Réconciliez-vous avant de dormir.", "Ce soir, ne dormez pas fâchés."], ["Les promesses non tenues usent la confiance goutte à goutte.", "Tenez aujourd'hui une petite promesse faite à votre conjoint."], ["Parler de ses rêves ensemble donne une direction commune au foyer.", "Parlez d'un projet commun pour l'année prochaine."], ["Une parole douce devant les enfants leur apprend ce qu'est un foyer heureux.", "Dites un mot gentil à votre conjoint devant vos enfants."], ["La maladie ou la fatigue de votre conjoint est le moment de montrer votre amour par les actes.", "Proposez votre aide à votre conjoint s'il est fatigué."], ["Le Prophète ﷺ appelait 'Âïcha par des surnoms affectueux. Les mots tendres nourrissent l'amour.", "Appelez votre conjoint par un petit nom affectueux."], ["Une sortie simple à deux (une promenade, un thé) entretient le lien plus qu'on ne le croit.", "Prévoyez un moment seul à deux cette semaine."], ["Les reproches répétés sur le même sujet deviennent du harcèlement. Dites-le une fois, clairement, puis faites confiance.", "Abandonnez aujourd'hui un vieux reproche."], ["Le respect se voit dans les petites choses : frapper avant d'entrer, ne pas fouiller, demander l'avis.", "Demandez l'avis de votre conjoint sur une décision."], ["La gratitude transforme le regard : on voit ce qu'on a, au lieu de ce qui manque.", "Écrivez trois qualités de votre conjoint et lisez-les-lui."], ["Les épreuves partagées rapprochent quand on les affronte ensemble plutôt que l'un contre l'autre.", "Partagez un souci avec votre conjoint et priez ensemble pour lui."], ["Être présent, ce n'est pas seulement être dans la même pièce : c'est être attentif.", "Posez votre téléphone quand votre conjoint vous parle."], ["La douceur ne se trouve dans une chose sans l'embellir, a dit le Prophète ﷺ (Muslim 2594).", "Parlez doucement dans votre foyer toute la journée."], ["Une invocation pour son conjoint, faite en secret, est une preuve d'amour que seul Allah voit.", "Faites une invocation pour votre conjoint dans votre prosternation."], ["Laissez à votre conjoint un peu de temps pour lui-même : chacun a besoin de souffler.", "Offrez à votre conj function noRep(key,n,day){
  if(!n) return 0;
  const R=S.nr[key]=S.nr[key]||{s:[],d:{}};
  day=day||isoOff(S.dayOffset||0);
  if(R.d[day]!=null&&R.d[day]<n) return R.d[day];
  let free=[];for(let i=0;i<n;i++) if(!R.s.includes(i)) free.push(i);
  if(!free.length){R.s=[];free=[...Array(n).keys()];}           // tout a été vu : nouveau cycle, nouvel ordre
  const used=new Set(Object.values(R.d));                          // ne jamais redonner un conseil déjà attribué à un autre jour
  const pool=free.filter(i=>!used.has(i)); const src=pool.length?pool:free;
  const k=src[Math.floor(Math.random()*src.length)];
  R.s.push(k);R.d[day]=k;
  const ks=Object.keys(R.d).sort(); while(ks.length>45) delete R.d[ks.shift()];
  save(); return k;
}

    ka.innerHTML=`<span class="tag">${LC()?LC().parent[S.gender]:(S.gender==="husband"?"Le père":"La mère")}</span><p class="ar verse" style="font-size:20px">${ar}</p><p class="src">${src}</p><p>${tx}</p>`}
  // Spirituel

  // chaque nouveau jour s'ouvre sur le rappel du cœur

  box.querySelectorAll("[data-tdk]").forEach(a=>a.hidden=a.dataset.tdk!==S.tdTab);

function crPeriod(){const h=new Date().getHours();return h>=4&&h<12?"m":(h>=18||h<4)?"e":null}

function crCallParts(p){

    return [[crF(CRT.callM,{n}),crFR],[fear,crFR],[hope,crFR],[CRT.act+" : "+act,crFR]]}
  return [[crF(CRT.callE,{n}),crFR],["Astaghfirullah wa atoubou ilayh.",crFR]];
}
function crCall(p){speakSeq(crCallParts(p))}
function crAutoCall(){
  if(!S.gender||S.cr.call===false||(S.vx||{}).open===false||crOv) return;
  const p=crPeriod(), d=crNowIso(); if(!p) return;
  if(p==="m"&&S.cr.mSpoke!==d){S.cr.mSpoke=d;S.brSpoke=iso(today);save();crCall("m")}

}

// ---------- 4. Heure de la prière : écran qui insiste ----------
function crCur(){
  const [,la,lo]=cityNow(), now=new Date(), pt=prayerTimes(now,la,lo), h=now.getHours()+now.getMinutes()/60;
  const end={fajr:pt.sunrise,dhuhr:pt.asr,asr:pt.maghrib,maghrib:pt.isha,isha:24};
  for(const [k,l] of CRP) if(h>=pt[k]&&h<end[k]) return {k,l,start:pt[k]};
  return null;
}
function crCheck(){
  try{
    if(!S.gender||S.cr.insist===false||crExempt()||document.visibilityState==="hidden"){crHide();return}
    const c=crCur(), d=crNowIso();
    if(!c||crDone(d,c.k)){crHide();return}
    const z=S.cr.snz; if(z&&z.k===d+c.k&&Date.now()<z.u){crHide();return}
    crShow(c,d);
  }catch(e){}
}
function crShow(c,d){
  const key=d+c.k; if(crOv&&crOvKey===key) return;
  crHide(); crOv=true; crOvKey=key;
  const n=esc(crNom()), p=t(c.l), hd=CRH[Math.floor(Math.random()*CRH.length)], cnt=CRP.filter(([k])=>crDone(d,k)).length;
  const el=document.createElement("div"); el.id="cr-ov"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
  el.innerHTML=`<div class="cr-ov-in"><div class="cr-ov-ic">🕌</div><h2>${crF(CRT.ovH,{n})}</h2><h3>${crF(CRT.ovP,{p})}</h3><p class="cr-ov-t">${crF(CRT.ovS,{t:hm(c.start)})}</p>
   <p class="ar cr-ov-ar">${hd[0]}</p><p class="cr-ov-fr">${hd[1]}</p><p class="cr-ov-tx">${CRT.ovTx}</p>
   <button class="cr-ov-done" data-crdone="${c.k}">${CRT.ovDone}</button><button class="cr-ov-go" data-crgo="${c.k}">${CRT.ovGo}</button>
   ${S.gender==="wife"?`<button class="cr-ov-ex" data-crex>${CRT.ovEx}</button>`:""}
   <p class="cr-ov-c">${crF(CRT.ovCount,{d:cnt})}</p></div>`;
  document.body.appendChild(el); document.documentElement.classList.add("cr-lock");
  setTimeout(()=>{if(crOv&&crOvKey===key&&(S.vx||{}).open!==false) speakSeq([[crF(CRT.ovCall,{n:crNom(),p}),crFR]])},500);
  try{if(navigator.vibrate)navigator.vibrate([400,200,400,200,800])}catch(e){}
  try{if(NATIVE&&PL.Haptics)PL.Haptics.vibrate({duration:900}).catch(()=>{})}catch(e){}
}
function crHide(){const el=document.getElementById("cr-ov");if(el)el.remove();document.documentElement.classList.remove("cr-lock");crOv=false;crOvKey=""}
function crMarkDone(k,d){
  d=d||crNowIso(); S.pr[d]=S.pr[d]||{}; S.pr[d][k]=1;
  const ks=Object.keys(S.pr).sort(); while(ks.length>60) delete S.pr[ks.shift()];
  S.cr.snz=null; save(); voxStop(); crHide();
  crClearDelivered(d,k); scheduleNotifications();
}
async function crClearDelivered(d,k){
  const LN=NATIVE&&PL.LocalNotifications; if(!LN||!LN.getDeliveredNotifications) return;
  try{const r=await LN.getDeliveredNotifications(); const ids=(r.notifications||[]).filter(n=>{const x=n.extra||{};return x.crd===d&&x.crk===k||(x.crd===d&&k==="*")}).map(n=>({id:n.id}));
    if(ids.length) await LN.removeDeliveredNotifications({notifications:ids});}catch(e){}
}
setInterval(crCheck,20000);

function crFollowIds(b){return [1000+b*3,1001+b*3,1002+b*3]}
const _vxKindCr=vxKindOf;
vxKindOf=function(id){
  if(id>=920&&id<934) return "tawba";
  if(id>=1000&&id<1105) return CRP[Math.floor((id-1000)/3)%5][0];
  if(id>=1190&&id<1195) return CRP[id-1190][0];
  return _vxKindCr(id);
};
morningNotifs=function(list,h,m){
  const now=new Date(), n=crNom();
  for(let i=0;i<14;i++){const d=new Date(today);d.setDate(d.getDate()+i);d.setHours(h,m,0,0);if(d<=now)continue;
    const [,src,fear,hope,act]=coeurOf(isoOff(i)).x;
    list.push({id:700+i,title:crF(CRT.nMT,{n}),body:fear,largeBody:fear+"\n\n🌱 "+hope+"\n\n👉 "+act+"\n— "+src,schedule:{at:d,allowWhileIdle:true}})}
};
function crEveningNotifs(list){
  if(S.cr.call===false) return;
  const [h,m]=(S.cr.eve||"21:30").split(":").map(Number), now=new Date(), n=crNom();
  for(let i=0;i<14;i++){const d=new Date(today);d.setDate(d.getDate()+i);d.setHours(h,m,0,0);if(d<=now)continue;
    const b=CRT.nEB[(dayIndex()+i)%CRT.nEB.length];
    list.push({id:920+i,title:crF(CRT.nET,{n}),body:b,largeBody:b+"\n\n"+CRT.eTx,schedule:{at:d,allowWhileIdle:true}})}
}
const _prayerNotifsCr=prayerNotifs;
prayerNotifs=function(list){
  const tmp=[]; _prayerNotifsCr(tmp);
  const n=crNom(), ex=crExempt(), ins=S.cr.insist!==false;
  tmp.forEach(x=>{
    const b=x.id-800, i=Math.floor(b/5), j=b%5, [k,l]=CRP[j], d=isoOff(i), p=t(l);
    if(crDone(d,k)) return;
    if(ex) return;
    list.push({...x,title:crF(CRT.pT,{n,p})+" · "+(x.title.split("·").pop()||"").trim(),body:crF(CRT.pB,{}),largeBody:crF(CRT.pB,{})+"\n\n"+CRH[b%CRH.length][1],
      actionTypeId:"djh_pray",extra:{crd:d,crk:k}});
    if(!ins) return;
    [7,15,25].forEach((mn,r)=>{const at=new Date(x.schedule.at.getTime()+mn*60000);
      list.push({id:crFollowIds(b)[r],title:crF(CRT.pFT[r],{n,p}),body:crF(CRT.pF[r],{n,p}),largeBody:crF(CRT.pF[r],{n,p}),
        schedule:{at,allowWhileIdle:true},actionTypeId:"djh_pray",extra:{crd:d,crk:k},ongoing:r===2,autoCancel:r!==2})});
  });
  crEveningNotifs(list);
};
let crTypesDone=false;
if(typeof doSchedule==="function"){
  const _doScheduleCr=doSchedule;
  doSchedule=async function(){
    const LN=NATIVE&&PL.LocalNotifications;
    if(LN&&!crTypesDone&&LN.registerActionTypes){try{await LN.registerActionTypes({types:[{id:"djh_pray",actions:[{id:"done",title:CRT.aDone,foreground:true},{id:"snooze",title:CRT.aSnz}]}]});crTypesDone=true}catch(e){}}

      try{PL.LocalNotifications.removeDeliveredNotifications({notifications:[{id:no.id}]}).catch(()=>{})}catch(e){}

    setTimeout(crCheck,700);
  });
}

function bbMonths(b){const d=new Date(b+"T00:00:00"),n=new Date();let m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();if(n.getDate()<d.getDate())m--;return m}
function bbAgeTxt(m){const y=Math.floor(m/12),r=m%12;return y?`${y} an${y>1?"s":""}${r?` ${r} mois`:""}`:`${m} mois`}
function bbKids(){return (S.family||[]).filter(f=>(f.rel==="son"||f.rel==="daughter")&&f.birth&&bbMonths(f.birth)>=6&&bbMonths(f.birth)<61)}
function bbKid(){const L=bbKids();return L.find(k=>k.id===S.bb.cur)||L[0]||null}
function bbStage(m){return BBST.find(s=>m<s.max)||BBST[BBST.length-1]}
function bbCfg(k){return S.bb.k[k.id]=S.bb.k[k.id]||{lang:"both",lim:0}}
function bbProg(k){return S.bb.p[k.id]=S.bb.p[k.id]||{w:{},t:{},acc:[]}}

const bbAddDays=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return iso(d)};

async function bbSay(k,parts){
  // le prénom n'est prononcé qu'une seule fois, au début du jeu
  if(BB){if(!BB.named){BB.named=1;parts=["N",bbIntro(k),...parts.filter(p=>p!=="N")]}else parts=parts.filter(p=>p!=="N")}
  voxStop(); const g=voxGen;
  for(const p of parts){
    if(g!==voxGen) return;
    if(p==="N"){
      const u=await bbNameUrl(k);if(u&&await playUrl(u,g))continue;
      const nk=BBN_[bbNorm(bbCfg(k).phon||k.name)]||BBN_[bbNorm(k.name)];
      if(nk&&await playUrl(await bbClipUrl(nk),g))continue;
      await ttsOne(bbCfg(k).phon||k.name,"fr-FR",g);continue}
    const [tx,l]=p; if(!tx) continue;
    if(tx===BB_IKHLAS&&await playUrl("https://everyayah.com/data/Husary_128kbps/112001.mp3",g)) continue;
    const l2=l.slice(0,2), key=voxKey(l2,tx);
    if(BBV[key]&&await playUrl(await bbClipUrl(key),g)) continue;
    const v=typeof VOX!=="undefined"&&VOX[key];
    if(v&&typeof v==="string"&&!v.startsWith("q:")&&await playUrl("voix/"+key+".mp3",g)) continue;
    await ttsOne(tx,l,g);

function bbW(k,key){const P=bbProg(k);return P.w[key]=P.w[key]||{s:0,c:0,l:0,n:""}}
function bbSeen(k,key){const x=bbW(k,key);x.s++;if(!x.n)x.n=bbAddDays(1);save()}
function bbAnswer(k,key,first){const x=bbW(k,key),P=bbProg(k);
  if(first){x.c++;x.l=Math.min(x.l+1,BBGAP.length-1);x.n=bbAddDays(BBGAP[x.l])}else{x.l=Math.max(0,x.l-1);x.n=bbDay()}
  P.acc.push(first?1:0);if(P.acc.length>12)P.acc.shift();save()}
const bbKnown=(k,key)=>(bbProg(k).w[key]||{}).l>=3;
function bbPool(k,cat){const m=bbMonths(k.birth),st=bbStage(m);return BBW.filter(w=>(cat?w[1]===cat:st.cats.includes(w[1]))&&w[2]<=Math.max(m,8))}
function bbChoices(k){const st=bbStage(bbMonths(k.birth)),P=bbProg(k);if(!st.ch[1])return 0;
  const a=P.acc,r=a.length>=5?a.slice(-6).reduce((x,y)=>x+y,0)/Math.min(6,a.length):.6;
  let n=st.ch[0];if(r>=.8)n=st.ch[1];if(r<.5)n=Math.max(2,st.ch[0]-1);return n}
function bbShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Séance du jour : révisions dues + mots nouveaux + parole de l'islam + jeu de l'âge
function bbSession(k){
  const m=bbMonths(k.birth),st=bbStage(m),P=bbProg(k),d=bbDay(),pool=bbPool(k);
  const due=bbShuffle(pool.filter(w=>{const x=P.w[w[0]];return x&&x.s>0&&x.n&&x.n<=d})).sort((a,b)=>(P.w[a[0]].l-P.w[b[0]].l)).slice(0,4);
  const fresh=pool.filter(w=>!P.w[w[0]]||!P.w[w[0]].s).sort((a,b)=>a[2]-b[2]||BBW.indexOf(a)-BBW.indexOf(b)).slice(0,st.k==="A"?4:3);
  const steps=[];
  if(st.k==="A"){fresh.concat(due).slice(0,6).forEach((w,i)=>steps.push({g:i%2?"cou":"img",w}));}
  else{
    fresh.forEach(w=>steps.push({g:"img",w}));
    due.forEach(w=>steps.push({g:(P.w[w[0]].s>=2?"show":"img"),w}));
    fresh.forEach(w=>{if(bbW(k,w[0]).s>=1)steps.push({g:"show",w})});
    if(st.cou&&steps.length<6&&pool.length) steps.push({g:"cou",w:pool[Math.floor(Math.random()*pool.length)]});
  }
  const ph=BBP.filter(p=>p[1]<=Math.max(m,8)).sort((a,b)=>((P.w["p_"+a[0]]||{}).s||0)-((P.w["p_"+b[0]]||{}).s||0))[0];
  if(ph) steps.push({g:"par",p:ph});
  if(st.cnt) steps.push({g:"cnt"});
  if(!steps.some(s=>s.g==="show"||s.g==="img")&&pool.length) steps.unshift({g:"img",w:pool[0]});
  return steps;
}

// ---------- Temps d'écran (OMS : court, et avec un parent) ----------
function bbLimit(k){return bbCfg(k).lim||bbStage(bbMonths(k.birth)).lim}
function bbUsed(k){return Math.round((bbProg(k).t[bbDay()]||0))}
function bbTick(k,s){const P=bbProg(k),d=bbDay();P.t[d]=(P.t[d]||0)+s;const ks=Object.keys(P.t).sort();while(ks.length>40)delete P.t[ks.shift()]}

// ---------- Page parent ----------
function bbLetterSvg(c,sz){return `<span class="bb-gl" style="font-size:${sz}px">${c}</span>`}
function bbShape(code,sz){const s=sz||120,col="#E46B4F";
  const P={c:`<circle cx="50" cy="50" r="40" fill="${col}"/>`,s:`<rect x="12" y="12" width="76" height="76" rx="4" fill="#3E86D6"/>`,t:`<path d="M50 10L92 88H8z" fill="#F2B632"/>`,
   h:`<path d="M50 86C20 64 8 48 8 32 8 18 19 10 30 10c9 0 16 5 20 12 4-7 11-12 20-12 11 0 22 8 22 22 0 16-12 32-42 54z" fill="#E0457B"/>`,e:`<path d="M50 6l12 30 32 2-25 20 9 32-28-18-28 18 9-32L6 38l32-2z" fill="#F2B632"/>`};
  return `<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true">${P[code]}</svg>`}
function bbPic(w,sz){const e=w[3];sz=sz||130;
  if(e[0]==="#"&&isNaN(+e.slice(1))) return bbShape(e.slice(1),sz);
  if(e[0]==="#") {const n=+e.slice(1);return `<span class="bb-gl bb-num" style="font-size:${sz*.8}px">${n}<small>${String(n).split("").map(c=>BBAD[c]).join("")}</small></span>`}
  if(e[0]==="@") return bbLetterSvg(e.slice(1),sz);
  return `<span class="bb-em" style="font-size:${sz}px">${e}</span>`}
function viewBebe(){

  <div class="bb-stats"><div><b>${known}</b><span>mots acquis</span></div><div><b>${learning}</b><span>en cours</span></div><div><b>${Math.floor(used/60)}</b><span>min aujourd'hui</span></div></div>
  <h3 class="lx-h">Jeux</h3><div class="bb-games">
   ${bbGame("img","🖼️","Imagier parlant","Il voit, il entend son prénom et le mot")}

    return `<button class="bb-cat" data-bbplay="img" data-bbcat="${c}"><span>${BBCAT[c]}</span><i><em style="width:${Math.round(kn/p.length*100)}%"></em></i><small>${kn}/${p.length}</small></button>`}).join("")}</div>

   <label for="bb-lang">Langue<select id="bb-lang"><option value="both" ${cfg.lang==="both"?"selected":""}>Français + arabe</option><option value="fr" ${cfg.lang==="fr"?"selected":""}>Français</option><option value="ar" ${cfg.lang==="ar"?"selected":""}>Arabe</option></select></label>

   <p class="note" id="bb-recmsg">${cfg.rec?"✓ Votre voix est utilisée pour dire son prénom.":"Avec votre propre voix, votre enfant reconnaît mieux son prénom."}</p></div>

function bbGame(g,ic,t1,t2){return `<button class="bb-game" data-bbplay="${g}"><span class="bb-gic">${ic}</span><b>${t1}</b><span>${t2}</span></button>`}

  <div class="seg"><button type="button" data-bbsex="daughter" aria-pressed="${S.bb.sex!=="son"}">Fille</button><button type="button" data-bbsex="son" aria-pressed="${S.bb.sex==="son"}">Garçon</button></div>
  <button class="btn" data-bbadd>Ajouter</button></div>`}

function bbAllTexts(k,steps){
  const out=[],F=t=>out.push({l:"fr",t}),A=t=>out.push({l:"ar",t});
  const ws=steps?steps.filter(s=>s.w).map(s=>s.w):BBW, ps=steps?steps.filter(s=>s.p).map(s=>s.p):BBP;
  ["On va jouer ensemble !","Regarde !","Coucou !","On compte ensemble ! Touche chaque image.","Répète avec moi :","Bravo !","C'est fini pour aujourd'hui. Maintenant, on joue avec papa et maman !",...BBOK_F].forEach(F);
  ["هَيَّا نَلْعَبُ مَعًا","اُنْظُرْ","اُنْظُرِي","أَحْسَنْتَ","أَحْسَنْتِ","قُلْ مَعِي","قُولِي مَعِي","هَيَّا نَعُدُّ"].forEach(A);
  ws.forEach(w=>{F(bbCap(w[4])+" !");if(w[6])F(w[6]);F("Montre-moi "+w[4]+" !");F("Ça, c'est "+w[4]+".");F(bbOu(w));A(w[5]);A("أَيْنَ "+w[5]+"؟")});
  BBN.forEach(([f,a])=>{F(bbCap(f)+" !");A(a)});
  ps.forEach(p=>{if(p[3]!==BB_IKHLAS)A(p[3]);F(p[5])});
  const seen=new Set();return out.filter(x=>{const id=x.l+"|"+x.t;if(seen.has(id))return false;seen.add(id);return true});
}
// ---------- Mode enfant (plein écran verrouillé) ----------
let BB=null;
function bbOpen(k,mode,cat){
  let steps=[];const pool=bbPool(k,cat);
  if(mode==="session") steps=bbSession(k);
  else if(mode==="img") steps=bbOrder(k,pool).slice(0,10).map(w=>({g:"img",w}));
  else if(mode==="cou") steps=bbShuffle(pool).slice(0,6).map(w=>({g:"cou",w}));
  else if(mode==="show"){const seen=pool.filter(w=>(bbProg(k).w[w[0]]||{}).s);steps=bbOrder(k,seen.length>=4?seen:pool).slice(0,8).map(w=>({g:"show",w}))}
  else if(mode==="cnt") steps=[{g:"cnt"},{g:"cnt"},{g:"cnt"}];
  else if(mode==="par") steps=BBP.filter(p=>p[1]<=Math.max(bbMonths(k.birth),8)).map(p=>({g:"par",p}));
  else if(mode==="let") steps=bbOrder(k,BBW.filter(w=>w[1]==="let")).slice(0,6).map(w=>({g:"img",w})).concat(bbShuffle(BBW.filter(w=>w[1]==="let"&&(bbProg(k).w[w[0]]||{}).s)).slice(0,4).map(w=>({g:"show",w})));
  bbStart(k,steps);
}
// d'abord ce qui est à revoir, puis le nouveau, puis le reste
function bbOrder(k,pool){const P=bbProg(k).w,d=bbDay();
  const due=pool.filter(w=>P[w[0]]&&P[w[0]].n<=d),nw=pool.filter(w=>!P[w[0]]),rest=pool.filter(w=>P[w[0]]&&P[w[0]].n>d);
  return [...bbShuffle(due),...nw,...bbShuffle(rest)]}
function bbStart(k,steps,lim){
  bbClose(true);
  BB={k,steps,i:-1,stars:0,t0:Date.now(),tick:null};
  const el=document.createElement("div");el.id="bb-play";
  el.innerHTML=`<div class="bb-top"><span class="bb-name">${esc(k.name)}</span><div class="bb-bar"><i></i></div><button class="bb-x" aria-label="Maintenir pour quitter"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16"/></svg><span>✕</span></button></div><div class="bb-stage"></div><div class="bb-stars"></div>`;
  document.body.appendChild(el);document.documentElement.classList.add("cr-lock");
  BB.tick=setInterval(()=>{if(!BB)return;bbTick(k,1);const n=BB.steps.length||1;el.querySelector(".bb-bar i").style.width=Math.min(100,(BB.i+1)/n*100)+"%"},1000);
  try{bbPrefetch(bbAllTexts(k,steps).map(x=>voxKey(x.l,x.t)).filter(x=>BBV[x]))}catch(e){}
  if(lim){BB.over=1;bbEnd(true)}else bbNext();
}
function bbClose(silent){if(!BB&&!document.getElementById("bb-play"))return;if(BB&&BB.tick)clearInterval(BB.tick);const el=document.getElementById("bb-play");el&&el.remove();document.documentElement.classList.remove("cr-lock");BB=null;if(!silent){voxStop();save();const y=scrollY;render();scrollTo(0,y)}}
function bbStageEl(){return document.querySelector("#bb-play .bb-stage")}
function bbNext(){if(!BB)return;BB.i++;const s=BB.steps[BB.i];if(!s){bbEnd(false);return}BB.miss=0;
  ({img:bbImg,cou:bbCou,show:bbShow,cnt:bbCnt,par:bbPar})[s.g](s)}
function bbNav(){return `<button class="bb-next" data-bbnext aria-label="Suivant">➜</button>`}

  bbStageEl().innerHTML=`<button class="bb-card bb-pop" data-bbsay>${bbPic(w,150)}<b>${bbCap(w[4])}</b><span class="ar">${w[5]}</span></button>${bbNav()}`;

  if(key===w[0]){BB.lock=1;bbAnswer(k,w[0],!BB.miss);btn.classList.add("ok");bbStar();

  else{BB.miss++;btn.classList.remove("no");void btn.offsetWidth;btn.classList.add("no");

function bbCount(btn){const C=BB.cnt,k=BB.k;if(!C||btn.classList.contains("done"))return;

async function bbRecord(btn){
  const k=bbKid(),msg=document.getElementById("bb-recmsg");if(!k)return;
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const rec=new MediaRecorder(st),ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
    rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());const b=new Blob(ch,{type:rec.mimeType||"audio/webm"});
      try{const c=await caches.open("djh-bebe");await c.put("nom-"+k.id,new Response(b,{headers:{"Content-Type":b.type}}));bbNameUrls[k.id]=URL.createObjectURL(b);bbCfg(k).rec=1;save();
        msg.textContent="✓ Enregistré. Écoutez le résultat.";btn.textContent="🎙 Recommencer";const a=new Audio(bbNameUrls[k.id]);a.play().catch(()=>{})}catch(e){msg.textContent="L'enregistrement n'a pas pu être gardé."}};
    rec.start();let n=3;btn.disabled=true;msg.textContent=`🔴 Dites « ${k.name} » maintenant… ${n}`;
    const iv=setInterval(()=>{n--;if(n>0)msg.textContent=`🔴 Dites « ${k.name} » maintenant… ${n}`;else{clearInterval(iv);btn.disabled=false;rec.stop()}},1000);
  }catch(e){msg.textContent="Le micro n'est pas accessible sur ce téléphone. Autorisez le micro pour l'application, ou écrivez la prononciation ci-dessus."}
}

      if(!r){const f=await fetch(U);if(f.ok){await c.put("naskh-v1",f.clone());r=f}}
      if(r)buf=await r.arrayBuffer()}catch(e){}

(function(){
 var A=document.getElementById("djh-app");window.DJH_BOOTV=DJH_BOOTV;
 function cmp(a,b){a=String(a).split(".").map(Number);b=String(b).split(".").map(Number);for(var i=0;i<3;i++){var d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
 function run(code){var bad=false,f=function(){bad=true};window.addEventListener("error",f);var s=document.createElement("script");s.text=code;document.body.appendChild(s);window.removeEventListener("error",f);return !bad}
 var nat=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
 if(nat){try{
  var L=localStorage,v=L.getItem("djh-ota-v"),h=L.getItem("djh-ota-html");
  if(v&&cmp(v,DJH_BOOTV)<=0){L.removeItem("djh-ota-v");L.removeItem("djh-ota-html")}
  else if(v&&h&&L.getItem("djh-ota-bad")!==v){
   var d=new DOMParser().parseFromString(h,"text/html"),a2=d.getElementById("djh-app");
   if(a2){
    var olds=[].slice.call(document.head.querySelectorAll("style"));

   }

 }catch(e){}}
 run(A.textContent);
